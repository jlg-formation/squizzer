          - "L'utilisation simultanée de plusieurs LLM pour générer la réponse"
          - "La recherche effectuée à la fois sur du texte et sur des images"
          - "L'alternance entre recherche en ligne et recherche hors ligne"
        correct: 0
        explanation:
          "La recherche hybride combine la similarité sémantique des embeddings

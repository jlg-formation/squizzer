  - id: "optimisation-performance"
    title: "Optimisation et performance des agents intelligents"
    questions:
      - id: "q1"
        question:
          'Dans l''évaluation d''un système RAG, que mesure la métrique de
          "faithfulness" ?'
        answers:
          - "La rapidité avec laquelle l'agent retourne une réponse à
            l'utilisateur"
          - "La fidélité de la réponse générée par rapport aux documents
            récupérés, sans hallucination"
          - "Le pourcentage de documents pertinents présents dans le top-k
            retourné"
          - "Le coût en tokens consommés par requête envoyée au LLM"
        correct: 1
        explanation:
          "La faithfulness évalue si la réponse générée est bien fondée sur le
          contexte récupéré, sans inventer d'informations absentes des sources."
      - id: "q2"
        question:
          "Que mesure principalement le Mean Reciprocal Rank (MRR) dans un
          système de recherche d'information ?"
        answers:
          - "La latence moyenne des requêtes adressées à la base vectorielle"
          - "La proportion de réponses jugées correctes par les utilisateurs
            finaux"
          - "L'inverse moyen du rang de la première réponse pertinente retournée"
          - "Le rappel cumulé sur l'ensemble des documents indexés"
        correct: 2
        explanation:
          "Le MRR calcule la moyenne des inverses du rang du premier résultat
          pertinent : plus la bonne réponse est haut placée, plus le score est
          élevé."
      - id: "q3"
        question:
          "À quoi sert la technique HyDE (Hypothetical Document Embeddings) dans
          un pipeline RAG ?"
        answers:
          - "À générer une réponse hypothétique avec le LLM, puis utiliser son
            embedding pour la recherche"
          - "À compresser les embeddings pour réduire la taille de la base
            vectorielle"
          - "À chiffrer les documents stockés afin de garantir leur
            confidentialité"
          - "À déduplicater automatiquement les chunks similaires lors de
            l'indexation"
        correct: 0
        explanation:
          "HyDE demande au LLM de produire une réponse hypothétique à la
          question, puis convertit ce texte en embedding pour mieux retrouver
          des documents sémantiquement proches."
      - id: "q4"
        question:
          "Quel est l'objectif principal de l'hybrid search dans un système RAG
          ?"
        answers:
          - "Combiner plusieurs LLM pour générer la meilleure réponse possible"
          - "Mélanger recherche lexicale (BM25) et recherche sémantique
            (vectorielle) pour améliorer le rappel"
          - "Alterner entre une base SQL et une base NoSQL selon la requête"
          - "Distribuer la charge entre plusieurs serveurs d'inférence"
        correct: 1
        explanation:
          "L'hybrid search fusionne les scores de la recherche par mots-clés
          (BM25) et de la recherche vectorielle pour combiner précision lexicale
          et compréhension sémantique."
      - id: "q5"
        question:
          "Quel bénéfice principal apporte un mécanisme de cache dans un agent
          intelligent RAG en production ?"
        answers:
          - "Il garantit la fraîcheur permanente des données retournées par
            l'agent"
          - "Il améliore la qualité sémantique des embeddings stockés"
          - "Il réduit la latence et le coût en évitant de recalculer les
            requêtes déjà traitées"
          - "Il remplace la nécessité d'une base vectorielle dans le pipeline"
        correct: 2
        explanation:
          "Le cache (sémantique ou exact) renvoie directement des réponses déjà
          calculées pour des requêtes similaires, ce qui diminue la latence et
          la consommation de tokens."
      - id: "q6"
        question:
          "Que mesure la métrique « faithfulness » dans l'évaluation d'un agent
          RAG ?"
        answers:
          - "La rapidité de génération de la réponse par le modèle"
          - "Le degré auquel la réponse générée est fidèle aux documents
            récupérés"
          - "La pertinence des documents retournés par le retriever"
          - "Le coût total en tokens consommés par requête"
        correct: 1
        explanation:
          "La faithfulness évalue si la réponse produite est réellement étayée
          par le contexte récupéré, sans hallucination ni invention."
      - id: "q7"
        question:
          "À quoi sert principalement la technique du reranking dans un pipeline
          RAG ?"
        answers:
          - "À reformuler la requête utilisateur avant la recherche"
          - "À mettre en cache les réponses fréquentes pour réduire la latence"

  - id: applications-graphrag-structrag
    title: "Applications avancées avec GraphRAG et StructRAG"
    questions:
      - id: q1
        question:
          "Lors de la conception d'un agent exploitant un graphe de
          connaissances (GraphRAG), quelle étape est spécifique par rapport à un
          RAG classique ?"
        answers:
          - "Découper les documents en chunks de texte puis les vectoriser sans
            relation entre eux"
          - "Construire un graphe de nœuds (entités) et d'arêtes (relations) à
            partir du corpus, puis interroger ce graphe"
          - "Indexer uniquement les titres des documents dans une base SQL"
          - "Entraîner un modèle de langage à partir de zéro sur le corpus
            métier"
        correct: 1
        explanation:
          "GraphRAG repose sur l'extraction d'entités et de relations pour
          construire un graphe de connaissances que l'agent interroge, là où un
          RAG classique se contente d'embeddings de chunks de texte."
      - id: q2
        question:
          "Dans un workflow type StructRAG pour générer un rapport dynamique,
          quelle séquence d'étapes est correcte ?"
        answers:
          - "Génération libre du rapport, puis structuration manuelle a
            posteriori"
          - "Identification du schéma cible, récupération structurée des
            données, remplissage du gabarit, puis rendu du rapport"
          - "Vectorisation du rapport final, puis recherche des sources
            correspondantes"
          - "Entraînement d'un modèle dédié au format de sortie avant toute
            interrogation"
        correct: 1
        explanation:
          "StructRAG impose d'abord de définir un schéma structuré, puis de
          récupérer les données conformes à ce schéma avant de remplir le
          gabarit du rapport, ce qui garantit un rendu reproductible."
      - id: q3
        question:
          "Pourquoi GraphRAG est-il particulièrement adapté à la génération de
          synthèses transverses portant sur plusieurs documents ?"
        answers:
          - "Parce qu'il ignore les relations entre entités pour aller plus vite"
          - "Parce qu'il exploite les liens du graphe pour relier des
            informations issues de documents distincts autour d'une même entité"
          - "Parce qu'il limite la réponse à un seul document source à la fois"
          - "Parce qu'il remplace systématiquement le LLM par une requête SQL"
        correct: 1
        explanation:
          "Le graphe de connaissances relie les entités mentionnées dans des
          documents différents, ce qui permet à l'agent d'agréger et de
          synthétiser des informations transverses autour d'un même nœud."
      - id: q4
        question:
          "Pour extraire des informations structurées telles que des tableaux
          financiers depuis des rapports d'entreprise, quelle approche StructRAG
          est la plus appropriée ?"
        answers:
          - "Demander au LLM une réponse en texte libre sans schéma"
          - "Définir un schéma typé (colonnes, unités, périodes) et contraindre

            contiennent"
          - "Augmenter la température du modèle pour qu'il ignore les
            instructions malveillantes"
        correct: 2
        explanation:
          "La séparation stricte entre instructions de confiance et données
          externes, avec neutralisation des instructions injectées, est la
          défense de base contre la prompt injection."
      - id: q18
        question:
          "Comment tester unitairement de manière fiable la logique
          d'orchestration d'un agent qui appelle un LLM ?"
        answers:
          - "Appeler le vrai LLM à chaque test pour garantir un comportement

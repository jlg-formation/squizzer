          - "Les paramètres de configuration du modèle de langage utilisé"
          - "Les fichiers journaux générés pendant l'exécution de l'agent"
        correct: 0
        explanation:
          "Un tool est une fonction exposée à l'agent (avec un nom et une
          description) que le LLM peut choisir d'invoquer pour étendre ses
          capacités au-delà de la simple génération de texte."
      - id: q13
        question: "À quoi sert la mémoire conversationnelle d'un agent ?"
        answers:
          - "À conserver le contexte des échanges précédents pour assurer la
            cohérence des réponses au fil de la conversation"
          - "À sauvegarder définitivement les poids du modèle de langage"
          - "À chiffrer les communications réseau entre l'agent et l'utilisateur"
          - "À accélérer les calculs matriciels du GPU"
        correct: 0
        explanation:
          "La mémoire conversationnelle stocke les tours de dialogue passés afin
          que l'agent puisse s'y référer et maintenir la continuité du contexte
          avec l'utilisateur."
      - id: q14
        question:
          "Quelle stratégie est couramment employée pour gérer l'historique d'un
          agent quand la fenêtre de contexte du LLM devient trop petite ?"
        answers:
          - "Résumer ou tronquer les échanges anciens (summary/window memory)
            pour ne conserver que l'essentiel"
          - "Augmenter automatiquement la taille de la fenêtre de contexte du
            modèle"
          - "Supprimer le prompt système pour libérer des tokens"
          - "Ignorer toute nouvelle question tant que l'historique n'est pas
            vide"
        correct: 0
        explanation:
          "Pour rester sous la limite de tokens, on applique des stratégies
          comme la fenêtre glissante ou le résumé progressif (summary memory)
          qui condensent l'historique tout en préservant le contexte utile."
      - id: q15
        question:
          "Quel est l'intérêt principal du streaming de la réponse générée par
          un agent LLM ?"
        answers:
          - "Afficher progressivement la réponse token par token pour améliorer
            la perception de réactivité côté utilisateur"
          - "Réduire la consommation mémoire RAM du serveur de moitié"
          - "Garantir que la réponse soit factuellement correcte"
          - "Chiffrer la réponse pendant son transfert réseau"
        correct: 0
        explanation:
          "Le streaming permet d'envoyer les tokens au fur et à mesure de leur
          génération, ce qui réduit la latence perçue et offre une expérience
          utilisateur plus fluide, notamment dans les interfaces de chat."
      - id: q16
        question:
          "Quelle stratégie de fallback est la plus pertinente lorsqu'un appel à
          un outil externe échoue dans un agent RAG ?"
        answers:
          - "Interrompre immédiatement la session et renvoyer une exception
            brute à l'utilisateur"
          - "Réessayer avec un backoff exponentiel puis basculer sur une réponse
            dégradée signalée comme telle"
          - "Ignorer silencieusement l'erreur et générer une réponse à partir
            des connaissances internes du LLM"
          - "Relancer l'outil en boucle jusqu'à obtenir un succès, sans limite
            de tentatives"
        correct: 1
        explanation:
          "Un agent robuste combine retries avec backoff et un mode dégradé
          explicite, afin de préserver l'expérience tout en signalant la
          limitation."
      - id: q17
        question:
          "Quelle pratique réduit efficacement le risque de prompt injection
          dans un agent intelligent ?"
        answers:
          - "Concaténer directement le contenu récupéré par le RAG au prompt
            système sans transformation"
          - "Faire confiance aux instructions présentes dans les documents

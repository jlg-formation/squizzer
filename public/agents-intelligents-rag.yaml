          - "À fusionner les résultats d'une recherche dense et d'une recherche
            lexicale"
        correct: 2
        explanation:
          "Le reranking applique un modèle plus précis (souvent un
          cross-encoder) sur les top-k résultats afin de remonter les documents
          les plus pertinents en tête."
      - id: "q8"
        question:
          "Que désigne la « hybrid search » dans le contexte d'un agent RAG ?"
        answers:
          - "La combinaison d'une recherche vectorielle dense et d'une recherche

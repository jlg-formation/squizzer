  - id: optimisation-performance
    title: "Optimisation et performance des agents intelligents"
    questions:
      - id: q1
        question:
          "Quelle métrique mesure la proportion de réponses correctes fournies
          par un agent intelligent sur l'ensemble des requêtes évaluées ?"
        answers:
          - "L'accuracy (taux de bonnes réponses)"
          - "La latence moyenne par requête"
          - "Le nombre de tokens consommés"
          - "Le taux de rafraîchissement de l'index"
        correct: 0
        explanation:
          "L'accuracy quantifie la part de réponses jugées correctes parmi
          toutes les requêtes évaluées et constitue une métrique de précision
          standard pour un agent."
      - id: q2
        question:
          "Que mesure la métrique de faithfulness appliquée à un agent RAG ?"
        answers:
          - "La rapidité avec laquelle l'agent renvoie une réponse"
          - "Le degré de fidélité de la réponse aux sources documentaires
            récupérées"
          - "Le coût d'inférence du modèle de langage utilisé"
          - "La diversité lexicale des réponses générées"
        correct: 1
        explanation:
          "La faithfulness évalue si la réponse générée est fidèlement étayée
          par les passages récupérés, sans hallucination ni ajout d'informations
          non sourcées."
      - id: q3
        question:
          "Que représente la métrique recall@k utilisée pour évaluer le
          retrieval d'un agent RAG ?"
        answers:
          - "Le temps moyen pour récupérer k documents"
          - "Le nombre de tokens présents dans les k premiers résultats"
          - "La proportion de documents pertinents présents parmi les k premiers
            résultats retournés"
          - "Le coût financier de k appels au modèle"
        correct: 2
        explanation:
          "Le recall@k indique la fraction des documents pertinents
          effectivement présents dans les k premiers résultats du retriever,
          mesurant ainsi la pertinence du retrieval."
      - id: q4
        question:
          "Quelle approche permet de mesurer correctement la latence d'un agent
          intelligent ?"
        answers:
          - "Compter le nombre de documents indexés dans la base de
            connaissances"
          - "Mesurer la taille en octets du prompt envoyé au modèle"
          - "Évaluer la précision des réponses sur un jeu de test"
          - "Chronométrer le temps écoulé entre l'envoi de la requête et la
            réception de la réponse complète"
        correct: 3
        explanation:
          "La latence se mesure en chronométrant la durée entre l'émission de la
          requête utilisateur et la réception de la réponse finale de l'agent,
          généralement en millisecondes ou secondes."
      - id: q5
        question:
          "Comment estime-t-on usuellement le coût d'une requête traitée par un
          agent basé sur un LLM ?"
        answers:
          - "En multipliant le nombre de tokens en entrée et en sortie par le
            tarif unitaire du modèle"
          - "En comptant uniquement le nombre de caractères de la question
            utilisateur"
          - "En mesurant la taille du fichier de configuration de l'agent"
          - "En évaluant le score de faithfulness de la réponse"
        correct: 0
        explanation:
          "Le coût par requête s'obtient en additionnant les tokens d'entrée et
          de sortie consommés, multipliés par le tarif unitaire facturé par le
          fournisseur du modèle."
      - id: q6
        question:
          "Quel est l'impact principal attendu d'un agent intelligent bien conçu
          sur la productivité d'un collaborateur ?"
        answers:
          - "Réduire le temps consacré à la recherche d'information et aux
            tâches répétitives, afin de recentrer le collaborateur sur les
            activités à forte valeur ajoutée"
          - "Remplacer intégralement le collaborateur sur l'ensemble de ses
            missions métier"
          - "Augmenter mécaniquement le nombre d'heures travaillées par jour"
          - "Supprimer le besoin de toute validation humaine sur les décisions
            critiques"
        correct: 0
        explanation:
          "Un agent intelligent automatise la recherche documentaire et les
          tâches répétitives, ce qui libère du temps pour les activités à valeur
          ajoutée tout en conservant l'humain dans la boucle décisionnelle."
      - id: q7
        question:
          "À quoi sert la technique de re-ranking dans un pipeline RAG ?"
        answers:
          - "À chiffrer les documents stockés dans la base vectorielle"
          - "À réordonner les documents candidats récupérés selon leur
            pertinence réelle vis-à-vis de la requête, avant transmission au LLM"
          - "À générer de nouvelles questions à partir de la requête initiale"
          - "À compresser les embeddings pour réduire la taille de l'index"
        correct: 1
        explanation:
          "Le re-ranking applique un modèle de scoring fin (souvent un
          cross-encoder) sur les top-k documents retournés par la recherche
          vectorielle, afin d'améliorer la précision du contexte fourni au LLM."
      - id: q8
        question:
          "En quoi consiste la technique de query rewriting dans un agent RAG ?"
        answers:
          - "Réécrire ou reformuler la requête utilisateur pour la rendre plus
            précise, plus complète ou mieux adaptée à la recherche documentaire"
          - "Réécrire le contenu des documents indexés pour les uniformiser"
          - "Traduire automatiquement la réponse finale dans la langue de
            l'utilisateur"
          - "Réécrire le prompt système du LLM à chaque interaction"
        correct: 0
        explanation:
          "Le query rewriting transforme la requête initiale, parfois ambiguë ou
          incomplète, en une formulation enrichie ou clarifiée afin d'améliorer
          la qualité des résultats retournés par le retriever."
      - id: q9
        question:
          "Quel est le principe de la technique HyDE (Hypothetical Document
          Embeddings) ?"
        answers:
          - "Indexer uniquement les documents qui contiennent des hypothèses
            scientifiques"
          - "Générer un embedding directement à partir de la question, sans
            passer par un document"
          - "Demander au LLM de générer un document hypothétique qui répondrait
            à la requête, puis utiliser l'embedding de ce document pour la
            recherche vectorielle"
          - "Stocker plusieurs versions hypothétiques de chaque document dans
            l'index vectoriel"
        correct: 2
        explanation:
          "HyDE fait générer par le LLM une réponse hypothétique à la question,
          dont l'embedding est ensuite utilisé pour la recherche : ce vecteur,
          plus proche sémantiquement des documents pertinents, améliore le
          rappel."
      - id: q10
        question: "Quel est l'objectif principal du multi-query retrieval ?"
        answers:
          - "Limiter le nombre de requêtes envoyées au retriever pour réduire
            les coûts"
          - "Générer plusieurs reformulations de la requête initiale et
            fusionner les résultats afin d'améliorer le rappel et la robustesse"
          - "Interroger plusieurs LLM différents en parallèle pour comparer
            leurs réponses"
          - "Exécuter la même requête plusieurs fois pour mesurer la latence
            moyenne"
        correct: 1
        explanation:
          "Le multi-query retrieval consiste à générer plusieurs variantes de la
          requête utilisateur, à exécuter chaque variante contre l'index puis à
          fusionner les résultats, ce qui réduit la dépendance à une formulation
          unique et améliore le rappel."
      - id: q11
        question:
          "Quel est le principal bénéfice du caching des réponses fréquentes
          dans un agent intelligent ?"
        answers:
          - "Réduire la latence et le coût en évitant de réinterroger le LLM
            pour des requêtes identiques ou similaires"
          - "Améliorer la qualité sémantique des réponses générées par le modèle"
          - "Augmenter la taille de la fenêtre de contexte du LLM utilisé"
          - "Garantir que chaque requête déclenche un nouvel appel au modèle
            pour plus de fraîcheur"
        correct: 0
        explanation:
          "Le cache stocke les réponses déjà calculées et les renvoie
          directement pour des requêtes récurrentes, ce qui diminue la latence
          et les appels payants au LLM."
      - id: q12
        question:
          "Que permet la quantization d'un modèle de langage pour améliorer la
          performance d'un agent ?"
        answers:
          - "Réduire la précision numérique des poids (par ex. en INT8 ou INT4)
            pour diminuer la mémoire et accélérer l'inférence"
          - "Augmenter le nombre de paramètres du modèle pour le rendre plus
            précis"
          - "Chiffrer les poids du modèle afin de protéger la propriété
            intellectuelle"
          - "Convertir le modèle en un format vectoriel adapté à la recherche
            sémantique"
        correct: 0
        explanation:
          "La quantization réduit la précision des poids (FP16 vers INT8/INT4
          par exemple), ce qui diminue l'empreinte mémoire et accélère
          l'inférence avec une perte de qualité limitée."
      - id: q13
        question:
          "Comment choisir un top-k optimal lors de la récupération de documents
          dans un pipeline RAG ?"
        answers:
          - "Trouver un compromis entre rappel suffisant et bruit/contexte
            limité, en évaluant la qualité des réponses sur un jeu de test"
          - "Choisir systématiquement la valeur la plus élevée possible pour
            maximiser le rappel"
          - "Fixer k=1 pour garantir la réponse la plus pertinente"
          - "Utiliser une valeur aléatoire à chaque requête pour diversifier les
            sources"
        correct: 0
        explanation:
          "Un top-k trop petit dégrade le rappel, un top-k trop grand introduit
          du bruit et sature le contexte. On l'ajuste empiriquement via des
          métriques de qualité sur un jeu d'évaluation."
      - id: q14
        question:
          "En quoi consiste l'A/B testing d'un agent intelligent en production ?"
        answers:
          - "Router une partie du trafic vers une variante B de l'agent et
            comparer ses métriques à celles de la variante A en conditions
            réelles"
          - "Tester l'agent uniquement en environnement de développement avant
            tout déploiement"
          - "Exécuter deux fois la même requête sur le même agent pour vérifier
            la reproductibilité"
          - "Comparer deux LLM différents en local sans exposer aucune variante
            aux utilisateurs"
        correct: 0
        explanation:
          "L'A/B testing consiste à exposer en parallèle deux versions de
          l'agent à des sous-ensembles d'utilisateurs et à comparer des
          métriques (qualité, latence, satisfaction) pour décider de la
          meilleure variante."
      - id: q15
        question:
          "Quelle pratique relève de l'apprentissage continu d'un agent RAG ?"
        answers:
          - "Mettre à jour régulièrement la base de connaissances et réindexer
            les nouveaux documents pour refléter l'état actuel de l'information"
          - "Geler définitivement la base vectorielle après le premier
            déploiement"
          - "Réentraîner le LLM de base à chaque nouvelle requête utilisateur"
          - "Supprimer l'historique des interactions pour éviter tout biais
            d'apprentissage"
        correct: 0
        explanation:
          "L'apprentissage continu d'un agent RAG passe avant tout par
          l'actualisation et la réindexation régulière de la base de
          connaissances afin que les réponses restent à jour."
      - id: q16
        question:
          "À quoi sert une boucle de feedback utilisateur dans le cycle de vie
          d'un agent intelligent ?"
        answers:
          - "À collecter les signaux explicites et implicites des utilisateurs
            pour ajuster prompts, retrieval ou fine-tuning de l'agent"
          - "À chiffrer les échanges entre l'utilisateur et l'agent de bout en
            bout"
          - "À répliquer la base vectorielle sur plusieurs régions pour la haute
            disponibilité"
          - "À compresser les logs de production avant archivage"
        correct: 0
        explanation:
          "La boucle de feedback (pouces, notes, corrections, reformulations)
          alimente l'amélioration continue de l'agent : ajustement des prompts,
          du retrieval ou ré-entraînement ciblé."
      - id: q17
        question:
          "Qu'est-ce que la dérive (drift) d'un agent intelligent en production
          ?"
        answers:
          - "Une dégradation progressive des performances due à l'évolution des
            données d'entrée ou du contexte d'usage par rapport aux données de
            référence"
          - "Une panne matérielle du GPU hébergeant le modèle"
          - "Un changement de licence imposé par le fournisseur du LLM"
          - "Une perte de connexion réseau entre l'agent et la base vectorielle"
        correct: 0
        explanation:
          "Le drift désigne l'écart croissant entre la distribution des données
          vues en production et celle utilisée à la conception, entraînant une
          baisse de qualité des réponses."
      - id: q18
        question:
          "Quel indicateur est typiquement suivi en monitoring temps réel d'un
          agent intelligent ?"
        answers:
          - "La latence des réponses, le taux d'erreur et le coût en tokens par
            requête"
          - "La température ambiante du datacenter mesurée par capteur"
          - "Le nombre de commits Git poussés sur le dépôt de l'agent"
          - "La taille du logo affiché dans l'interface utilisateur"
        correct: 0
        explanation:
          "Le monitoring temps réel d'un agent surveille des métriques
          opérationnelles comme la latence, le taux d'erreur, la consommation de
          tokens et la qualité des réponses."
      - id: q19
        question:
          "Quelle est la fonction principale d'outils comme LangSmith ou
          Langfuse ?"
        answers:
          - "Fournir l'observabilité des agents LLM : traces, évaluations, suivi
            des prompts, des coûts et des performances"
          - "Héberger des modèles open source en remplacement de Hugging Face"
          - "Générer automatiquement le code source d'une application React"
          - "Servir de base de données relationnelle pour les embeddings"
        correct: 0
        explanation:
          "LangSmith et Langfuse sont des plateformes d'observabilité
          spécialisées LLM : elles tracent les exécutions de chaînes/agents,
          évaluent la qualité et suivent coûts et latences."
      - id: q20
        question:
          "Comment se présente le trade-off classique entre précision, coût et
          latence pour un agent LLM ?"
        answers:
          - "Augmenter la précision (modèle plus gros, plus de retrieval,
            reasoning étendu) tend à accroître coût et latence ; il faut
            arbitrer selon le cas d'usage"
          - "Précision, coût et latence évoluent toujours indépendamment et ne
            s'influencent pas"
          - "Réduire la latence améliore mécaniquement la précision sans impact
            sur le coût"
          - "Le coût n'a aucun lien avec le choix du modèle ou la taille du
            contexte"
        correct: 0
        explanation:
          "Améliorer la précision (modèle plus puissant, contexte enrichi,
          étapes de raisonnement) augmente généralement le coût en tokens et la
          latence ; l'arbitrage dépend des exigences métier."
  - id: ethique-conformite
    title: "Gestion des enjeux éthiques et de la conformité"
    questions:
      - id: q1
        question:
          "Qu'est-ce qu'un biais algorithmique dans le contexte d'un agent
          intelligent ?"
        answers:
          - "Une erreur ponctuelle de calcul provoquée par une panne matérielle"
          - "Une distorsion systématique des résultats produits par le modèle,
            défavorisant certains profils ou points de vue"
          - "Une optimisation volontaire visant à accélérer l'inférence du
            modèle"
          - "Un défaut de connexion réseau entre l'agent et sa base de retrieval"
        correct: 1
        explanation:
          "Un biais algorithmique est une distorsion systématique et
          reproductible des sorties d'un système, qui peut désavantager certains
          groupes ou favoriser certaines représentations."
      - id: q2
        question:
          "Quelle est une source fréquente de biais dans la base documentaire
          utilisée pour le retrieval d'un système RAG ?"
        answers:
          - "Le choix du moteur d'indexation vectorielle utilisé"
          - "La taille de la fenêtre de contexte du modèle de génération"
          - "Une sur-représentation de certaines sources, langues ou points de
            vue dans le corpus indexé"
          - "La latence du serveur hébergeant la base vectorielle"
        correct: 2
        explanation:
          "Les biais en RAG proviennent souvent du corpus lui-même : si
          certaines sources, langues ou opinions y sont sur-représentées, le
          retrieval renverra majoritairement ces contenus."
      - id: q3
        question:
          "Quelle pratique permet d'identifier des biais dans les réponses
          produites par un agent RAG ?"
        answers:
          - "Augmenter uniquement la température du modèle de génération"
          - "Évaluer les sorties sur un jeu de tests ciblé couvrant des profils,
            sujets et formulations variés"
          - "Réduire la taille des chunks indexés dans la base vectorielle"
          - "Désactiver la journalisation des requêtes utilisateur"
        correct: 1
        explanation:
          "L'identification des biais passe par une évaluation systématique sur
          un jeu de tests représentatif et diversifié, permettant de comparer
          les réponses selon différents profils ou formulations."
      - id: q4
        question:
          "Parmi les stratégies suivantes, laquelle contribue à mitiger les
          biais dans un système RAG ?"
        answers:
          - "Diversifier les sources du corpus et rééquilibrer leur
            représentation lors de l'indexation"
          - "Supprimer toutes les métadonnées associées aux documents indexés"
          - "Augmenter le nombre de tokens générés par réponse"
          - "Utiliser un seul fournisseur de contenu pour garantir la cohérence"
        correct: 0
        explanation:
          "Diversifier les sources et rééquilibrer leur poids dans l'index
          réduit la sur-représentation de certains points de vue et limite ainsi
          les biais transmis au modèle de génération."
      - id: q5
        question:
          "Quelle bonne pratique protège la confidentialité des données
          utilisateur dans un agent RAG en production ?"
        answers:
          - "Stocker les requêtes en clair dans des logs publics pour faciliter
            le débogage"
          - "Transmettre systématiquement les données brutes à des modèles tiers
            sans contrôle"
          - "Minimiser les données collectées, anonymiser les requêtes et
            restreindre l'accès aux logs"
          - "Indexer les données personnelles des utilisateurs dans la base
            vectorielle partagée"
        correct: 2
        explanation:
          "La protection de la confidentialité repose sur la minimisation des
          données, l'anonymisation des requêtes sensibles et un contrôle strict
          des accès aux journaux et aux index."
      - id: q6
        question:
          "Pourquoi anonymiser les données avant leur ingestion dans la base
          vectorielle d'un agent RAG ?"
        answers:
          - "Pour réduire la taille des embeddings générés"
          - "Pour empêcher la fuite de données personnelles via les réponses du
            modèle"
          - "Pour accélérer la recherche par similarité cosinus"
          - "Pour améliorer la précision sémantique des chunks"
        correct: 1
        explanation:
          "L'anonymisation supprime ou pseudonymise les données personnelles, ce
          qui évite qu'elles soient restituées par l'agent dans ses réponses ou
          exposées via les documents récupérés."
      - id: q7
        question:
          "Quelle obligation RGPD s'applique spécifiquement à un agent
          intelligent qui traite des données personnelles d'utilisateurs
          européens ?"
        answers:
          - "Stocker obligatoirement toutes les données dans des serveurs hors
            UE"
          - "Disposer d'une base légale de traitement et informer les personnes
            concernées"
          - "Chiffrer uniquement les embeddings, pas les documents sources"
          - "Limiter l'agent à un usage strictement commercial"
        correct: 1
        explanation:
          "Le RGPD impose une base légale (consentement, intérêt légitime, etc.)
          pour tout traitement de données personnelles ainsi qu'une information
          claire des personnes concernées sur l'usage de leurs données."
      - id: q8
        question:
          "Selon l'AI Act européen, comment est généralement classé un agent
          intelligent utilisé pour le tri automatisé de candidatures à
          l'embauche ?"
        answers:
          - "Système à risque minimal, sans obligation particulière"
          - "Système à risque limité, soumis seulement à transparence"
          - "Système à haut risque, soumis à des obligations renforcées"
          - "Système interdit en toutes circonstances"
        correct: 2
        explanation:
          "L'AI Act classe les systèmes d'IA utilisés en gestion des ressources
          humaines (tri de CV, évaluation de candidats) comme à haut risque, ce
          qui impose documentation, supervision humaine et évaluation de
          conformité."
      - id: q9
        question:
          "Que recouvre le droit à l'explication appliqué à une décision prise
          par un agent intelligent ?"
        answers:
          - "Le droit d'obtenir le code source complet du modèle utilisé"
          - "Le droit de recevoir une information compréhensible sur la logique
            de la décision"
          - "Le droit d'exiger la suppression définitive de l'agent"
          - "Le droit d'accéder gratuitement aux poids du modèle"
        correct: 1
        explanation:
          "Le droit à l'explication, notamment issu du RGPD pour les décisions
          automatisées, garantit à la personne concernée une information
          intelligible sur la logique sous-jacente de la décision, sans imposer
          la divulgation du code ou des poids."
      - id: q10
        question:
          "Pourquoi un agent RAG doit-il citer les sources des extraits utilisés
          dans sa réponse ?"
        answers:
          - "Pour augmenter artificiellement la longueur de la réponse"
          - "Pour permettre à l'utilisateur de vérifier l'information et
            renforcer la transparence"
          - "Pour réduire la consommation de tokens du modèle"
          - "Pour contourner les limitations du contexte du LLM"
        correct: 1
        explanation:
          "Citer les sources permet à l'utilisateur de vérifier la véracité des
          affirmations de l'agent et constitue un pilier de la transparence,
          condition essentielle de la confiance et de la conformité."
      - id: q11
        question:
          "Pourquoi journaliser les étapes de raisonnement et les appels
          d'outils d'un agent intelligent ?"
        answers:
          - "Pour réduire la latence des réponses de l'agent"
          - "Pour assurer la traçabilité des décisions et permettre un audit a
            posteriori"
          - "Pour augmenter automatiquement la taille de la fenêtre de contexte"
          - "Pour entraîner le modèle de fondation en continu"
        correct: 1
        explanation:
          "La journalisation des prompts, étapes intermédiaires et outils
          invoqués permet de reconstituer le cheminement d'une décision et de
          l'auditer en cas d'incident ou de contestation."
      - id: q12
        question:
          "Quelle pratique respecte le mieux le consentement de l'utilisateur
          lorsqu'un agent collecte ses données pour personnaliser ses réponses ?"
        answers:
          - "Activer la collecte par défaut et proposer un opt-out caché dans
            les paramètres"
          - "Demander un consentement explicite, éclairé et révocable avant
            toute collecte"
          - "Considérer que l'usage du service vaut consentement implicite à
            toute exploitation"
          - "Anonymiser les données après coup sans informer l'utilisateur"
        correct: 1
        explanation:
          "Le RGPD impose un consentement libre, spécifique, éclairé et
          univoque, que l'utilisateur doit pouvoir retirer aussi facilement
          qu'il l'a donné."
      - id: q13
        question:
          "Quelle mesure contribue le plus à sécuriser le stockage des prompts
          et historiques de conversation d'un agent ?"
        answers:
          - "Conserver les historiques en clair pour faciliter le débogage"
          - "Chiffrer les données au repos et en transit, et restreindre les
            accès via des rôles"
          - "Stocker les historiques côté client uniquement, sans aucune
            sauvegarde"
          - "Partager les historiques avec tous les développeurs pour accélérer
            l'amélioration"
        correct: 1
        explanation:
          "Le chiffrement au repos et en transit, combiné à un contrôle d'accès
          basé sur les rôles, limite fortement le risque de fuite des prompts et
          historiques sensibles."
      - id: q14
        question:
          "Comment limiter le risque d'hallucinations d'un agent et clarifier la
          responsabilité associée ?"
        answers:
          - "Faire entièrement confiance au modèle et publier ses sorties sans
            relecture"
          - "Ancrer les réponses sur des sources vérifiables (RAG), citer les
            sources et prévoir une revue humaine pour les usages sensibles"
          - "Augmenter la température du modèle pour diversifier les réponses"
          - "Désactiver toute traçabilité afin de diluer la responsabilité"
        correct: 1
        explanation:
          "Ancrer les réponses sur des sources vérifiables, exposer les
          citations et maintenir un humain dans la boucle pour les décisions à
          risque réduit les hallucinations et clarifie la chaîne de
          responsabilité."
      - id: q15
        question:
          "Quel dispositif est le plus adapté pour filtrer les contenus toxiques
          produits par un agent avant leur affichage à l'utilisateur ?"
        answers:
          - "Un simple filtre par mots-clés appliqué en amont du prompt"
          - "Une couche de modération en sortie (classifieur de toxicité,
            garde-fous) couplée à des règles de blocage et de reformulation"
          - "Un avertissement légal affiché dans les conditions d'utilisation"
          - "La désactivation pure et simple des journaux de sortie"
        correct: 1
        explanation:
          "Une couche de modération en sortie, basée sur un classifieur de
          toxicité et des garde-fous, permet de bloquer ou reformuler les
          contenus problématiques avant qu'ils n'atteignent l'utilisateur."
      - id: q16
        question:
          "Quel est l'objectif principal d'une politique de modération des
          prompts utilisateurs dans un agent IA ?"
        answers:
          - "Optimiser la latence des réponses du modèle"
          - "Filtrer les requêtes abusives, illégales ou hors périmètre avant
            traitement"
          - "Compresser les prompts pour réduire le coût en tokens"
          - "Traduire automatiquement les prompts dans la langue du modèle"
        correct: 1
        explanation:
          "Une politique de modération des prompts vise à détecter et bloquer
          les entrées abusives, illégales ou hors périmètre avant qu'elles
          n'atteignent le modèle, afin de protéger les utilisateurs et
          l'organisation."
      - id: q17
        question:
          "Que cherche-t-on principalement à vérifier lors de l'audit d'un agent
          IA ?"
        answers:
          - "La popularité de l'agent auprès des utilisateurs finaux"
          - "Le coût marketing du déploiement de l'agent"
          - "La conformité, la sécurité, la traçabilité et la qualité des
            réponses produites"
          - "La vitesse de connexion réseau entre l'agent et ses bases
            vectorielles"
        correct: 2
        explanation:
          "Un audit d'agent IA évalue notamment la conformité réglementaire, la
          sécurité, la traçabilité des décisions et la qualité des réponses,
          afin de maîtriser les risques liés à son usage."
      - id: q18
        question:
          "À quoi sert principalement une model card associée à un modèle d'IA ?"
        answers:
          - "Documenter l'usage prévu, les limites, les performances et les
            risques connus du modèle"
          - "Fournir la clé d'API permettant d'appeler le modèle"
          - "Stocker les poids entraînés du modèle de manière chiffrée"
          - "Définir le tarif facturé par appel au modèle"
        correct: 0
        explanation:
          "Une model card est un document standardisé qui décrit l'usage prévu,
          les données d'entraînement, les performances, les limites et les
          risques d'un modèle, afin d'en favoriser un usage responsable."
      - id: q19
        question:
          "Que désigne la notion de fairness inter-groupes appliquée à un
          système d'IA ?"
        answers:
          - "La capacité du modèle à répondre rapidement à plusieurs
            utilisateurs en parallèle"
          - "L'équité des performances et des décisions du modèle entre
            différents groupes démographiques"
          - "La répartition équitable de la charge GPU entre plusieurs instances
            du modèle"
          - "La compatibilité du modèle avec plusieurs langues naturelles"
        correct: 1
        explanation:
          "La fairness inter-groupes vise à garantir que les performances et
          décisions d'un modèle ne désavantagent pas systématiquement certains
          groupes démographiques par rapport à d'autres."
      - id: q20
        question:
          "Parmi les pratiques suivantes, laquelle relève de la transparence
          vis-à-vis des utilisateurs d'un agent IA ?"
        answers:
          - "Masquer le fait qu'un agent automatisé est impliqué dans la
            conversation"
          - "Indiquer clairement à l'utilisateur qu'il interagit avec une IA et
            préciser ses limites"
          - "Conserver secrètes les sources utilisées pour générer les réponses"
          - "Empêcher l'utilisateur de signaler une réponse jugée problématique"
        correct: 1
        explanation:
          "La transparence consiste notamment à informer explicitement
          l'utilisateur qu'il dialogue avec une IA, à préciser ses limites et,
          lorsque c'est pertinent, à exposer les sources utilisées."
  - id: perspectives-futures
    title: "Perspectives futures et innovations dans les agents intelligents"
    questions:
      - id: q1
        question:
          "Quelle tendance désigne l'orchestration de plusieurs agents
          spécialisés collaborant pour résoudre une tâche complexe ?"
        answers:
          - "Les systèmes multi-agents"
          - "Le fine-tuning supervisé"
          - "La quantification des poids"
          - "Le prompt engineering statique"
        correct: 0
        explanation:
          "Les systèmes multi-agents font collaborer plusieurs agents aux rôles
          complémentaires (planificateur, exécutant, critique) pour traiter des
          problèmes complexes."
      - id: q2
        question:
          "Que sont AutoGPT et BabyAGI, souvent cités comme précurseurs d'une
          tendance majeure ?"
        answers:
          - "Des bases de données vectorielles open source"
          - "Des agents autonomes capables de planifier et d'exécuter des tâches
            sans intervention humaine continue"
          - "Des frameworks de fine-tuning de LLM"
          - "Des protocoles de chiffrement pour LLM"
        correct: 1
        explanation:
          "AutoGPT et BabyAGI sont des agents autonomes qui décomposent un
          objectif en sous-tâches et les exécutent en boucle avec un minimum de
          supervision humaine."
      - id: q3
        question:
          "Que désigne l'évolution des LLM vers des modèles multimodaux ?"
        answers:
          - "La capacité à traiter conjointement plusieurs types de données
            (texte, image, audio, vidéo)"
          - "L'utilisation simultanée de plusieurs GPU"
          - "La gestion de plusieurs langues humaines uniquement"
          - "Le passage du cloud à l'edge computing"
        correct: 0
        explanation:
          "Un modèle multimodal sait ingérer et produire plusieurs modalités
          (texte, image, audio, vidéo), élargissant les usages des agents
          intelligents."
      - id: q4
        question:
          "Quelle est la promesse principale des SLM (Small Language Models)
          dans l'évolution future des agents ?"
        answers:
          - "Remplacer totalement les LLM dans toutes les tâches"
          - "Offrir des modèles plus petits, économes et déployables localement,
            adaptés à des tâches ciblées"
          - "Supprimer le besoin de données d'entraînement"
          - "Garantir une précision toujours supérieure aux LLM généralistes"
        correct: 1
        explanation:
          "Les SLM visent un meilleur compromis coût/latence/confidentialité en
          s'exécutant localement et en se spécialisant sur des tâches ciblées au
          sein d'agents."
      - id: q5
        question: 'En quoi consiste l''innovation appelée "adaptive RAG" ?'
        answers:
          - "Indexer toujours l'intégralité du corpus avant chaque requête"
          - "Utiliser un seul retriever fixe quel que soit le contexte"
          - "Adapter dynamiquement la stratégie de récupération (sources,
            profondeur, méthode) en fonction de la question posée"
          - "Désactiver la récupération pour s'appuyer uniquement sur le LLM"
        correct: 2
        explanation:
          "L'adaptive RAG ajuste à la volée la stratégie de récupération selon
          la complexité et la nature de la requête, plutôt que d'appliquer un
          pipeline figé."
      - id: q6
        question:
          "Qu'apporte l'approche self-RAG par rapport à un RAG classique ?"
        answers:
          - "Le modèle apprend à décider lui-même quand récupérer des documents
            et à critiquer ses propres réponses"
          - "Il supprime totalement l'étape de récupération pour ne garder que
            le LLM"
          - "Il remplace le LLM par une base vectorielle interrogée directement"
          - "Il impose une récupération systématique avant chaque token généré"
        correct: 0
        explanation:
          "Self-RAG entraîne le modèle à émettre des tokens de réflexion qui
          décident de la pertinence d'une récupération et évaluent la qualité
          des passages et de la réponse."
      - id: q7
        question:
          "Que désigne l'évolution de GraphRAG vers des graphes dynamiques ?"
        answers:
          - "Des graphes de connaissances mis à jour en continu à partir de
            nouvelles sources, avec ajout et révision d'entités et de relations"
          - "Des graphes figés générés une seule fois lors de l'indexation
            initiale"
          - "Des graphes purement visuels destinés à l'affichage dans
            l'interface utilisateur"
          - "Des graphes stockés uniquement en mémoire vive et jamais persistés"
        correct: 0
        explanation:
          "Les graphes dynamiques évoluent dans le temps : de nouvelles entités,
          relations et communautés sont ajoutées, modifiées ou supprimées au fil
          des mises à jour des sources."
      - id: q8
        question:
          "Qu'apportent les schémas auto-générés dans l'évolution de StructRAG ?"
        answers:
          - "Le système infère automatiquement la structure adaptée aux
            documents au lieu de la définir manuellement à l'avance"
          - "Le schéma de la base relationnelle est figé pour toujours dès la
            première requête"
          - "Les utilisateurs doivent décrire à la main chaque champ avant toute
            indexation"
          - "Tous les documents sont forcés dans un unique schéma JSON universel"
        correct: 0
        explanation:
          "L'auto-génération de schémas permet à StructRAG d'adapter
          dynamiquement la structure (tables, listes, graphes) au type de
          contenu rencontré, sans modélisation préalable manuelle."
      - id: q9
        question:
          "Que désigne RAFT, à la convergence du RAG et du fine-tuning ?"
        answers:
          - "Une méthode de fine-tuning qui entraîne le modèle à exploiter des
            documents récupérés, y compris des distracteurs, pour mieux répondre"
          - "Une technique qui supprime le fine-tuning au profit du seul RAG"
          - "Un format de fichier dédié au stockage des embeddings vectoriels"
          - "Un protocole réseau pour synchroniser plusieurs bases vectorielles"
        correct: 0
        explanation:
          "RAFT (Retrieval-Augmented Fine-Tuning) spécialise un modèle sur un
          domaine en l'entraînant à raisonner sur des documents pertinents et à
          ignorer les distracteurs fournis au moment de l'inférence."
      - id: q10
        question:
          "Quel est l'intérêt principal d'un agent spécialisé par domaine face à
          un agent généraliste ?"
        answers:
          - "Une meilleure précision et fiabilité sur les tâches du domaine,
            grâce à des données et outils ciblés"
          - "Une couverture universelle de tous les sujets sans aucune limite"
          - "L'absence totale de besoin en données ou en évaluation métier"
          - "La suppression de toute hallucination, garantie par construction"
        correct: 0
        explanation:
          "Un agent spécialisé exploite un corpus, des outils et des évaluations
          propres à son domaine, ce qui améliore la pertinence des réponses au
          prix d'une portée plus restreinte qu'un agent généraliste."
      - id: q11
        question:
          "Que désigne le standard émergent MCP (Model Context Protocol) dans
          l'écosystème des agents intelligents ?"
        answers:
          - "Un protocole ouvert standardisant la connexion entre les modèles de
            langage et les sources de données ou outils externes"
          - "Un format de compression propriétaire pour réduire la taille des
            modèles de langage"
          - "Une norme de chiffrement des prompts envoyés aux LLM"
          - "Un langage de requête dédié aux bases vectorielles"
        correct: 0
        explanation:
          'MCP, introduit par Anthropic, est un protocole ouvert qui standardise
          la manière dont les applications fournissent du contexte (données,
          outils) aux LLM, à la manière d''un "USB-C de l''IA".'
      - id: q12
        question:
          "Quel impact les agents intelligents sont-ils principalement attendus
          d'avoir sur les métiers de la connaissance ?"
        answers:
          - "Une automatisation des tâches répétitives d'analyse et de synthèse,
            recentrant les experts sur la décision et la supervision"
          - "Le remplacement intégral et immédiat de tous les analystes et
            consultants"
          - "Une disparition totale du besoin de compétences humaines en
            rédaction"
          - "Une stagnation des métiers, sans modification notable des pratiques"
        correct: 0
        explanation:
          "Les agents prennent en charge la collecte, la synthèse et la
          rédaction de premier niveau, ce qui transforme les métiers de la
          connaissance vers des rôles de pilotage, de validation et d'expertise
          critique."
      - id: q13
        question:
          "Quelle évolution réglementaire majeure encadre désormais les systèmes
          d'IA, y compris les agents intelligents, dans l'Union européenne ?"
        answers:
          - "L'AI Act, qui impose des obligations graduées selon le niveau de
            risque du système d'IA"
          - "Le RGPD, qui remplace toute autre réglementation spécifique à l'IA"
          - "Une directive interdisant tout usage d'agents intelligents en
            production"
          - "Un règlement limitant l'IA aux seuls acteurs publics européens"
        correct: 0
        explanation:
          "L'AI Act européen catégorise les systèmes d'IA par niveau de risque
          (inacceptable, élevé, limité, minimal) et impose des obligations
          spécifiques, notamment pour les modèles à usage général et les agents
          autonomes."
      - id: q14
        question: 'Que désigne la notion d''agents "on-device" (edge AI) ?'
        answers:
          - "Des agents dont les modèles s'exécutent localement sur l'appareil
            de l'utilisateur, sans dépendance systématique au cloud"
          - "Des agents hébergés exclusivement dans des data centers
            hyperscalers"
          - "Des agents accessibles uniquement via une interface web centralisée"
          - "Des agents qui ne fonctionnent qu'en mode batch sur serveur"
        correct: 0
        explanation:
          "Les agents on-device exécutent les inférences directement sur le
          terminal (smartphone, PC, objet connecté), ce qui améliore la latence,
          la confidentialité des données et permet un fonctionnement hors ligne."
      - id: q15
        question:
          "Quel est un avantage généralement reconnu aux solutions d'agents
          intelligents open-source par rapport aux solutions propriétaires ?"
        answers:
          - "Une plus grande transparence du code et une maîtrise accrue du
            déploiement, notamment pour la souveraineté des données"
          - "Une garantie contractuelle de support 24/7 systématiquement
            supérieure"
          - "Une qualité de modèle toujours strictement supérieure à celle des
            solutions propriétaires"
          - "L'absence totale de coûts d'infrastructure et d'exploitation"
        correct: 0
        explanation:
          "L'open-source offre transparence, auditabilité et possibilité
          d'auto-hébergement, ce qui favorise la souveraineté et la
          personnalisation, même si les coûts d'infrastructure et d'expertise
          restent à la charge de l'organisation."
      - id: q16
        question:
          "Concernant la sustainability (durabilité) des agents IA, quel facteur
          contribue le plus à leur empreinte carbone ?"
        answers:
          - "La consommation énergétique des GPU lors de l'entraînement et de
            l'inférence à grande échelle"
          - "Le poids des fichiers de configuration YAML stockés sur disque"
          - "Le nombre de lignes de code Python du framework d'agent utilisé"
          - "La couleur d'arrière-plan de l'interface utilisateur de l'agent"
        correct: 0
        explanation:
          "L'empreinte carbone des agents IA provient majoritairement de
          l'énergie consommée par les GPU des centres de données, à la fois
          pendant l'entraînement des modèles et pendant les très nombreux appels
          d'inférence."
      - id: q17
        question:
          'Que désigne le "chain-of-thought avancé" dans les agents capables de
          raisonnement long ?'
        answers:
          - "Une technique permettant à l'agent de décomposer un problème
            complexe en étapes intermédiaires explicites avant de produire la
            réponse finale"
          - "Un mécanisme de chiffrement des prompts envoyés au LLM"
          - "Un protocole réseau dédié à l'échange de tokens entre agents"
          - "Une base de données vectorielle spécialisée dans le stockage des
            embeddings"
        correct: 0
        explanation:
          "Le chain-of-thought avancé consiste à faire raisonner le modèle étape
          par étape, ce qui améliore sa capacité à résoudre des problèmes longs
          et multi-étapes en explicitant ses étapes de réflexion."
      - id: q18
        question:
          "Quelle est la tendance attendue concernant l'évolution des coûts
          d'inférence des LLM utilisés par les agents ?"
        answers:
          - "Une baisse continue grâce à l'optimisation matérielle, à la
            quantization et à des modèles plus efficaces"
          - "Une hausse exponentielle qui rendra les agents inaccessibles dès
            l'année prochaine"
          - "Une stabilité parfaite imposée par une régulation internationale
            unique"
          - "Une suppression totale des coûts dès que les modèles deviendront
            open source"
        correct: 0
        explanation:
          "La tendance observée et anticipée est une baisse régulière des coûts
          d'inférence, portée par l'amélioration du matériel, la quantization,
          la distillation et l'arrivée de modèles plus petits mais performants."
      - id: q19
        question:
          "Quel risque systémique est lié à la généralisation massive des agents
          intelligents autonomes ?"
        answers:
          - "La propagation rapide d'erreurs ou de biais en cascade lorsque de
            nombreux agents s'appuient sur les mêmes modèles ou sources"
          - "Une diminution garantie de toutes les cybermenaces dans le monde"
          - "L'impossibilité technique pour deux agents de communiquer entre eux"
          - "La disparition complète des bases de données relationnelles"
        correct: 0
        explanation:
          "Quand de nombreux agents partagent les mêmes modèles, données ou
          outils, une erreur, un biais ou une vulnérabilité peut se propager en
          cascade à grande échelle, créant un véritable risque systémique."
      - id: q20
        question:
          "Parmi les compétences suivantes, laquelle sera clé pour un
          développeur d'agents intelligents demain ?"
        answers:
          - "Maîtriser le prompt engineering, l'orchestration d'outils et
            l'évaluation rigoureuse des agents"
          - "Savoir uniquement écrire des requêtes SQL sur une base unique"
          - "Connaître exclusivement un seul framework propriétaire fermé"
          - "Refuser toute veille technologique pour rester concentré sur un
            outil"
        correct: 0
        explanation:
          "Le développeur d'agents de demain devra combiner prompt engineering,
          orchestration d'outils (RAG, function calling, multi-agents) et
          méthodes d'évaluation rigoureuses pour fiabiliser ses systèmes."

          - "Réordonner les documents initialement récupérés selon leur
            pertinence réelle vis-à-vis de la requête"
          - "Réduire le nombre de tokens envoyés au LLM en supprimant les mots
            vides"
          - "Convertir les documents en embeddings vectoriels avant indexation"
          - "Mettre en cache les réponses du LLM pour accélérer les requêtes
            répétées"
        correct: 0
        explanation:
          "Le reranking applique un modèle plus précis (souvent un
          cross-encoder) sur les top-k documents récupérés afin d'affiner leur
          ordre selon la pertinence réelle pour la requête."
      - id: "q15"
        question:
          "Dans la maintenance d'une base de connaissances pour un agent
          intelligent, qu'apporte une mise à jour incrémentale par rapport à une
          réindexation complète ?"
        answers:
          - "Elle garantit une meilleure qualité sémantique des embeddings
            produits"
          - "Elle supprime automatiquement les documents obsolètes sans
            intervention"
          - "Elle remplace le besoin d'un feedback loop utilisateur"
          - "Elle réduit le coût et la latence de mise à jour en n'indexant que
            les documents nouveaux ou modifiés"
        correct: 3
        explanation:
          "La mise à jour incrémentale ne traite que les documents ajoutés ou
          modifiés, ce qui économise du temps de calcul et du coût par rapport à
          une réindexation complète de toute la base."
      - id: "q16"
        question:
          'Dans l''évaluation d''un système RAG, que mesure la métrique de
          "faithfulness" ?'
        answers:
          - "La vitesse à laquelle l'agent retourne une réponse à l'utilisateur"
          - "Le degré auquel la réponse générée est fidèle aux documents
            récupérés, sans hallucination"
          - "La proportion de documents pertinents présents dans le top-k
            retourné par le retriever"
          - "Le coût en tokens consommés pour produire une réponse complète"
        correct: 1
        explanation:
          "La faithfulness évalue si la réponse générée s'appuie réellement sur
          les passages récupérés, ce qui permet de détecter les hallucinations
          du modèle."
      - id: "q17"
        question:
          "Quel est l'objectif principal d'une étape de reranking dans un
          pipeline RAG ?"
        answers:
          - "Réduire la latence en supprimant l'appel au LLM générateur"
          - "Réordonner les documents candidats récupérés afin de placer les
            plus pertinents en tête avant la génération"
          - "Réécrire la requête utilisateur pour la rendre plus précise"
          - "Compresser les embeddings stockés dans la base vectorielle"
        correct: 1
        explanation:
          "Le reranking utilise un modèle plus précis (souvent un cross-encoder)
          pour réordonner les résultats du retriever et améliorer la qualité du
          contexte fourni au LLM."
      - id: "q18"
        question:
          "En quoi consiste la technique HyDE (Hypothetical Document Embeddings)
          ?"
        answers:
          - "Stocker les documents sous forme chiffrée pour protéger les données
            sensibles"
          - "Générer une réponse hypothétique à la requête, puis utiliser son
            embedding pour effectuer la recherche vectorielle"
          - "Utiliser uniquement la recherche par mots-clés à la place des
            embeddings"
          - "Indexer les documents avec plusieurs modèles d'embedding en
            parallèle"
        correct: 1
        explanation:
          "HyDE fait générer par un LLM un document hypothétique répondant à la
          question, dont l'embedding est ensuite utilisé pour la recherche, ce
          qui rapproche la requête de la forme des documents indexés."
      - id: "q19"
        question:
          "Qu'est-ce que la recherche hybride (hybrid search) dans un système
          RAG ?"
        answers:
          - "Une combinaison de la recherche lexicale (BM25) et de la recherche
            sémantique par embeddings"
          - "L'utilisation simultanée de plusieurs LLM pour générer la réponse
            finale"
          - "Une recherche réalisée à la fois sur le cloud et en local pour
            comparer les résultats"
          - "Le mélange de données structurées et non structurées dans la même
            requête SQL"
        correct: 0
        explanation:
          "La recherche hybride combine la précision des correspondances exactes
          (mots-clés, BM25) avec la richesse sémantique des embeddings
          vectoriels pour améliorer le rappel et la pertinence."
      - id: "q20"
        question:
          "Quel est l'intérêt principal d'une boucle de feedback (feedback loop)
          dans la maintenance d'un agent RAG en production ?"
        answers:
          - "Supprimer automatiquement les documents les plus volumineux de la
            base"
          - "Réduire la taille du modèle d'embedding au fil du temps"
          - "Collecter les retours des utilisateurs pour identifier les erreurs
            et améliorer la base de connaissances ou le pipeline"
          - "Empêcher toute mise à jour de la base de connaissances afin de
            garantir la stabilité"
        correct: 2
        explanation:
          "La boucle de feedback exploite les évaluations et corrections des
          utilisateurs pour détecter les lacunes du système et alimenter un
          apprentissage continu (mise à jour des documents, fine-tuning,
          ajustement du retriever)."
  - id: "ethique-conformite"
    title: "Gestion des enjeux éthiques et de la conformité"
    questions:
      - id: "q1"
        question:
          'Dans une architecture RAG, qu''appelle-t-on un "biais de source" ?'
        answers:
          - "Une distorsion des réponses due à la sur-représentation ou à
            l'orientation idéologique des documents indexés"
          - "Un défaut technique du moteur de recherche vectorielle qui retourne
            toujours les mêmes documents"
          - "Une erreur de tokenisation qui modifie le sens des passages
            récupérés"
          - "Une latence excessive lors de la récupération des documents
            pertinents"
        correct: 0
        explanation:
          "Le biais de source provient du corpus lui-même : si les documents
          indexés reflètent un point de vue partiel ou déséquilibré, les
          réponses générées hériteront de ce déséquilibre."
      - id: "q2"
        question:
          "Quelle pratique permet le mieux de limiter les hallucinations d'un
          agent RAG ?"
        answers:
          - "Augmenter la température du modèle pour favoriser la créativité"
          - "Contraindre le modèle à citer explicitement les passages sources et
            refuser de répondre hors contexte"
          - "Supprimer les métadonnées des documents pour alléger le contexte"
          - "Réduire systématiquement la taille de la fenêtre de contexte"
        correct: 1
        explanation:
          'Forcer la citation des sources et instruire le modèle à répondre "je
          ne sais pas" hors du contexte récupéré réduit fortement les
          hallucinations en ancrant la réponse dans les documents fournis.'
      - id: "q3"
        question:
          "Selon le RGPD, quelle obligation s'applique lorsqu'un agent RAG
          indexe des documents contenant des données personnelles ?"
        answers:
          - "Aucune, tant que les données ne sont pas affichées à l'utilisateur
            final"
          - "Il suffit de chiffrer la base vectorielle pour être conforme"
          - "Définir une base légale, informer les personnes concernées et
            permettre l'exercice de leurs droits (accès, effacement)"
          - "Conserver les données indéfiniment pour garantir la traçabilité des
            réponses"
        correct: 2
        explanation:
          "Le RGPD impose une base légale au traitement, une information des
          personnes concernées et le respect de leurs droits, y compris le droit
          à l'effacement, même au sein d'un index vectoriel."
      - id: "q4"
        question:
          'L''AI Act européen classe les systèmes d''IA selon différents niveaux
          de risque. Que doit faire le concepteur d''un agent considéré à "haut
          risque" ?'
        answers:
          - "Mettre en place une gestion des risques, une documentation
            technique et une supervision humaine"
          - "Publier le code source intégral du modèle sur un dépôt public"
          - "Limiter l'usage de l'agent aux seuls employés de l'entreprise"
          - "Remplacer obligatoirement le modèle par une solution open source"
        correct: 0
        explanation:
          "L'AI Act exige pour les systèmes à haut risque une gestion des
          risques, une documentation technique, des données de qualité, une
          journalisation et une supervision humaine effective."
      - id: "q5"
        question:
          "Quel mécanisme contribue le plus directement à la transparence et à
          l'explicabilité d'un agent intelligent ?"
        answers:
          - "Le chiffrement de bout en bout des requêtes utilisateur"
          - "L'augmentation de la taille du modèle de langage utilisé"
          - "La traçabilité des sources citées et la journalisation des étapes
            de raisonnement de l'agent"
          - "L'utilisation exclusive de modèles propriétaires fermés"
        correct: 2
        explanation:
          "Citer les sources et journaliser les étapes (récupération, sélection,
          génération) permet à l'utilisateur et à l'auditeur de comprendre
          comment une réponse a été produite, ce qui est la base de
          l'explicabilité."
      - id: "q6"
        question:
          "Dans une architecture RAG, qu'appelle-t-on un « biais des sources » ?"
        answers:
          - "Une distorsion introduite parce que le corpus indexé sur-représente
            certains points de vue ou populations"
          - "Un défaut du modèle de langage qui invente des faits absents du
            corpus"
          - "Une latence excessive lors de la recherche vectorielle"
          - "Une erreur de tokenisation des documents lors de l'ingestion"
        correct: 0
        explanation:
          "Le biais des sources provient du corpus lui-même : si les documents
          indexés reflètent une vision partielle, l'agent reproduira ce
          déséquilibre dans ses réponses."
      - id: "q7"
        question:
          "Quelle pratique limite le plus efficacement les hallucinations d'un
          agent RAG ?"
        answers:
          - "Augmenter la température du modèle pour diversifier les réponses"
          - "Contraindre le modèle à répondre uniquement à partir des passages
            récupérés et à citer ses sources"
          - "Supprimer l'étape de récupération pour gagner en rapidité"
          - "Utiliser un modèle plus petit afin de réduire la créativité"
        correct: 1
        explanation:
          "Ancrer la réponse aux passages récupérés (grounding) et exiger des
          citations réduit fortement les hallucinations en rendant la génération
          vérifiable."
      - id: "q8"
        question:
          "Au regard du RGPD, que doit-on faire avant d'indexer des documents
          internes contenant des données personnelles dans une base vectorielle
          ?"
        answers:
          - "Rien de particulier, les embeddings ne sont pas considérés comme
            des données personnelles"
          - "Définir une base légale, minimiser et, si possible, anonymiser ou
            pseudonymiser les données avant ingestion"
          - "Chiffrer uniquement la base de données relationnelle associée"
          - "Demander l'accord du fournisseur du modèle de langage"
        correct: 1
        explanation:
          "Le RGPD impose une base légale, la minimisation des données et,
          lorsque c'est possible, l'anonymisation ou la pseudonymisation avant
          tout traitement, y compris l'indexation vectorielle."
      - id: "q9"
        question:
          "Selon l'AI Act européen, comment est généralement classé un agent
          intelligent utilisé pour assister des décisions de recrutement ?"
        answers:
          - "Système à risque minimal, sans obligation particulière"
          - "Système à risque limité, soumis uniquement à une obligation de
            transparence"
          - "Système à haut risque, soumis à des exigences renforcées (gestion
            des risques, documentation, supervision humaine)"
          - "Système interdit en toutes circonstances"
        correct: 2
        explanation:
          "L'AI Act classe les systèmes d'IA utilisés pour le recrutement et la
          gestion des ressources humaines parmi les systèmes à haut risque, avec
          des obligations renforcées de gouvernance et de supervision humaine."
      - id: "q10"
        question:
          "Quel mécanisme contribue le plus directement à la traçabilité et à
          l'explicabilité des réponses d'un agent RAG ?"
        answers:
          - "La journalisation des requêtes, des passages récupérés et des
            réponses générées, avec citation des sources"
          - "L'augmentation de la taille de la fenêtre de contexte du modèle"
          - "Le passage à un index lexical type BM25 plutôt que vectoriel"
          - "La désactivation de la mise en cache des réponses"
        correct: 0
        explanation:
          "Loguer les requêtes, les passages récupérés et les réponses, et
          afficher les citations, permet de retracer comment chaque réponse a
          été produite et de l'expliquer aux utilisateurs."
      - id: "q11"
        question:
          'Dans une architecture RAG, qu''appelle-t-on un "biais des sources" ?'
        answers:
          - "Un défaut de l'algorithme de recherche vectorielle qui privilégie
            les documents courts"
          - "Une distorsion introduite par la composition non représentative ou
            orientée du corpus indexé"
          - "Une erreur de tokenisation provoquée par les caractères spéciaux
            des documents"
          - "Une latence excessive lors de la récupération des passages
            pertinents"
        correct: 1
        explanation:
          "Le biais des sources désigne les distorsions héritées du corpus
          lui-même : sur-représentation de certains points de vue, lacunes
          thématiques ou contenus orientés qui se répercutent sur les réponses
          de l'agent."
      - id: "q12"
        question:
          'Qu''est-ce que le "biais d''amplification" dans un agent RAG ou RIG ?'
        answers:
          - "Le fait que le modèle augmente artificiellement la longueur de ses
            réponses"
          - "Le fait que les réponses générées renforcent et propagent les biais
            déjà présents dans les sources récupérées"
          - "Le fait d'ajouter des citations supplémentaires pour rendre la
            réponse plus convaincante"
          - "Le fait d'utiliser plusieurs modèles de langage en parallèle pour
            vérifier une réponse"
        correct: 1
        explanation:
          "Le biais d'amplification se produit quand l'agent reprend et accentue
          les biais déjà contenus dans les documents récupérés, leur donnant un
          poids accru via la génération."
      - id: "q13"
        question:
          "Quelle bonne pratique permet de réduire le risque d'hallucinations
          dans un agent RAG ?"
        answers:
          - "Désactiver la récupération de documents pour s'appuyer uniquement
            sur le modèle"
          - "Augmenter la température de génération pour diversifier les
            réponses"
          - "Contraindre la génération à s'appuyer sur les passages récupérés et
            exiger des citations vérifiables"
          - "Supprimer les explications fournies à l'utilisateur pour limiter
            les erreurs visibles"
        correct: 2
        explanation:
          "Ancrer la réponse sur les passages récupérés et imposer des citations
          traçables réduit fortement les hallucinations en limitant la part
          purement générative non vérifiable."
      - id: "q14"
        question:
          "Au regard du RGPD et de l'AI Act, quelle mesure est essentielle avant
          d'indexer des documents contenant des données personnelles ?"
        answers:
          - "Chiffrer uniquement les embeddings stockés dans la base vectorielle"
          - "Procéder à une anonymisation ou pseudonymisation et définir une
            base légale de traitement"
          - "Augmenter la taille du modèle de langage pour mieux protéger les
            données"
          - "Publier le corpus en open data pour garantir la transparence"
        correct: 1
        explanation:
          "Le RGPD impose une base légale et des garanties comme l'anonymisation
          ou la pseudonymisation ; l'AI Act renforce ces obligations pour les
          systèmes d'IA traitant des données personnelles."
      - id: "q15"
        question:
          "Quel mécanisme contribue le plus directement à l'explicabilité et à
          la traçabilité d'un agent RAG en production ?"
        answers:
          - "La journalisation des requêtes, des sources récupérées et des
            réponses générées avec leurs citations"
          - "L'utilisation exclusive d'un modèle propriétaire fermé"
          - "La suppression automatique des logs après chaque session
            utilisateur"
          - "Le remplacement des citations par des reformulations libres du
            modèle"
        correct: 0
        explanation:
          "Conserver des logs structurés associant requête, passages sources et
          réponse citée permet d'auditer les décisions de l'agent et de fournir
          une explicabilité vérifiable."
      - id: "q16"
        question:
          'Dans une architecture RAG, qu''appelle-t-on un "biais des sources" ?'
        answers:
          - "Un défaut purement technique du modèle de langage qui altère ses
            poids"
          - "Une distorsion introduite par la sélection ou la composition du
            corpus indexé"
          - "Une erreur d'arrondi lors du calcul des embeddings vectoriels"
          - "Une latence anormale lors de la récupération des documents
            pertinents"
        correct: 1
        explanation:
          "Le biais des sources provient du corpus utilisé : si les documents
          indexés sont partiels, orientés ou non représentatifs, l'agent
          reproduira ces biais dans ses réponses."
      - id: "q17"
        question:
          "Quelle pratique permet de réduire le risque d'hallucination dans un
          agent RAG ?"
        answers:
          - "Augmenter systématiquement la température du modèle de génération"
          - "Supprimer les citations pour alléger les réponses produites"
          - "Contraindre l'agent à s'appuyer sur les passages récupérés et citer
            ses sources"
          - "Désactiver la phase de récupération pour gagner en rapidité"
        correct: 2
        explanation:
          "Imposer un ancrage strict sur les passages récupérés et exiger des
          citations limite la génération d'informations inventées et facilite la
          vérification."
      - id: "q18"
        question:
          "Selon le RGPD, quelle obligation s'impose lorsqu'on indexe des
          documents contenant des données personnelles dans un RAG ?"
        answers:
          - "Disposer d'une base légale et appliquer la minimisation des données"
          - "Publier l'intégralité du corpus en open data pour assurer la
            transparence"
          - "Conserver les données indéfiniment pour garantir la traçabilité"
          - "Transférer systématiquement les données hors de l'Union européenne"
        correct: 0
        explanation:
          "Le RGPD impose une base légale au traitement et le principe de
          minimisation : seules les données strictement nécessaires doivent être
          collectées et indexées."
      - id: "q19"
        question:
          "Comment l'AI Act européen classe-t-il un agent intelligent utilisé
          pour assister des décisions de recrutement ?"
        answers:
          - "Système à risque minimal, sans obligation particulière"
          - "Système à risque limité, soumis uniquement à un devoir
            d'information"
          - "Système à haut risque, soumis à des exigences renforcées de
            conformité"
          - "Système interdit, dont l'usage est prohibé sur le marché européen"
        correct: 2
        explanation:
          "L'AI Act classe les systèmes d'IA utilisés pour la sélection ou
          l'évaluation de candidats à l'emploi comme à haut risque, avec des
          obligations renforcées (documentation, supervision humaine, gestion
          des risques)."
      - id: "q20"
        question:
          "Quel mécanisme contribue le plus directement à l'explicabilité d'un
          agent RAG ?"
        answers:
          - "Chiffrer les échanges entre le client et le serveur d'inférence"
          - "Afficher les passages sources utilisés et tracer les étapes de
            récupération"
          - "Augmenter la taille de la fenêtre de contexte du modèle"
          - "Compresser les embeddings pour réduire l'empreinte mémoire"
        correct: 1
        explanation:
          "L'explicabilité repose sur la traçabilité : exposer les passages

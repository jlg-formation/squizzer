title: "Développer ses propres agents intelligents (RAG, RIG, GraphRAG, StructRAG)"
chapters:
  - id: introduction-ia-generative
    title: "Introduction à l'IA générative et aux agents intelligents"
    questions:
      - id: q1
        question: "Qu'est-ce qu'un modèle d'IA générative ?"
        answers:
          - "Un modèle qui produit de nouveaux contenus (texte, image, code) à partir d'un prompt"
          - "Un moteur de recherche full-text basé sur des index inversés"
          - "Un système expert codé manuellement avec des règles métier"
          - "Une base de données relationnelle optimisée pour l'analyse"
        correct: 0
        explanation: "Une IA générative produit du contenu original (texte, image, audio, code) à partir d'une distribution apprise."
      - id: q2
        question: "Quel est le principal mécanisme de fonctionnement d'un grand modèle de langage (LLM) ?"
        answers:
          - "La prédiction du prochain token la plus probable étant donné un contexte"
          - "L'application de règles grammaticales codées par des linguistes"
          - "La recherche exacte de la réponse dans une base SQL"
          - "Le calcul d'un score TF-IDF sur les documents disponibles"
        correct: 0
        explanation: "Un LLM est un modèle auto-régressif qui prédit le token suivant à partir des tokens précédents."
      - id: q3
        question: "Quelle est la différence essentielle entre IA discriminative et IA générative ?"
        answers:
          - "La discriminative classe ou prédit, la générative produit de nouveaux échantillons"
          - "La générative est toujours supervisée, la discriminative non supervisée"
          - "La discriminative ne fonctionne que sur des images, la générative sur du texte"
          - "Il n'y a aucune différence, ce sont deux noms pour la même approche"
        correct: 0
        explanation: "Discriminative modélise P(y|x) (classification), générative modélise P(x) ou P(x|y) pour générer de nouveaux x."
      - id: q4
        question: "Qu'est-ce qu'un agent conversationnel classique (chatbot à règles) ?"
        answers:
          - "Un système qui répond via un arbre de décision et des intentions prédéfinies"
          - "Un LLM entraîné sur des milliards de paramètres"
          - "Un agent qui apprend par renforcement en continu"
          - "Un système qui génère librement du texte sans contrainte"
        correct: 0
        explanation: "Les chatbots classiques s'appuient sur des intents, entités et arbres de dialogue scriptés."
      - id: q5
        question: "Quelle est la caractéristique principale d'un agent basé sur l'IA générative ?"
        answers:
          - "Il formule des réponses originales en langage naturel à partir d'un LLM"
          - "Il ne fonctionne que sur des questions présentes dans sa base de règles"
          - "Il nécessite de programmer chaque réponse possible à l'avance"
          - "Il ne peut pas être combiné avec une base de connaissances externe"
        correct: 0
        explanation: "Un agent basé sur un LLM génère ses réponses dynamiquement, sans script de dialogue exhaustif."
      - id: q6
        question: "Quelle est la principale différence entre un agent conversationnel classique et un agent basé sur l'IA générative ?"
        answers:
          - "L'agent IA générative comprend des formulations inédites alors que le chatbot classique dépend d'intents prédéfinis"
          - "Le chatbot classique parle plusieurs langues, l'agent IA non"
          - "Seul le chatbot classique peut afficher du texte"
          - "L'agent IA générative ne peut traiter que des chiffres"
        correct: 0
        explanation: "Le LLM généralise à des formulations non vues, le chatbot scripté est limité à ses intents."
      - id: q7
        question: "Quelle est une limite intrinsèque d'un LLM utilisé seul, sans augmentation ?"
        answers:
          - "Il peut halluciner et sa connaissance est figée à sa date d'entraînement"
          - "Il ne peut pas comprendre le langage naturel"
          - "Il consomme zéro ressource de calcul"
          - "Il garantit toujours une réponse vérifiée et sourcée"
        correct: 0
        explanation: "Un LLM seul peut produire des affirmations fausses (hallucinations) et ignore les faits postérieurs à son entraînement."
      - id: q8
        question: "À quoi sert un prompt système (system prompt) ?"
        answers:
          - "Définir le rôle, le ton et les contraintes globales de l'agent"
          - "Stocker les mots de passe utilisateurs"
          - "Compiler le code source du modèle"
          - "Choisir la version du GPU utilisée"
        correct: 0
        explanation: "Le system prompt cadre le comportement de l'agent (persona, règles, format de sortie)."
      - id: q9
        question: "Que désigne la « fenêtre de contexte » d'un LLM ?"
        answers:
          - "Le nombre maximum de tokens que le modèle peut traiter en entrée et sortie"
          - "L'espace disque alloué au modèle"
          - "Le temps de réponse maximum autorisé"
          - "Le nombre de paramètres du modèle"
        correct: 0
        explanation: "La context window limite la quantité de texte (en tokens) qu'un LLM peut prendre en compte simultanément."
      - id: q10
        question: "Que signifie « génération augmentée » dans le contexte de l'IA ?"
        answers:
          - "Enrichir la génération du LLM avec des informations externes récupérées au moment de la requête"
          - "Augmenter le nombre de paramètres du modèle"
          - "Doubler la taille du jeu de données d'entraînement"
          - "Compresser le modèle pour le faire tenir sur mobile"
        correct: 0
        explanation: "L'augmentation consiste à fournir au LLM du contexte externe (documents, données) pour qu'il génère une réponse mieux ancrée."
      - id: q11
        question: "Que signifie l'acronyme RAG ?"
        answers:
          - "Retrieval-Augmented Generation"
          - "Random Access Generation"
          - "Recurrent Adversarial Graph"
          - "Reinforced Agent Gateway"
        correct: 0
        explanation: "RAG = Retrieval-Augmented Generation : récupérer puis générer."
      - id: q12
        question: "Que signifie l'acronyme RIG ?"
        answers:
          - "Retrieval Interleaved Generation"
          - "Recursive Inference Graph"
          - "Real-time Indexing Gateway"
          - "Robust Iterative Grounding"
        correct: 0
        explanation: "RIG = Retrieval Interleaved Generation : la récupération est entrelacée pendant la génération."
      - id: q13
        question: "Que désigne GraphRAG en quelques mots ?"
        answers:
          - "Une approche RAG qui exploite un graphe de connaissances pour structurer la récupération"
          - "Un format binaire de stockage des images"
          - "Un protocole réseau de transfert de fichiers"
          - "Un éditeur visuel de prompts"
        correct: 0
        explanation: "GraphRAG s'appuie sur un knowledge graph pour relier entités et améliorer le raisonnement multi-hop."
      - id: q14
        question: "Que désigne StructRAG en quelques mots ?"
        answers:
          - "Une approche RAG qui privilégie l'exploitation de données structurées (tableaux, schémas)"
          - "Un langage de requête concurrent de SQL"
          - "Un compilateur LLM pour Rust"
          - "Une bibliothèque CSS pour les dashboards"
        correct: 0
        explanation: "StructRAG vise à mieux exploiter des données structurées pour des réponses précises et organisées."
      - id: q15
        question: "Quel est un cas d'usage typique d'un agent intelligent en entreprise ?"
        answers:
          - "Assistant interne qui répond aux questions RH à partir de la documentation officielle"
          - "Compilation du code source vers du binaire"
          - "Sauvegarde automatique des disques durs"
          - "Configuration du firewall réseau"
        correct: 0
        explanation: "Les assistants internes (RH, IT, juridique) basés sur RAG sont un cas d'usage emblématique."
      - id: q16
        question: "Qu'est-ce qu'un embedding (plongement vectoriel) ?"
        answers:
          - "Une représentation numérique dense d'un texte capturant sa sémantique"
          - "Un fichier image au format PNG"
          - "Un script shell d'installation"
          - "Une signature cryptographique d'un document"
        correct: 0
        explanation: "Un embedding est un vecteur (souvent de plusieurs centaines de dimensions) qui encode le sens d'un fragment de texte."
      - id: q17
        question: "Quelle est la différence essentielle entre RAG et fine-tuning ?"
        answers:
          - "RAG ajoute du contexte à l'inférence, le fine-tuning modifie les poids du modèle"
          - "RAG nécessite un GPU, pas le fine-tuning"
          - "Le fine-tuning ajoute du contexte à l'inférence, RAG modifie les poids"
          - "Ils désignent exactement la même technique"
        correct: 0
        explanation: "RAG injecte des documents au moment de la requête ; le fine-tuning ré-entraîne le modèle sur des exemples."
      - id: q18
        question: "Qu'est-ce que le « tool calling » (appel d'outils) pour un agent ?"
        answers:
          - "La capacité de l'agent à invoquer des fonctions externes (API, calculatrice, recherche) durant un raisonnement"
          - "L'utilisation d'un IDE pour éditer le code"
          - "Le téléchargement d'un binaire depuis un dépôt"
          - "L'ouverture d'un ticket de support"
        correct: 0
        explanation: "Le tool calling permet au LLM d'agir sur le monde via des fonctions exposées (recherche web, BDD, exécution de code)."
      - id: q19
        question: "Que désigne l'autonomie d'un agent intelligent ?"
        answers:
          - "Sa capacité à enchaîner des étapes et prendre des décisions sans intervention humaine"
          - "Le fait qu'il fonctionne hors ligne uniquement"
          - "Le nombre d'utilisateurs qu'il peut servir simultanément"
          - "Sa capacité à fonctionner sans GPU"
        correct: 0
        explanation: "Un agent autonome planifie, exécute des outils et boucle jusqu'à atteindre l'objectif sans guidage pas-à-pas."
      - id: q20
        question: "Quel est un risque majeur d'un agent IA générative non encadré ?"
        answers:
          - "Produire des réponses fausses ou biaisées présentées comme certaines"
          - "Consommer trop peu de mémoire vive"
          - "Refuser systématiquement de répondre"
          - "Devenir incapable de comprendre le français"
        correct: 0
        explanation: "Sans garde-fous (sourcing, filtrage, supervision), un agent peut halluciner, biaiser ou diffuser du contenu inapproprié."
  - id: rag-rig-fondamentaux
    title: "Fondamentaux des architectures RAG et RIG"
    questions:
      - id: q1
        question: "Quelle définition correspond le mieux à RAG (Retrieval-Augmented Generation) ?"
        answers:
          - "Récupérer des documents pertinents puis les fournir au LLM pour qu'il génère une réponse ancrée"
          - "Réentraîner le LLM en continu sur les documents internes"
          - "Compresser les documents en un vecteur unique avant génération"
          - "Générer du texte sans aucun accès à des sources externes"
        correct: 0
        explanation: "RAG = retrieval (recherche de passages pertinents) puis generation (LLM conditionné sur ces passages)."
      - id: q2
        question: "Quel est l'ordre des étapes principales d'un pipeline RAG à l'inférence ?"
        answers:
          - "Embedding de la requête → recherche vectorielle → assemblage du prompt → génération"
          - "Génération → recherche vectorielle → embedding → réponse"
          - "Compilation → exécution → recherche → génération"
          - "Indexation → entraînement → fine-tuning → génération"
        correct: 0
        explanation: "À l'inférence : on encode la requête, on récupère les top-k passages, on les injecte dans le prompt, puis on génère."
      - id: q3
        question: "Quel est le rôle d'une base vectorielle dans un système RAG ?"
        answers:
          - "Stocker et rechercher efficacement des embeddings pour retrouver les passages les plus proches sémantiquement"
          - "Compiler le code source du LLM"
          - "Servir d'interface utilisateur graphique"
          - "Authentifier les utilisateurs de l'agent"
        correct: 0
        explanation: "Une base vectorielle (Pinecone, Chroma, FAISS…) indexe les embeddings et fait de la recherche par similarité."
      - id: q4
        question: "Qu'est-ce que le « chunking » dans un pipeline RAG ?"
        answers:
          - "Découper les documents en segments de taille adaptée pour les embedder et les indexer"
          - "Compresser les documents au format zip"
          - "Chiffrer les documents avant indexation"
          - "Convertir les documents en images"
        correct: 0
        explanation: "Le chunking découpe les documents (par paragraphe, taille fixe, sémantique) afin de produire des unités indexables par le retriever."
      - id: q5
        question: "Quelle métrique de similarité est la plus utilisée pour comparer deux embeddings ?"
        answers:
          - "La similarité cosinus"
          - "La distance de Levenshtein"
          - "Le coefficient de Jaccard sur les caractères"
          - "Le hash MD5"
        correct: 0
        explanation: "La similarité cosinus mesure l'angle entre vecteurs et est la métrique standard pour les embeddings sémantiques."
      - id: q6
        question: "Quel est un cas d'usage emblématique de RAG ?"
        answers:
          - "Un assistant qui répond à partir de la documentation technique interne d'une entreprise"
          - "L'entraînement d'un modèle de vision sur ImageNet"
          - "La compilation Just-In-Time du JavaScript"
          - "Le rendu 3D d'une scène vidéoludique"
        correct: 0
        explanation: "Les FAQ d'entreprise et assistants documentaires sont les cas d'usage canoniques de RAG."
      - id: q7
        question: "Quel est l'avantage principal de RAG par rapport au réentraînement complet d'un LLM ?"
        answers:
          - "Mettre à jour la connaissance de l'agent sans modifier les poids du modèle, à coût bien moindre"
          - "Réduire de moitié le nombre de paramètres du modèle"
          - "Supprimer totalement les hallucinations sans autre garde-fou"
          - "Permettre au modèle de fonctionner sans GPU"
        correct: 0
        explanation: "RAG met à jour la base documentaire, beaucoup moins coûteux que de ré-entraîner un LLM sur de nouvelles données."
      - id: q8
        question: "Que désigne RIG (Retrieval Interleaved Generation) ?"
        answers:
          - "Une approche où la récupération d'informations est entrelacée avec les étapes de génération du modèle"
          - "Une variante de RAG sans aucune base de connaissances"
          - "Un protocole d'interconnexion entre serveurs"
          - "Une technique de quantisation des poids du modèle"
        correct: 0
        explanation: "Dans RIG, le modèle peut déclencher des recherches au cours même de la génération, pas seulement avant."
      - id: q9
        question: "Quelle est la différence essentielle entre RAG et RIG ?"
        answers:
          - "Dans RAG la récupération est faite une fois avant la génération, dans RIG elle est intercalée pendant la génération"
          - "RAG fonctionne sur du texte, RIG uniquement sur des images"
          - "RIG ne peut pas utiliser de base vectorielle"
          - "RAG produit des réponses sans citation, RIG jamais"
        correct: 0
        explanation: "RAG = retrieve-then-generate (one-shot). RIG = retrieval entrelacée pendant la génération."
      - id: q10
        question: "Quelle est une force majeure de l'approche RIG ?"
        answers:
          - "Permettre une vérification factuelle ciblée et continue au fil de la génération"
          - "Éliminer le besoin d'une base de connaissances"
          - "Supprimer toute latence à l'inférence"
          - "Rendre le modèle déterministe à 100 %"
        correct: 0
        explanation: "RIG cherche au moment où l'information précise est nécessaire, ce qui améliore la fidélité factuelle ponctuelle."
      - id: q11
        question: "Quelle est une faiblesse fréquente de RIG par rapport à RAG ?"
        answers:
          - "Une latence et une complexité d'orchestration accrues"
          - "Une consommation mémoire systématiquement nulle"
          - "L'impossibilité d'utiliser des LLM modernes"
          - "L'absence totale de cas d'usage industriels"
        correct: 0
        explanation: "Les retrievals multiples au sein d'une même génération augmentent latence et complexité du pipeline."
      - id: q12
        question: "Quel cas d'usage est particulièrement bien servi par RIG ?"
        answers:
          - "Une réponse contenant plusieurs faits chiffrés précis à vérifier individuellement"
          - "Une discussion libre sans contrainte factuelle"
          - "La traduction d'un poème"
          - "La génération artistique d'images abstraites"
        correct: 0
        explanation: "RIG excelle quand la réponse mêle plusieurs faits ponctuels qu'il faut vérifier au fur et à mesure."
      - id: q13
        question: "Quel est le rôle d'une base de connaissances structurée dans un système RAG/RIG ?"
        answers:
          - "Fournir des informations fiables, organisées et mises à jour comme source de vérité pour l'agent"
          - "Remplacer totalement le LLM"
          - "Servir uniquement de cache pour les réponses précédentes"
          - "Stocker exclusivement les logs d'erreur"
        correct: 0
        explanation: "La base de connaissances est la source d'informations factuelles que l'agent récupère et cite."
      - id: q14
        question: "Que désigne le terme « information retrieval » (IR) dans ce contexte ?"
        answers:
          - "L'ensemble des techniques pour retrouver des documents pertinents à partir d'une requête"
          - "La sauvegarde régulière des fichiers utilisateurs"
          - "La récupération des paramètres d'un modèle après crash"
          - "La transmission TCP/IP des données"
        correct: 0
        explanation: "L'information retrieval recouvre les méthodes (lexicales, vectorielles, hybrides) de recherche d'information."
      - id: q15
        question: "Que signifie « top-k retrieval » ?"
        answers:
          - "Sélectionner les k passages les plus pertinents selon le score de similarité"
          - "Conserver uniquement les k derniers tokens du prompt"
          - "Garder seulement k modèles dans un ensemble"
          - "Limiter à k le nombre d'utilisateurs simultanés"
        correct: 0
        explanation: "Top-k retrieval retourne les k meilleurs résultats classés par score (typiquement k entre 3 et 20)."
      - id: q16
        question: "Qu'est-ce que le « reranking » après une recherche vectorielle ?"
        answers:
          - "Re-classer les passages récupérés via un modèle plus précis (cross-encoder) pour améliorer la pertinence"
          - "Réindexer toute la base à chaque requête"
          - "Appliquer un tri alphabétique sur les résultats"
          - "Supprimer les doublons exacts dans la base"
        correct: 0
        explanation: "Le reranker (souvent un cross-encoder) re-score finement les top-k pour ne garder que les plus pertinents."
      - id: q17
        question: "Dans quel cas RAG est-il généralement préférable à RIG ?"
        answers:
          - "Quand le contexte nécessaire peut être identifié dès le départ et tient dans la fenêtre du LLM"
          - "Quand chaque mot généré doit déclencher une nouvelle recherche"
          - "Quand on n'a aucune base documentaire"
          - "Quand on ne dispose d'aucun budget GPU"
        correct: 0
        explanation: "RAG suffit quand un retrieval initial fournit l'essentiel du contexte ; pas besoin d'entrelacement."
      - id: q18
        question: "Dans quel cas RIG est-il généralement préférable à RAG ?"
        answers:
          - "Quand la réponse implique plusieurs faits ponctuels qu'il faut récupérer au moment où on les cite"
          - "Quand la requête est triviale et ne nécessite aucun contexte"
          - "Quand on souhaite minimiser à tout prix la latence"
          - "Quand on veut désactiver le retrieval"
        correct: 0
        explanation: "RIG est utile lorsque les besoins informationnels apparaissent en cours de génération."
      - id: q19
        question: "Quelle est une limite commune à RAG et RIG ?"
        answers:
          - "La qualité des réponses dépend fortement de la qualité et de la couverture du corpus indexé"
          - "Ils ne peuvent pas utiliser de modèles de langage"
          - "Ils interdisent toute citation de sources"
          - "Ils suppriment automatiquement les biais des données"
        correct: 0
        explanation: "Si le corpus est lacunaire ou biaisé, le retrieval ramène du bruit et la génération en pâtit."
      - id: q20
        question: "Quelle stratégie aide à réduire les hallucinations dans un système RAG ?"
        answers:
          - "Imposer dans le prompt de citer des sources et de répondre « je ne sais pas » si le contexte est insuffisant"
          - "Augmenter la température du modèle au maximum"
          - "Désactiver complètement la base de connaissances"
          - "Supprimer le system prompt"
        correct: 0
        explanation: "Forcer le modèle à s'appuyer sur le contexte fourni et à signaler son incertitude réduit les hallucinations."
  - id: graphrag-structrag
    title: "Exploration des architectures GraphRAG et StructRAG"
    questions:
      - id: q1
        question: "Quelle est la définition la plus précise de GraphRAG ?"
        answers:
          - "Une variante de RAG qui s'appuie sur un graphe de connaissances pour structurer la récupération et le raisonnement"
          - "Un format graphique de présentation des prompts"
          - "Un type de réseau de neurones convolutionnel"
          - "Une bibliothèque de visualisation 2D"
        correct: 0
        explanation: "GraphRAG (Microsoft Research) construit un graphe d'entités et de relations à partir du corpus pour mieux raisonner."
      - id: q2
        question: "Quelle structure de données fonde GraphRAG ?"
        answers:
          - "Un graphe de connaissances (entités reliées par des relations typées)"
          - "Un tableau Excel à plat"
          - "Une simple liste chaînée de documents"
          - "Un cube OLAP"
        correct: 0
        explanation: "GraphRAG modélise la connaissance sous forme de nœuds (entités) et d'arêtes (relations)."
      - id: q3
        question: "Quel est l'avantage d'un graphe de connaissances par rapport à un index vectoriel pur ?"
        answers:
          - "Il rend explicites les relations entre entités, ce qui aide au raisonnement multi-étapes"
          - "Il occupe systématiquement moins de stockage"
          - "Il supprime tout besoin de LLM"
          - "Il garantit l'absence d'erreurs de génération"
        correct: 0
        explanation: "Le graphe explicite les liens (qui-fait-quoi-avec-qui), facilitant les raisonnements multi-hop difficiles pour la similarité vectorielle seule."
      - id: q4
        question: "Quels sont les composants élémentaires d'un graphe de connaissances ?"
        answers:
          - "Des nœuds (entités), des arêtes (relations) et éventuellement des propriétés"
          - "Des classes, méthodes et constructeurs"
          - "Des tables, colonnes et index"
          - "Des images, vidéos et sons"
        correct: 0
        explanation: "Un knowledge graph se compose d'entités (nœuds) reliées par des relations typées (arêtes), porteuses ou non de propriétés."
      - id: q5
        question: "Comment construit-on typiquement un graphe à partir de textes en GraphRAG ?"
        answers:
          - "En utilisant un LLM pour extraire automatiquement entités et relations à partir des documents"
          - "En écrivant manuellement chaque triplet sujet-verbe-objet"
          - "En convertissant les fichiers en images PNG"
          - "En appliquant un simple split par espaces"
        correct: 0
        explanation: "Les pipelines GraphRAG modernes utilisent un LLM pour faire l'extraction d'entités/relations à grande échelle."
      - id: q6
        question: "Pour quel type de question GraphRAG est-il particulièrement adapté ?"
        answers:
          - "Les questions multi-hop reliant plusieurs entités (ex. « qui dirige une filiale fondée par X ? »)"
          - "Les calculs de matrices de pixels"
          - "La compression d'images JPEG"
          - "Le tri rapide d'un tableau"
        correct: 0
        explanation: "Les questions nécessitant de chaîner plusieurs relations bénéficient grandement de la structure du graphe."
      - id: q7
        question: "Quelle est une limite reconnue de GraphRAG ?"
        answers:
          - "Le coût et la complexité de construction et de maintenance du graphe à grande échelle"
          - "L'impossibilité d'utiliser des LLM"
          - "L'absence totale de cas d'usage industriels"
          - "L'interdiction d'utiliser des embeddings"
        correct: 0
        explanation: "Construire et maintenir un graphe (extraction, déduplication, mises à jour) est coûteux et exigeant."
      - id: q8
        question: "Quelle est la définition la plus précise de StructRAG ?"
        answers:
          - "Une approche RAG centrée sur la structuration des données récupérées (tableaux, schémas) pour améliorer la précision"
          - "Une variante de RAG qui ignore toute structure"
          - "Un format de fichier propriétaire de Google"
          - "Un protocole de chiffrement de bout en bout"
        correct: 0
        explanation: "StructRAG met l'accent sur des représentations structurées (JSON, tables) pour mieux exploiter des données complexes."
      - id: q9

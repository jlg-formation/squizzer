          de comprendre et vérifier la réponse de l'agent."
  - id: "perspectives-futures"
    title: "Perspectives futures et innovations dans les agents intelligents"
    questions:
      - id: "q1"
        question:
          "Que désigne un « agentic workflow » dans le contexte des agents
          intelligents ?"
        answers:
          - "Un pipeline figé d'appels LLM exécutés toujours dans le même ordre"
          - "Un flux de travail où l'agent planifie, choisit ses outils et itère
            de façon autonome vers un objectif"
          - "Une interface graphique permettant à l'utilisateur de dessiner
            manuellement les étapes du raisonnement"
          - "Un mécanisme de cache des réponses du modèle pour réduire la
            latence"
        correct: 1
        explanation:
          "Un agentic workflow laisse l'agent décomposer la tâche, sélectionner
          dynamiquement ses outils et boucler jusqu'à atteindre l'objectif,
          plutôt que de suivre un script statique."
      - id: "q2"
        question:
          "Quel est l'objectif principal du protocole MCP (Model Context
          Protocol) ?"
        answers:
          - "Compresser les prompts envoyés au modèle pour réduire la
            consommation de tokens"
          - "Standardiser la façon dont un LLM se connecte à des sources de
            données et à des outils externes"
          - "Chiffrer les échanges entre l'utilisateur et le modèle de langage"
          - "Remplacer les bases vectorielles par un index relationnel"
        correct: 1
        explanation:
          "MCP est un protocole ouvert qui standardise la connexion des LLM à
          des outils, fichiers et services externes, facilitant
          l'interopérabilité des agents."
      - id: "q3"
        question:
          "Que désigne le « RAG hiérarchique » comme évolution des architectures
          RAG classiques ?"
        answers:
          - "Une recherche limitée à un seul niveau de granularité documentaire"
          - "Une organisation des connaissances en plusieurs niveaux (résumés,
            sections, passages) avec récupération multi-niveaux"
          - "Un RAG qui n'utilise que des graphes de connaissances"
          - "Un RAG qui supprime totalement l'étape de récupération"
        correct: 1
        explanation:
          "Le RAG hiérarchique structure les connaissances en niveaux (par
          exemple résumés puis passages détaillés) afin d'améliorer la
          pertinence et la couverture lors de la récupération."
      - id: "q4"
        question:
          "Quel apport majeur la « mémoire persistante » offre-t-elle aux agents
          intelligents ?"
        answers:
          - "Elle augmente automatiquement la taille de la fenêtre de contexte
            du modèle"
          - "Elle permet à l'agent de conserver des informations entre les
            sessions et de personnaliser ses réponses dans la durée"
          - "Elle remplace la nécessité de tout système de récupération externe"
          - "Elle garantit que l'agent ne produira jamais d'hallucinations"
        correct: 1
        explanation:
          "La mémoire persistante stocke faits, préférences et historique
          au-delà d'une seule conversation, permettant continuité,
          personnalisation et apprentissage progressif."
      - id: "q5"
        question:
          "Dans quel secteur l'usage d'agents intelligents combinant RAG et
          raisonnement structuré est-il particulièrement prometteur pour
          analyser jurisprudence et contrats ?"
        answers:
          - "La relation client de premier niveau"
          - "Le secteur juridique"
          - "La gestion d'inventaire en entrepôt"
          - "L'optimisation du routage réseau"
        correct: 1
        explanation:
          "Le domaine juridique manipule de gros corpus textuels structurés
          (lois, jurisprudence, contrats) où RAG et raisonnement structuré
          aident à retrouver et corréler les sources pertinentes."
      - id: "q6"
        question:
          "Que désigne le terme « agentic workflow » dans l'évolution des agents
          intelligents ?"
        answers:
          - "Un flux de travail orchestré par un agent capable de planifier et
            d'enchaîner des actions de manière autonome"
          - "Un script linéaire exécuté sans intervention d'un modèle de langage"
          - "Une interface graphique permettant de dessiner manuellement des
            pipelines RAG"
          - "Un protocole réseau dédié au transfert de prompts entre serveurs"
        correct: 0
        explanation:
          "Un agentic workflow repose sur un agent qui planifie, décide et
          enchaîne dynamiquement les étapes pour atteindre un objectif."
      - id: "q7"
        question:
          "À quoi sert principalement le protocole MCP (Model Context Protocol)
          dans les architectures d'agents modernes ?"
        answers:
          - "À compresser les embeddings vectoriels pour réduire les coûts de
            stockage"
          - "À standardiser la connexion entre un modèle de langage et des
            outils ou sources de données externes"

title:
  "Développer ses propres agents intelligents (RAG, RIG, GraphRAG, StructRAG)"
chapters:
  - id: "intro-ia-agents"
    title: "Introduction à l'IA générative et aux agents intelligents"
    questions:
      - id: "q1"
        question: "Qu'est-ce que l'IA générative ?"
        answers:
          - "Une IA capable de produire de nouveaux contenus (texte, image,
            code) à partir de données d'apprentissage"
          - "Une IA qui se limite à classer des données existantes en catégories
            prédéfinies"
          - "Un moteur de recherche amélioré qui indexe le web en temps réel"
          - "Un système expert basé uniquement sur des règles écrites
            manuellement"
        correct: 0
        explanation:
          "L'IA générative désigne les modèles capables de générer de nouveaux
          contenus (texte, image, audio, code) à partir des distributions
          apprises sur de vastes corpus."
      - id: "q2"
        question:
          "Quelle est la principale différence entre un chatbot classique basé
          sur des règles et un agent intelligent basé sur un LLM ?"
        answers:
          - "Le chatbot classique comprend mieux le langage naturel que le LLM"
          - "L'agent LLM peut raisonner, s'adapter à des requêtes ouvertes et
            utiliser des outils, alors que le chatbot classique suit des
            scénarios prédéfinis"
          - "Le chatbot classique est toujours plus coûteux à déployer qu'un
            agent LLM"
          - "Il n'y a pas de différence fonctionnelle, seul le nom change"
        correct: 1
        explanation:
          "Un chatbot à base de règles ou d'intentions suit des arbres de
          décision figés, tandis qu'un agent LLM peut généraliser, raisonner et
          invoquer des outils pour accomplir des tâches variées."
      - id: "q3"
        question:
          "Pourquoi enrichir un LLM avec une source de données externe
          (architecture RAG, par exemple) ?"
        answers:
          - "Pour réduire la taille du modèle de langage à entraîner"
          - "Pour empêcher l'utilisateur de poser des questions hors sujet"
          - "Pour fournir au modèle des connaissances à jour ou spécifiques à un
            domaine et limiter les hallucinations"
          - "Pour supprimer toute nécessité d'effectuer un prompt engineering"
        correct: 2
        explanation:
          "L'enrichissement par une source externe permet d'apporter au LLM des
          informations récentes ou métier qu'il ne connaît pas, et d'ancrer ses
          réponses dans des documents vérifiables."
      - id: "q4"
        question:
          "Que signifie l'acronyme RAG dans le contexte des agents intelligents
          ?"
        answers:
          - "Retrieval-Augmented Generation"
          - "Random Access Generator"
          - "Rule-Augmented Grammar"
          - "Recursive Agent Graph"
        correct: 0
        explanation:
          "RAG signifie Retrieval-Augmented Generation : le LLM génère sa
          réponse en s'appuyant sur des documents récupérés au préalable par un
          moteur de recherche."
      - id: "q5"
        question:
          "Parmi les architectures suivantes, laquelle s'appuie spécifiquement
          sur un graphe de connaissances pour structurer la récupération
          d'information ?"
        answers:
          - "RAG"
          - "RIG"
          - "GraphRAG"
          - "StructRAG"
        correct: 2
        explanation:
          "GraphRAG exploite un graphe de connaissances (entités et relations)
          pour guider la récupération et fournir au LLM un contexte structuré et
          relationnel."
      - id: "q6"
        question:
          "Quelle est la principale limite d'un LLM utilisé seul, sans source
          externe ?"
        answers:
          - "Il ne peut pas générer de texte en français"
          - "Ses connaissances sont figées à sa date d'entraînement et il peut
            halluciner"
          - "Il consomme trop peu de ressources pour être utile"
          - "Il ne sait répondre qu'à des questions fermées"
        correct: 1
        explanation:
          "Un LLM seul a des connaissances figées à son entraînement et peut
          produire des réponses inventées (hallucinations), d'où l'intérêt de
          l'enrichir via RAG ou des outils."
      - id: "q7"
        question: "Que signifie l'acronyme RAG ?"
        answers:
          - "Retrieval-Augmented Generation"
          - "Recursive Agent Graph"
          - "Random Answer Generator"
          - "Reinforced Adaptive Grounding"
        correct: 0
        explanation:
          "RAG signifie Retrieval-Augmented Generation : on enrichit la
          génération du LLM par une étape de récupération d'informations dans
          une source externe."
      - id: "q8"
        question: "En quoi GraphRAG se distingue-t-il d'un RAG classique ?"
        answers:
          - "Il n'utilise aucune source externe"
          - "Il s'appuie sur un graphe de connaissances pour exploiter les
            relations entre entités"
          - "Il remplace le LLM par un modèle de vision"
          - "Il fonctionne uniquement hors ligne, sans index"
        correct: 1
        explanation:
          "GraphRAG structure la connaissance sous forme de graphe d'entités et
          de relations, ce qui permet des requêtes plus riches qu'une simple
          recherche vectorielle."
      - id: "q9"
        question:
          "Quelle architecture privilégier pour interroger des données fortement
          structurées comme des tableaux ou bases relationnelles ?"
        answers:
          - "RIG"
          - "RAG vectoriel pur"
          - "StructRAG"
          - "Chatbot à base de règles"
        correct: 2
        explanation:
          "StructRAG est conçu pour exploiter des données structurées (tableaux,
          schémas, bases) en préservant leur structure lors de la récupération
          et du raisonnement."
      - id: "q10"
        question:
          "Qu'est-ce qui caractérise un agent basé sur un LLM par rapport à un
          chatbot classique à intentions ?"
        answers:
          - "Il se limite à un arbre de décision prédéfini"
          - "Il ne peut pas appeler d'API externes"
          - "Il peut raisonner, planifier des étapes et utiliser des outils de
            manière autonome"
          - "Il répond uniquement par mots-clés"
        correct: 2
        explanation:
          "Un agent LLM peut raisonner, décomposer une tâche en étapes et
          invoquer des outils externes, là où un chatbot à intentions suit des
          scénarios prédéfinis."
      - id: "q11"
        question:
          "Pourquoi enrichir un LLM avec une source de données externe via une
          architecture comme RAG ?"
        answers:
          - "Pour réduire la taille du modèle et accélérer son entraînement
            initial"
          - "Pour fournir au modèle des informations à jour ou spécifiques à un
            domaine sans avoir à le réentraîner"
          - "Pour supprimer toute hallucination de manière garantie et
            définitive"
          - "Pour permettre au modèle de fonctionner totalement hors ligne sans
            aucune dépendance"
        correct: 1
        explanation:
          "Enrichir un LLM avec une source externe (RAG, GraphRAG, etc.) permet
          d'injecter des connaissances actualisées ou métier au moment de la
          requête, sans coût de réentraînement."
      - id: "q12"
        question:
          "Qu'est-ce qui distingue principalement un agent basé sur un LLM d'un
          chatbot classique à base de règles ou d'intentions ?"
        answers:
          - "L'agent LLM se limite à des réponses préprogrammées par le
            développeur"
          - "Le chatbot classique peut raisonner librement et utiliser
            dynamiquement des outils externes"
          - "L'agent LLM peut raisonner, planifier des étapes et appeler des
            outils de manière autonome"
          - "Il n'existe aucune différence fonctionnelle, seul le nom change"
        correct: 2
        explanation:
          "Un agent à base de LLM apporte du raisonnement, une certaine
          autonomie et la capacité d'orchestrer des outils, là où un chatbot à
          intentions suit des scripts ou des règles fixes."
      - id: "q13"
        question:
          "Quelle est la particularité de l'architecture GraphRAG par rapport à
          un RAG classique ?"
        answers:
          - "Elle s'appuie sur un graphe de connaissances pour structurer et
            relier les informations récupérées"
          - "Elle supprime totalement l'étape de récupération de documents
            externes"
          - "Elle remplace le LLM par un moteur de règles symboliques"
          - "Elle ne fonctionne qu'avec des données purement numériques"
        correct: 0
        explanation:
          "GraphRAG exploite un graphe de connaissances pour relier entités et
          concepts, ce qui améliore la pertinence et la cohérence des
          informations fournies au LLM."
      - id: "q14"
        question: "Que désigne le terme « IA générative » ?"
        answers:
          - "Une IA spécialisée uniquement dans la classification d'images
            existantes"
          - "Une IA capable de produire de nouveaux contenus (texte, image,
            code, etc.) à partir d'un apprentissage préalable"
          - "Un système expert basé exclusivement sur des règles écrites par des
            humains"
          - "Un moteur de recherche qui se contente de renvoyer des documents
            existants"
        correct: 1
        explanation:
          "L'IA générative regroupe les modèles capables de créer de nouveaux
          contenus (texte, image, audio, code) en s'appuyant sur des données
          d'entraînement."
      - id: "q15"
        question:
          "Dans quel cas l'architecture StructRAG est-elle particulièrement
          adaptée ?"
        answers:
          - "Quand les données pertinentes sont structurées (tableaux, schémas,
            bases) et qu'il faut préserver cette structure dans la récupération"
          - "Quand on souhaite uniquement générer des images à partir de texte
            libre"
          - "Quand on veut se passer complètement de tout LLM dans le pipeline"
          - "Quand les données sources sont exclusivement audio et non
            textuelles"
        correct: 0
        explanation:
          "StructRAG est conçu pour exploiter des sources de données structurées
          en conservant leur organisation, ce qui améliore la précision des
          réponses sur des contenus tabulaires ou schématisés."
      - id: "q16"
        question: "Qu'est-ce que l'IA générative ?"
        answers:
          - "Une IA capable de produire de nouveaux contenus (texte, image,
            code) à partir de données apprises"
          - "Une IA dédiée uniquement au classement de données existantes"
          - "Un moteur de recherche basé sur des mots-clés"
          - "Un système expert reposant uniquement sur des règles métier figées"
        correct: 0
        explanation:
          "L'IA générative produit de nouveaux contenus (texte, image, code,
          audio) en s'appuyant sur des modèles entraînés sur de grands corpus."
      - id: "q17"
        question:
          "Quelle est la principale différence entre un chatbot classique et un
          agent basé sur un LLM ?"
        answers:
          - "Le chatbot classique comprend mieux le langage naturel que le LLM"
          - "Le chatbot classique repose sur des règles ou intentions
            prédéfinies, alors que l'agent LLM peut raisonner et générer des
            réponses ouvertes"
          - "L'agent LLM ne peut traiter que des questions fermées"
          - "Il n'y a aucune différence fonctionnelle entre les deux"
        correct: 1
        explanation:
          "Un chatbot classique suit des scripts ou intentions, tandis qu'un
          agent LLM raisonne, généralise et peut utiliser des outils externes."
      - id: "q18"
        question:
          "Pourquoi enrichir un LLM avec une source de données externe via une
          architecture RAG ?"
        answers:
          - "Pour réduire la taille du modèle de langage"
          - "Pour ancrer les réponses dans des informations à jour ou
            spécifiques et limiter les hallucinations"
          - "Pour empêcher le modèle de générer du texte"
          - "Pour remplacer entièrement l'entraînement du modèle"
        correct: 1
        explanation:
          "Le RAG (Retrieval-Augmented Generation) injecte un contexte issu
          d'une base externe afin d'améliorer la pertinence factuelle des
          réponses."
      - id: "q19"
        question: "Que désigne l'architecture GraphRAG ?"
        answers:
          - "Une variante du RAG qui s'appuie sur un graphe de connaissances
            pour structurer la récupération d'information"
          - "Un format graphique d'affichage des réponses du LLM"
          - "Un protocole réseau pour interroger un LLM"
          - "Une méthode d'entraînement supervisé d'un LLM sur des images"
        correct: 0
        explanation:
          "GraphRAG exploite un graphe de connaissances (entités et relations)
          pour récupérer un contexte plus riche et structuré qu'une simple
          recherche vectorielle."
      - id: "q20"
        question:
          "Quelle capacité distingue particulièrement un agent intelligent basé
          sur un LLM d'un simple appel à un LLM ?"
        answers:
          - "Il ne peut répondre qu'à une seule question à la fois"
          - "Il est limité à du texte statique sans interaction"
          - "Il peut planifier des étapes, utiliser des outils externes et agir
            de manière autonome pour atteindre un objectif"
          - "Il fonctionne uniquement hors ligne sans aucune dépendance"
        correct: 2
        explanation:
          "Un agent intelligent combine raisonnement, planification et
          utilisation d'outils (recherche, API, code) pour accomplir des tâches
          de façon autonome."
  - id: "rag-rig-fondamentaux"
    title: "Fondamentaux des architectures RAG et RIG"
    questions:
      - id: "q1"
        question:
          "Que signifie l'acronyme RAG dans le domaine des agents intelligents ?"
        answers:
          - "Retrieval Augmented Generation"
          - "Random Access Generator"
          - "Recursive Adaptive Grammar"
          - "Reinforced Agent Graph"
        correct: 0
        explanation:
          "RAG signifie Retrieval Augmented Generation : on enrichit la
          génération du modèle avec des documents récupérés depuis une base de
          connaissances."
      - id: "q2"
        question:
          "Dans un pipeline RAG, à quoi sert principalement une base vectorielle
          ?"
        answers:
          - "À héberger le modèle de langage utilisé pour la génération"
          - "À stocker les embeddings des documents pour permettre une recherche
            par similarité sémantique"
          - "À journaliser les requêtes des utilisateurs à des fins d'audit"
          - "À convertir les réponses du modèle en fichiers PDF"
        correct: 1
        explanation:
          "La base vectorielle indexe les embeddings des chunks de documents
          afin que le retriever puisse retrouver les passages les plus proches
          sémantiquement de la requête."
      - id: "q3"
        question:
          "Quelle est la différence essentielle entre RAG et RIG (Retrieval
          Interleaved Generation) ?"
        answers:
          - "RIG ne fait aucune récupération et s'appuie uniquement sur la
            mémoire du modèle"
          - "RAG entrelace les récupérations pendant la génération token par
            token, contrairement à RIG"
          - "RIG entrelace plusieurs récupérations pendant la génération, alors
            que RAG récupère le contexte une seule fois avant de générer"
          - "RAG et RIG sont strictement équivalents, seuls les noms diffèrent"
        correct: 2
        explanation:
          "En RAG la récupération est faite en amont puis le modèle génère,
          tandis qu'en RIG la récupération est entrelacée durant la génération
          pour réinjecter du contexte au fil de l'eau."
      - id: "q4"
        question:
          "Parmi les propositions suivantes, laquelle est un cas d'usage typique
          de RAG ?"
        answers:
          - "Compression d'images sans perte"
          - "Assistant de support client répondant à partir d'une base
            documentaire interne"
          - "Entraînement initial d'un modèle de langage à partir de zéro"
          - "Optimisation des requêtes SQL d'une base relationnelle"
        correct: 1
        explanation:
          "RAG est particulièrement adapté aux FAQ, au support client et à
          l'assistance documentaire, car il permet de répondre en s'appuyant sur
          des connaissances spécifiques à l'entreprise."
      - id: "q5"
        question:
          "À quoi sert l'étape de reranking dans un pipeline de récupération ?"
        answers:
          - "À découper les documents en chunks de taille uniforme"
          - "À calculer les embeddings initiaux des documents indexés"
          - "À réordonner les passages candidats retournés par le retriever afin
            de placer les plus pertinents en tête"
          - "À traduire automatiquement les documents en plusieurs langues"
        correct: 2
        explanation:
          "Le reranking applique un modèle plus précis (souvent un
          cross-encoder) sur les top-k résultats du retriever pour améliorer la
          pertinence du contexte transmis au générateur."
      - id: "q6"
        question:
          "Quel composant d'un pipeline RAG est responsable de la transformation
          d'un texte en vecteur numérique exploitable pour la recherche
          sémantique ?"
        answers:
          - "Le générateur"
          - "Le modèle d'embeddings"
          - "Le reranker"
          - "Le chunker"
        correct: 1
        explanation:
          "Le modèle d'embeddings convertit chaque texte (document ou requête)
          en un vecteur dense, ce qui permet ensuite de mesurer leur similarité
          dans la base vectorielle."
      - id: "q7"
        question:
          "Dans une architecture RAG classique, quel est le rôle principal du
          retriever ?"
        answers:
          - "Générer la réponse finale en langage naturel"
          - "Découper les documents sources en passages exploitables"
          - "Sélectionner les passages les plus pertinents dans la base de
            connaissances pour une requête donnée"
          - "Entraîner le modèle de langage sur les données internes"
        correct: 2
        explanation:
          "Le retriever interroge la base vectorielle (ou un autre index) et
          renvoie les passages les plus similaires à la requête, qui seront
          ensuite fournis au générateur comme contexte."
      - id: "q8"
        question:
          "Qu'est-ce qui distingue principalement le RIG (Retrieval Interleaved
          Generation) du RAG classique ?"
        answers:
          - "Le RIG n'utilise pas de base de connaissances externe"
          - "Le RIG effectue plusieurs récupérations entrelacées au fil de la
            génération, là où le RAG récupère une seule fois en amont"
          - "Le RIG remplace totalement le modèle de langage par un moteur de
            recherche"
          - "Le RIG ne fonctionne que sur des documents structurés en graphe"
        correct: 1
        explanation:
          "Le RIG intercale des étapes de récupération pendant la génération, ce
          qui permet d'aller chercher de nouvelles informations en cours de
          réponse au lieu de se limiter à un contexte figé en amont."
      - id: "q9"
        question:
          "Parmi les éléments suivants, lequel est un avantage typique du RIG
          par rapport au RAG simple ?"
        answers:
          - "Une latence systématiquement plus faible"
          - "Une mise en œuvre plus simple à déployer"
          - "Une meilleure fraîcheur et une fiabilité accrue des informations
            citées au fil de la réponse"
          - "L'absence totale d'hallucinations dans toutes les situations"
        correct: 2
        explanation:
          "En récupérant à plusieurs reprises pendant la génération, le RIG peut
          apporter des informations plus fraîches et mieux ancrées, au prix
          d'une latence et d'une complexité plus élevées."
      - id: "q10"
        question:
          "À quoi sert l'étape de reranking dans un pipeline d'extraction
          d'informations pour RAG ?"
        answers:
          - "À découper les documents en chunks de taille homogène"
          - "À réordonner les passages initialement récupérés afin de placer les
            plus pertinents en tête du contexte"
          - "À générer la réponse finale présentée à l'utilisateur"
          - "À convertir les requêtes utilisateur en embeddings"
        correct: 1
        explanation:
          "Le reranker applique un modèle plus fin (souvent un cross-encoder)
          sur les candidats remontés par le retriever pour améliorer l'ordre de
          pertinence avant l'envoi au générateur."
      - id: "q11"
        question:
          "Que signifie l'acronyme RAG dans le contexte des agents intelligents
          ?"
        answers:
          - "Retrieval Augmented Generation"
          - "Random Answer Generator"
          - "Recursive Agent Graph"
          - "Reinforced Adaptive Grounding"
        correct: 0
        explanation:
          "RAG signifie Retrieval Augmented Generation : une architecture qui
          enrichit la génération d'un LLM avec des informations récupérées dans
          une base de connaissances."
      - id: "q12"
        question: "Dans un pipeline RAG, à quoi sert un embedding ?"
        answers:
          - "À chiffrer les documents stockés dans la base"
          - "À représenter un texte sous forme de vecteur numérique pour mesurer
            la similarité sémantique"
          - "À compresser les réponses du modèle pour réduire la latence"
          - "À traduire automatiquement les requêtes utilisateur"
        correct: 1
        explanation:
          "Un embedding transforme un texte en vecteur dense dont la proximité
          géométrique reflète la proximité sémantique, ce qui permet la
          recherche par similarité."
      - id: "q13"
        question:
          "Quelle est la principale différence entre RAG et RIG (Retrieval
          Interleaved Generation) ?"
        answers:
          - "RIG n'utilise aucune base vectorielle, contrairement à RAG"
          - "RAG entrelace les récupérations pendant la génération, RIG les fait
            avant"
          - "RIG entrelace plusieurs récupérations pendant la génération, alors
            que RAG récupère généralement avant de générer"
          - "RAG et RIG sont strictement équivalents, seul le nom diffère"
        correct: 2
        explanation:
          "RIG déclenche des récupérations au fil de la génération du texte,
          tandis que RAG effectue typiquement une récupération unique en amont
          avant de générer la réponse."
      - id: "q14"
        question:
          "Quel est un inconvénient classique du RIG par rapport à un RAG simple
          ?"
        answers:
          - "Une fraîcheur d'information moindre"
          - "Une latence plus élevée et une complexité accrue du pipeline"
          - "Une incapacité à utiliser une base vectorielle"
          - "L'impossibilité de citer ses sources"
        correct: 1
        explanation:
          "Comme RIG effectue plusieurs récupérations entrelacées avec la
          génération, il augmente la latence globale et complexifie
          l'orchestration du pipeline."
      - id: "q15"
        question:
          "À quoi sert l'étape de reranking dans un système d'extraction
          d'informations RAG ?"
        answers:
          - "À découper les documents en chunks de taille fixe"
          - "À réordonner les passages candidats selon leur pertinence avant de
            les fournir au générateur"
          - "À recalculer les embeddings de la base à chaque requête"
          - "À supprimer définitivement les documents non pertinents de la base"
        correct: 1
        explanation:
          "Le reranking applique un modèle de scoring plus fin sur les passages
          renvoyés par le retriever afin de remonter en tête les plus pertinents
          avant la génération."
      - id: "q16"
        question:
          "Que désigne l'acronyme RAG dans le contexte des agents intelligents ?"
        answers:
          - "Retrieval Augmented Generation"
          - "Random Access Generation"
          - "Recursive Agent Graph"
          - "Reinforced Adversarial Generator"
        correct: 0
        explanation:
          "RAG signifie Retrieval Augmented Generation : on enrichit la
          génération du LLM avec des informations récupérées dans une base de
          connaissances."
      - id: "q17"
        question:
          "Quel composant d'un pipeline RAG est responsable de transformer un
          texte en vecteur numérique stocké dans la base vectorielle ?"
        answers:
          - "Le reranker"
          - "Le modèle d'embeddings"
          - "Le générateur"
          - "Le chunker"
        correct: 1
        explanation:
          "Le modèle d'embeddings convertit chaque chunk de texte en un vecteur
          dense qui sera indexé dans la base vectorielle pour permettre la
          recherche par similarité."
      - id: "q18"
        question:
          "Dans un pipeline RAG classique, quel est le rôle principal du
          retriever lors de la phase de requête ?"
        answers:
          - "Générer la réponse finale en langage naturel"
          - "Découper les documents sources en chunks"
          - "Sélectionner les passages les plus pertinents par similarité avec
            la question"
          - "Réentraîner le modèle de langage sur les nouvelles données"
        correct: 2
        explanation:

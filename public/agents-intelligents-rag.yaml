  - id: optimisation-performance
    title: "Optimisation et performance des agents intelligents"
    questions:
      - id: q1
        question: "Que mesure la métrique « recall@k » dans un système de retrieval ?"
        answers:
          - "La proportion de documents pertinents effectivement présents dans les k premiers résultats"
          - "Le temps moyen de réponse du serveur"
          - "Le nombre de tokens consommés par requête"
          - "La taille du modèle en gigaoctets"
        correct: 0
        explanation: "Recall@k = (docs pertinents retrouvés dans top-k) / (total docs pertinents)."
      - id: q2
        question: "Que mesure la métrique « precision@k » ?"
        answers:
          - "La proportion de documents pertinents parmi les k premiers résultats"
          - "Le temps de calcul du retriever"
          - "Le nombre de paramètres du modèle"
          - "La consommation électrique du serveur"
        correct: 0
        explanation: "Precision@k = (docs pertinents dans top-k) / k."
      - id: q3
        question: "Que représente la métrique MRR (Mean Reciprocal Rank) ?"
        answers:
          - "La moyenne des inverses du rang du premier document pertinent retourné"
          - "Le nombre moyen de mots par document"
          - "La latence médiane du LLM"
          - "Le coût mensuel d'hébergement"
        correct: 0
        explanation: "MRR récompense le fait que le premier résultat pertinent apparaisse haut dans le classement."

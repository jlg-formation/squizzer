          précision."
      - id: "q9"
        question:
          "Quel est le principe de la technique HyDE (Hypothetical Document
          Embeddings) ?"
        answers:
          - "Indexer uniquement des documents hypothétiques générés à l'avance"
          - "Faire générer par le LLM une réponse hypothétique à la requête,

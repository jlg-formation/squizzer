title:
  "Développer ses propres agents intelligents (RAG, RIG, GraphRAG, StructRAG) —
  ORSYS IAW"
chapters:
  - id: introduction-ia-generative-agents
    title: "Introduction à l'IA générative et aux agents intelligents"
    questions:
      - id: q1
        question: "Qu'est-ce que l'IA générative ?"
        answers:
          - "Une branche de l'IA capable de produire de nouveaux contenus
            (texte, image, audio, code) à partir de données d'entraînement"
          - "Un système expert basé exclusivement sur des règles écrites par des
            humains"
          - "Une méthode statistique limitée à la classification d'éléments
            existants"
          - "Un moteur de recherche qui se contente d'indexer des documents
            existants"
        correct: 0
        explanation:
          "L'IA générative désigne les modèles capables de générer de nouveaux
          contenus originaux (texte, image, son, code) en s'appuyant sur des
          distributions apprises lors de l'entraînement."
      - id: q2
        question:
          "Quelle est la différence fondamentale entre IA générative et IA
          discriminative ?"
        answers:
          - "L'IA discriminative génère de nouveaux contenus, l'IA générative se
            contente de classer"
          - "L'IA générative apprend à produire de nouvelles données, l'IA
            discriminative apprend à séparer ou classer des données existantes"
          - "Il n'y a aucune différence, ce sont deux noms pour la même approche"
          - "L'IA générative ne fonctionne qu'avec du texte, l'IA discriminative
            qu'avec des images"
        correct: 1
        explanation:
          "Un modèle discriminatif apprend une frontière de décision pour
          classer des entrées, tandis qu'un modèle génératif apprend la
          distribution des données afin d'en produire de nouveaux échantillons."
      - id: q3
        question:
          "Parmi les exemples suivants, lequel illustre une application typique
          de l'IA générative en entreprise ?"
        answers:
          - "La détection d'anomalies binaires dans des logs réseau"
          - "Le tri automatique d'e-mails entrants en spam ou non-spam"
          - "La rédaction assistée de comptes rendus, e-mails et synthèses de
            documents"
          - "Le calcul déterministe de la paie mensuelle des salariés"
        correct: 2
        explanation:
          "La rédaction et la synthèse automatisées de documents (comptes
          rendus, e-mails, résumés) sont des cas d'usage emblématiques de l'IA
          générative en entreprise."
      - id: q4
        question: "Qu'est-ce qu'un agent intelligent ?"
        answers:
          - "Un programme figé qui exécute toujours la même séquence
            d'instructions"
          - "Une entité logicielle capable de percevoir son environnement,
            raisonner et agir de façon autonome pour atteindre un objectif"
          - "Une interface graphique permettant de visualiser des données"
          - "Un simple formulaire web qui collecte des informations utilisateur"
        correct: 1
        explanation:
          "Un agent intelligent est un système autonome qui perçoit son
          environnement, prend des décisions en fonction d'un objectif, et agit
          en conséquence, souvent à l'aide d'outils."
      - id: q5
        question:
          "Quelle différence essentielle distingue un agent conversationnel
          classique d'un agent basé sur l'IA générative ?"
        answers:
          - "L'agent conversationnel classique repose souvent sur des scénarios
            et règles prédéfinis, alors que l'agent basé sur l'IA générative
            produit des réponses dynamiques à partir d'un modèle de langage"
          - "L'agent basé sur l'IA générative ne peut pas dialoguer avec un
            utilisateur"
          - "L'agent conversationnel classique comprend mieux le langage naturel
            qu'un modèle génératif"
          - "Il n'existe aucune différence, les deux utilisent les mêmes
            mécanismes internes"
        correct: 0
        explanation:
          "Les chatbots traditionnels s'appuient sur des arbres de dialogue ou
          des règles, tandis qu'un agent basé sur l'IA générative s'appuie sur
          un LLM pour produire des réponses contextuelles et flexibles."
      - id: q6
        question:
          "Quels sont les trois composants fondamentaux d'un agent intelligent ?"
        answers:
          - "Perception, raisonnement, action"
          - "Entrée, sortie, mémoire"
          - "Capteur, base de données, interface"
          - "Prompt, modèle, réponse"
        correct: 0
        explanation:
          "Un agent intelligent perçoit son environnement, raisonne sur les
          informations recueillies, puis agit en conséquence."
      - id: q7
        question:
          "Quel type d'agent combine réactivité immédiate et planification à
          long terme ?"
        answers:
          - "Agent réactif"
          - "Agent délibératif"
          - "Agent hybride"
          - "Agent stochastique"
        correct: 2
        explanation:
          "L'agent hybride associe la rapidité d'un agent réactif à la capacité
          de planification d'un agent délibératif."
      - id: q8
        question:
          "Quel est le rôle principal du LLM au sein d'un agent intelligent ?"
        answers:
          - "Stocker durablement les données métier de l'entreprise"
          - "Assurer le raisonnement et la génération de langage naturel"
          - "Exécuter directement les appels réseau et systèmes"
          - "Fournir l'interface graphique utilisateur"
        correct: 1
        explanation:
          "Le LLM sert de moteur de raisonnement et de compréhension/génération
          du langage, orchestrant les décisions de l'agent."
      - id: q9
        question:
          "Quelle est une limite majeure des agents purement conversationnels
          par rapport aux agents IA générative ?"
        answers:
          - "Ils ne peuvent pas comprendre le langage naturel"
          - "Ils ne peuvent pas exécuter d'actions concrètes ni utiliser
            d'outils externes"
          - "Ils consomment trop de ressources GPU"
          - "Ils ne savent pas afficher de texte à l'écran"
        correct: 1
        explanation:
          "Les agents conversationnels se limitent au dialogue, alors que les
          agents IA générative peuvent appeler des outils et accomplir des
          tâches concrètes."
      - id: q10
        question:
          "Que désigne globalement l'architecture RAG (Retrieval-Augmented
          Generation) ?"
        answers:
          - "Un modèle de langage entraîné sans données externes"
          - "Une approche qui récupère des documents pertinents pour enrichir le
            contexte du LLM avant la génération"
          - "Un protocole réseau pour interconnecter plusieurs LLM"
          - "Une technique de compression des poids d'un modèle"
        correct: 1
        explanation:
          "Le RAG combine une étape de recherche d'information dans une base
          documentaire avec la génération par un LLM, qui s'appuie sur le
          contexte récupéré."
      - id: q11
        question:
          "Quelle est la particularité de l'architecture RIG
          (Retrieval-Interleaved Generation) par rapport au RAG classique ?"
        answers:
          - "Elle entrelace plusieurs étapes de récupération et de génération au
            cours de la réponse"
          - "Elle remplace le modèle de langage par un moteur de règles
            symboliques"
          - "Elle interdit toute récupération externe et s'appuie uniquement sur
            le modèle"
          - "Elle se limite à indexer des images au lieu de documents textuels"
        correct: 0
        explanation:
          "Le RIG alterne récupération et génération de manière itérative, au
          lieu de récupérer une seule fois en amont comme le RAG classique."
      - id: q12
        question:
          "Sur quoi repose principalement l'architecture GraphRAG pour organiser
          les connaissances ?"
        answers:
          - "Sur un graphe de connaissances reliant entités et relations
            extraites des documents"
          - "Sur une base de données purement relationnelle sans index
            sémantique"
          - "Sur un simple cache clé-valeur des dernières requêtes utilisateur"
          - "Sur un modèle de diffusion d'images conditionné par le texte"
        correct: 0
        explanation:
          "GraphRAG construit un graphe d'entités et de relations à partir du
          corpus, ce qui permet des requêtes structurées et un raisonnement
          multi-sauts."
      - id: q13
        question: "Que vise principalement l'architecture StructRAG ?"
        answers:
          - "Structurer les informations récupérées dans un format adapté à la
            tâche avant la génération"
          - "Supprimer toute étape de récupération pour accélérer les réponses"
          - "Forcer le modèle à ne répondre qu'en JSON brut sans contexte"
          - "Remplacer le LLM par un moteur SQL classique"
        correct: 0
        explanation:
          "StructRAG met l'accent sur la structuration intermédiaire des
          connaissances récupérées (tables, arbres, graphes, etc.) afin
          d'améliorer le raisonnement du modèle."
      - id: q14
        question:
          "Dans quel cas d'usage un agent intelligent surpasse-t-il typiquement
          un chatbot conversationnel classique ?"
        answers:
          - "Exécuter une suite d'actions outillées pour résoudre une tâche
            complexe en plusieurs étapes"
          - "Répondre à une simple question de culture générale sans contexte"
          - "Reformuler un texte court sans accéder à des données externes"
          - "Traduire une phrase isolée d'une langue à une autre"
        correct: 0
        explanation:
          "Un agent excelle quand il faut planifier, appeler des outils et
          enchaîner plusieurs étapes, là où un chatbot classique se limite à une
          réponse textuelle directe."
      - id: q15
        question:
          "Quelle est la différence entre un prompt utilisateur et une
          instruction système (system prompt) ?"
        answers:
          - "L'instruction système définit le rôle et les règles du modèle, le
            prompt utilisateur exprime la demande ponctuelle"
          - "Le prompt utilisateur est toujours ignoré au profit de
            l'instruction système"
          - "Les deux sont strictement équivalents et interchangeables"
          - "L'instruction système est générée automatiquement par le modèle
            après la réponse"
        correct: 0
        explanation:
          "L'instruction système cadre le comportement global de l'agent
          (persona, contraintes, style), tandis que le prompt utilisateur
          correspond à la requête courante."
      - id: q16
        question: "Qu'entend-on par autonomie d'un agent intelligent ?"
        answers:
          - "Sa capacité à décider et à enchaîner des actions pour atteindre un
            objectif sans intervention humaine permanente"
          - "Sa capacité à fonctionner sans connexion réseau ni dépendance à un
            modèle distant"
          - "Sa capacité à apprendre seul de nouvelles compétences pendant
            l'exécution sans données ni outils"
          - "Sa capacité à générer du texte plus rapidement qu'un humain"
        correct: 0
        explanation:
          "L'autonomie désigne la capacité de l'agent à planifier, choisir des
          outils et enchaîner des étapes vers un but, avec une supervision
          humaine réduite."
      - id: q17
        question: "Qu'est-ce qu'une hallucination d'un modèle génératif ?"
        answers:
          - "Une réponse plausible en apparence mais factuellement fausse ou
            inventée"
          - "Un plantage du modèle qui renvoie une erreur technique"
          - "Une réponse volontairement biaisée par le fournisseur du modèle"
          - "Un dépassement de la fenêtre de contexte qui tronque la réponse"
        correct: 0
        explanation:
          "Une hallucination est une production fluide et crédible mais
          incorrecte, car le modèle génère statistiquement sans vérifier la
          véracité des faits."
      - id: q18
        question:
          "Pourquoi adosser un agent à une base de connaissances dédiée ?"
        answers:
          - "Pour ancrer ses réponses sur des sources vérifiées et réduire les
            hallucinations"
          - "Pour accélérer l'inférence du modèle de langage sous-jacent"
          - "Pour supprimer toute nécessité de prompt engineering"
          - "Pour éviter d'avoir à mettre à jour le modèle de langage lui-même"
        correct: 0
        explanation:
          "Une base de connaissances fournit un contexte factuel et à jour, ce
          qui fiabilise les réponses et limite les inventions du modèle."
      - id: q19
        question:
          "Quelle place occupent typiquement les agents intelligents dans la
          chaîne de productivité en entreprise ?"
        answers:
          - "Ils automatisent des tâches à forte composante informationnelle en
            complément des collaborateurs"
          - "Ils remplacent intégralement les systèmes d'information existants"
          - "Ils se substituent totalement aux équipes métier sur tous les
            processus"
          - "Ils servent uniquement à produire des contenus marketing"
        correct: 0
        explanation:
          "Les agents s'intègrent comme assistants ou exécutants de tâches
          (recherche, synthèse, rédaction, orchestration) en appui des équipes
          et des outils existants."
      - id: q20
        question:
          "Quel critère oriente le choix entre RAG, RIG, GraphRAG et StructRAG ?"
        answers:
          - "La nature et la structure des connaissances à exploiter (documents,
            données, relations, schémas)"
          - "La langue de l'interface utilisateur de l'agent"
          - "Le nombre d'utilisateurs simultanés attendus sur l'agent"
          - "La marque du modèle de langage utilisé"
        correct: 0
        explanation:
          "Le choix dépend principalement du type de sources : RAG pour des
          documents, RIG pour de la génération guidée par récupération, GraphRAG
          pour des relations, StructRAG pour des données structurées."
  - id: fondamentaux-rag-rig
    title: "Fondamentaux des architectures RAG et RIG"
    questions:
      - id: q1
        question: "Que désigne l'acronyme RAG dans le domaine des LLM ?"
        answers:
          - "Recursive Answer Generation"
          - "Retrieval Augmented Generation"
          - "Random Access Grounding"
          - "Reinforced Adaptive Generation"
        correct: 1
        explanation:
          "RAG signifie Retrieval Augmented Generation : on enrichit le prompt
          du modèle avec des informations récupérées dans une base de
          connaissances externe."
      - id: q2
        question:
          "Quel est l'ordre des étapes du pipeline classique d'un système RAG ?"
        answers:
          - "Génération, puis indexation, puis retrieval"
          - "Retrieval, puis indexation, puis génération"
          - "Indexation hors-ligne, puis retrieval, puis génération"
          - "Indexation, puis génération, puis retrieval de validation"
        correct: 2
        explanation:
          "Un RAG indexe d'abord les documents hors-ligne, puis pour chaque
          requête effectue un retrieval des passages pertinents avant de les
          fournir au LLM pour la génération."
      - id: q3
        question:
          "Quel est le rôle principal des embeddings dans un système RAG ?"
        answers:
          - "Compresser les réponses du LLM pour réduire les coûts"
          - "Représenter textes et requêtes sous forme de vecteurs numériques
            permettant une recherche sémantique"
          - "Chiffrer les documents stockés dans la base de connaissances"
          - "Traduire automatiquement les documents en anglais avant indexation"
        correct: 1
        explanation:
          "Les embeddings transforment textes et requêtes en vecteurs denses de
          sorte que la proximité géométrique reflète la proximité sémantique, ce
          qui rend possible le retrieval par similarité."
      - id: q4
        question:
          "Qu'est-ce qu'une base de données vectorielle dans le contexte d'un
          RAG ?"
        answers:
          - "Une base relationnelle classique stockant uniquement du texte brut"
          - "Un système de fichiers distribué pour les modèles de langage"
          - "Une base spécialisée dans le stockage et la recherche efficace de
            vecteurs de grande dimension"
          - "Un cache mémoire des dernières réponses générées par le LLM"
        correct: 2
        explanation:
          "Une base vectorielle (ex. FAISS, Qdrant, Pinecone, Chroma) indexe des
          vecteurs de haute dimension et permet de retrouver rapidement les plus
          proches voisins d'une requête."
      - id: q5
        question:
          "Pourquoi la similarité cosinus est-elle couramment utilisée pour la
          recherche sémantique sur des embeddings ?"
        answers:
          - "Elle mesure l'angle entre deux vecteurs et est insensible à leur
            norme, ce qui convient bien à la comparaison de directions
            sémantiques"
          - "Elle calcule la différence exacte de longueur entre deux chaînes de
            caractères"
          - "Elle compte le nombre de mots-clés communs entre deux documents"
          - "Elle garantit mathématiquement la pertinence factuelle des passages
            retrouvés"
        correct: 0
        explanation:
          "La similarité cosinus compare l'orientation de deux vecteurs
          indépendamment de leur magnitude, ce qui correspond bien à la notion
          de proximité sémantique entre embeddings."
      - id: q6
        question:
          "Dans un pipeline RAG, pourquoi le découpage (chunking) des documents
          en segments de taille adaptée est-il déterminant pour la qualité des
          réponses ?"
        answers:
          - "Il accélère uniquement l'entraînement du modèle de langage
            sous-jacent."
          - "Il conditionne la pertinence des passages récupérés et la cohérence
            du contexte fourni au LLM."
          - "Il supprime la nécessité d'utiliser une base vectorielle pour la
            recherche."
          - "Il garantit que le modèle n'hallucinera jamais, quel que soit le
            contenu indexé."
        correct: 1
        explanation:
          "Des chunks trop grands diluent l'information pertinente, des chunks
          trop petits perdent le contexte ; un découpage adapté améliore
          directement la précision du retrieval et la qualité de la génération."
      - id: q7
        question:
          "À quoi correspond le paramètre top-k dans la phase de retrieval d'un
          système RAG ?"
        answers:
          - "Au nombre de tokens maximum générés par le LLM dans sa réponse
            finale."
          - "Au nombre de passages les plus similaires à la requête qui sont
            sélectionnés et envoyés au modèle."
          - "Au seuil minimal de température utilisé lors de la génération."
          - "Au nombre de documents indexés dans la base vectorielle."
        correct: 1
        explanation:
          "Le top-k désigne les k passages les plus proches de la requête selon
          le score de similarité ; ils constituent le contexte transmis au LLM
          pour générer la réponse."
      - id: q8
        question:
          "Comment définit-on l'architecture RIG (Retrieval Interleaved
          Generation) ?"
        answers:
          - "Une approche où l'on récupère tous les documents avant de lancer
            une seule génération finale."
          - "Une approche où le modèle alterne, pendant la génération, des
            étapes de récupération et des étapes de production de texte."
          - "Une technique de fine-tuning supervisé du LLM sur la base de
            connaissances."
          - "Un protocole réseau dédié à l'indexation des bases vectorielles."
        correct: 1
        explanation:
          "Dans RIG, les phases de retrieval sont entrelacées avec la génération
          : le modèle peut déclencher de nouvelles recherches au fil du
          raisonnement plutôt qu'une seule fois en amont."
      - id: q9
        question: "Quelle est la différence clé entre RAG et RIG ?"
        answers:
          - "RAG utilise un LLM, alors que RIG s'en passe complètement."
          - "RAG effectue généralement une seule récupération en amont, tandis
            que RIG entrelace plusieurs récupérations avec la génération."
          - "RAG est destiné aux images, RIG est réservé au texte."
          - "RIG ne nécessite aucune base de connaissances, contrairement à RAG."
        correct: 1
        explanation:
          "La différence structurante est l'interleaving : RAG fait un retrieval
          puis une génération, alors que RIG enchaîne dynamiquement plusieurs
          cycles retrieval/génération."
      - id: q10
        question:
          "Parmi les forces souvent mises en avant pour l'architecture RAG,
          laquelle est correcte ?"
        answers:
          - "Elle impose un réentraînement complet du LLM à chaque mise à jour
            de la base."
          - "Elle est relativement simple à mettre en œuvre et permet
            d'exploiter des données fraîches sans réentraîner le modèle."
          - "Elle élimine totalement le besoin d'une base de connaissances
            externe."
          - "Elle garantit des temps de réponse inférieurs à ceux d'un appel
            direct au LLM seul."
        correct: 1
        explanation:
          "Un atout majeur de RAG est sa simplicité de mise en œuvre et la
          possibilité d'actualiser les connaissances en modifiant la base
          indexée, sans réentraîner le LLM."
      - id: q11
        question:
          "Quelle est une faiblesse caractéristique d'une architecture RAG
          classique ?"
        answers:
          - "Elle ne peut jamais citer ses sources documentaires"
          - "La qualité de la réponse dépend fortement du bruit et de la
            pertinence des passages récupérés"
          - "Elle nécessite obligatoirement un fine-tuning du modèle de langage"
          - "Elle ne peut fonctionner qu'avec des documents structurés en JSON"
        correct: 1
        explanation:
          "Un RAG est limité par la fenêtre de contexte du LLM et très sensible
          au bruit du retrieval : si les passages récupérés sont peu pertinents,
          la réponse se dégrade."
      - id: q12
        question:
          "Quelle force distingue une architecture RIG (Retrieval-Interleaved
          Generation) d'un RAG classique ?"
        answers:
          - "Elle supprime totalement le besoin d'une base de connaissances"
          - "Elle entrelace plusieurs étapes de récupération et de génération
            pour soutenir un raisonnement multi-étapes"
          - "Elle garantit une latence inférieure à celle d'un RAG en une seule
            passe"
          - "Elle remplace le LLM par un moteur de règles symboliques"
        correct: 1
        explanation:
          "Le RIG intercale récupération et génération à chaque étape du
          raisonnement, ce qui permet de traiter des questions complexes
          nécessitant plusieurs sauts d'information."
      - id: q13
        question:
          "Quelle est une faiblesse typique d'une architecture RIG par rapport à
          un RAG simple ?"
        answers:
          - "Elle ne peut pas accéder à des sources externes"
          - "Elle augmente la latence et la complexité opérationnelle à cause
            des appels itératifs au retriever et au LLM"
          - "Elle dégrade systématiquement la pertinence des réponses"
          - "Elle interdit l'usage de bases vectorielles"
        correct: 1
        explanation:
          "Le RIG enchaîne plusieurs cycles retrieval/generation, ce qui
          multiplie les appels coûteux, augmente la latence et rend
          l'orchestration plus complexe à maintenir."
      - id: q14
        question:
          "Quel cas d'usage est le plus naturellement adapté à une architecture
          RAG classique ?"
        answers:
          - "Une FAQ d'entreprise répondant à des questions factuelles à partir
            d'une base documentaire"
          - "La planification d'un itinéraire impliquant plusieurs réservations
            interdépendantes"
          - "La résolution d'énigmes mathématiques nécessitant un raisonnement
            en plusieurs étapes"
          - "Le pilotage temps réel d'un robot industriel"
        correct: 0
        explanation:
          "Un RAG est idéal pour répondre à des questions factuelles bien
          ciblées en s'appuyant sur une base documentaire interne, comme une FAQ
          ou un assistant de support."
      - id: q15
        question:
          "Quel cas d'usage justifie particulièrement le recours à une
          architecture RIG plutôt qu'à un RAG simple ?"
        answers:
          - "Retrouver la définition d'un terme dans un glossaire"
          - "Afficher le contenu brut d'un document PDF"
          - "Répondre à une question complexe nécessitant un raisonnement
            multi-étapes avec récupérations successives d'informations"
          - "Compter le nombre de mots d'un texte fourni en entrée"
        correct: 2
        explanation:
          "Le RIG brille sur les questions multi-sauts où chaque étape du
          raisonnement requiert de nouvelles recherches ciblées, par exemple
          croiser plusieurs sources pour bâtir une réponse argumentée."
      - id: q16
        question:
          "Quel est le rôle principal d'une base de connaissances dans une
          architecture RAG ?"
        answers:
          - "Stocker les documents et leurs représentations vectorielles afin de
            fournir un contexte pertinent au LLM lors de la génération"
          - "Remplacer le LLM en générant directement les réponses à partir des
            documents bruts"
          - "Servir uniquement à journaliser les requêtes des utilisateurs pour
            audit"
          - "Entraîner le modèle de langage en mettant à jour ses poids à chaque
            requête"
        correct: 0
        explanation:
          "La base de connaissances (souvent un vector store) indexe les
          documents et leurs embeddings pour permettre au composant retrieval de
          fournir au LLM un contexte factuel pertinent."
      - id: q17
        question:
          "Quelle est la différence fondamentale entre le fine-tuning et le RAG
          ?"
        answers:
          - "Le fine-tuning modifie les poids du modèle, tandis que le RAG
            laisse le modèle inchangé et lui fournit un contexte externe au
            moment de l'inférence"
          - "Le fine-tuning et le RAG produisent exactement le même résultat,
            seul le coût diffère"
          - "Le RAG modifie les poids du modèle alors que le fine-tuning se
            contente d'ajouter un prompt système"
          - "Le fine-tuning ne fonctionne que sur des modèles open source,
            contrairement au RAG"
        correct: 0
        explanation:
          "Le fine-tuning ajuste les paramètres internes du modèle sur un
          corpus, alors que le RAG conserve le modèle figé et injecte des
          documents récupérés dynamiquement dans le prompt."
      - id: q18
        question: "À quoi sert l'étape de re-ranking dans un pipeline RAG ?"
        answers:
          - "Réordonner les documents récupérés selon leur pertinence réelle,
            généralement avec un modèle plus précis qu'au premier retrieval"
          - "Compresser les embeddings pour réduire la taille de la base
            vectorielle"
          - "Traduire automatiquement les documents dans la langue de la requête"
          - "Supprimer définitivement les documents jugés non pertinents de la
            base de connaissances"
        correct: 0
        explanation:
          "Le re-ranking affine le classement des candidats issus du premier
          retrieval, souvent via un cross-encoder, afin de placer en tête les
          documents les plus pertinents pour la requête."
      - id: q19
        question: "Que désigne la notion de hybrid search dans un système RAG ?"
        answers:
          - "La combinaison d'une recherche lexicale (type BM25) et d'une
            recherche sémantique (par embeddings) pour améliorer le rappel"
          - "L'utilisation simultanée de plusieurs LLM pour générer la réponse
            finale"
          - "Le mélange entre recherche locale sur disque et recherche distante
            via API"
          - "L'alternance aléatoire entre une recherche par mots-clés et une
            recherche full-text"
        correct: 0
        explanation:
          "La hybrid search fusionne les scores d'une recherche lexicale
          (mots-clés exacts, BM25) et d'une recherche sémantique (vecteurs),
          tirant parti des forces complémentaires des deux approches."
      - id: q20
        question:
          "Parmi les métriques suivantes, laquelle évalue la fidélité
          (faithfulness) d'un RAG ?"
        answers:
          - "La mesure de l'ancrage de la réponse générée dans les documents
            récupérés, sans hallucination"
          - "Le temps de réponse moyen du pipeline en millisecondes"
          - "La taille en tokens du contexte injecté dans le LLM"
          - "Le coût d'appel API du modèle de génération"
        correct: 0
        explanation:
          "La faithfulness évalue dans quelle mesure la réponse générée s'appuie
          fidèlement sur le contexte récupéré, par opposition au recall et à la
          precision qui mesurent la qualité du retrieval."
  - id: graphrag-structrag
    title: "Exploration des architectures GraphRAG et StructRAG"
    questions:
      - id: q1
        question: "Qu'est-ce que GraphRAG ?"

        correct: 1
        explanation:
          "Mocker le LLM et les outils rend les tests déterministes, rapides et
          reproductibles, ce qui est indispensable pour valider l'orchestration."
      - id: q19
        question:
          "Quel mode de déploiement est le plus adapté pour un agent intelligent
          à charge très variable et à exécutions courtes ?"
        answers:
          - "Une fonction serverless exposée derrière une API HTTP"
          - "Un script lancé manuellement sur le poste du développeur"
          - "Un démon installé sur un poste utilisateur sans supervision"
          - "Un cron exécutant l'agent toutes les minutes quoi qu'il arrive"
        correct: 0
        explanation:
          "Le serverless s'adapte automatiquement à la charge et facture à

title: "QCM React moderne : développer une application Web progressive"
chapters:
  - id: react-vite
    title: "Chapitre 1 — Démarrer avec React et Vite"
    questions:
      - id: q1
        question:
          "Quel est le rôle principal de React dans une application front-end
          moderne ?"
        answers:
          - "Structurer l'interface en composants réutilisables et mettre à jour
            la vue selon l'état"
          - "Remplacer le navigateur pour exécuter le code côté client"
          - "Héberger automatiquement l'application sur un serveur distant"
          - "Compiler le CSS en images optimisées"
        correct: 0
        explanation:
          "React sert à construire l'interface utilisateur à partir de
          composants. Il met à jour l'affichage quand l'état de l'application
          change."
      - id: q2
        question: "Dans React, qu'est-ce qu'un composant ?"
        answers:
          - "Un serveur local utilisé pour afficher l'application pendant le
            développement"
          - "Une fonction ou une unité d'interface qui décrit une partie de la
            vue à afficher"
          - "Un fichier de configuration obligatoire pour installer les
            dépendances"
          - "Un navigateur intégré à Vite pour tester les pages"
        correct: 1
        explanation:
          "Un composant React décrit une portion d'interface. Il peut recevoir
          des données et être composé avec d'autres composants."
      - id: q3
        question:
          "Quelle différence caractérise le mieux une SPA par rapport à un site
          multipage ?"
        answers:
          - "Une SPA recharge entièrement le navigateur à chaque clic,
            contrairement à un site multipage"
          - "Une SPA fonctionne sans JavaScript, contrairement à un site
            multipage"
          - "Une SPA met à jour l'interface sans recharger toute la page à
            chaque navigation interne"
          - "Une SPA impose l'utilisation d'un serveur Node.js en production"
        correct: 2
        explanation:
          "Dans une SPA, la navigation interne met à jour l'interface côté
          client sans rechargement complet de la page. Un site multipage
          déclenche en général un nouveau chargement du document à chaque page."
      - id: q4
        question:
          "Pourquoi Node.js est-il utile pour lancer un projet Vite en
          développement ?"
        answers:
          - "Parce qu'il remplace React pour afficher les composants dans le
            navigateur"
          - "Parce qu'il fournit l'environnement d'exécution permettant
            d'utiliser Vite et ses outils de développement"
          - "Parce qu'il transforme automatiquement une SPA en application
            mobile native"
          - "Parce qu'il stocke les composants dans la mémoire du navigateur"
        correct: 1
        explanation:
          "Vite s'exécute avec Node.js pendant le développement. Node.js permet
          de lancer le serveur de développement et les outils associés."
      - id: q5
        question: "Quel est le rôle principal de npm dans un projet React ?"
        answers:
          - "Dessiner les composants JSX directement dans le navigateur"
          - "Créer automatiquement la charte graphique de l'application"
          - "Gérer les paquets du projet et exécuter les scripts définis pour le
            développement ou le build"
          - "Remplacer Vite pour afficher les pages HTML finales"
        correct: 2
        explanation:
          "npm sert à installer et mettre à jour les dépendances du projet. Il
          permet aussi d'exécuter les scripts de développement, de test ou de
          build."
      - id: q6
        question:
          "Quelle commande correspond à la création officielle d'un projet React
          avec Vite dans le chapitre ?"
        answers:
          - "npm create vite@latest"
          - "npm init react-app"
          - "vite create react-app"
          - "npx react-vite new"
        correct: 0
        explanation:
          'La commande officielle présentée est "npm create vite@latest". Elle
          lance le générateur de projet Vite avec le choix du framework et du
          template.'
      - id: q7
        question:
          "À quoi sert principalement le dossier src dans un projet généré par
          Vite ?"
        answers:
          - "À stocker les dépendances téléchargées depuis npm"
          - "À contenir le code source de l'application, comme les composants et
            la logique front-end"
          - "À héberger les fichiers de configuration système de Node.js"
          - "À enregistrer les builds de production prêts à être déployés"
        correct: 1
        explanation:
          "Le dossier src regroupe le code source de l'application. On y place
          notamment les composants React, les styles et la logique de
          l'interface."
      - id: q8
        question:
          "Quel est le rôle principal du fichier package.json dans un projet
          React créé avec Vite ?"
        answers:
          - "Décrire les dépendances et les scripts du projet"
          - "Compiler automatiquement le JSX en JavaScript"
          - "Afficher la page d'accueil dans le navigateur"
          - "Stocker les composants React réutilisables"
        correct: 0
        explanation:
          "Le fichier package.json centralise les dépendances, les métadonnées
          et les scripts du projet. Il sert notamment à lancer le développement
          ou le build."
      - id: q9
        question:
          "Comment le JSX est-il compris par l'application alors que le
          navigateur ne le lit pas directement ?"
        answers:
          - "Le navigateur exécute nativement le JSX sans transformation"
          - "Node.js convertit le JSX au moment de l'affichage dans le DOM"
          - "L'outil de build transforme le JSX en JavaScript exploitable"
          - "Le fichier package.json traduit le JSX en HTML final"
        correct: 2
        explanation:
          "Le JSX est transformé par l'outil de build en JavaScript
          compréhensible par l'environnement d'exécution. Le navigateur ne lit
          pas directement la syntaxe JSX."
      - id: q10
        question:
          "Quelle différence décrit correctement le rapport entre JSX et HTML ?"
        answers:
          - "JSX est strictement identique à HTML, sans aucune règle propre à
            JavaScript"
          - "JSX est un format de base de données, alors que HTML décrit une
            page Web"
          - "HTML sert uniquement au style, alors que JSX sert uniquement aux
            requêtes réseau"
          - "JSX ressemble à HTML, mais c'est une syntaxe écrite dans JavaScript
            pour décrire l'interface"
        correct: 3
        explanation:
          "JSX reprend une apparence proche de HTML, mais il s'intègre dans du
          JavaScript. Il permet de décrire l'UI de manière déclarative dans les
          composants React."
      - id: q11
        question:
          "Pourquoi un composant React retourne-t-il une interface décrite en
          JSX ?"
        answers:
          - "Parce qu'un composant a pour rôle de décrire ce qui doit être
            affiché à l'écran."
          - "Parce qu'il doit toujours créer une requête HTTP avant le rendu."
          - "Parce qu'il sert uniquement à stocker des fichiers statiques."
          - "Parce qu'il remplace automatiquement le navigateur."
        correct: 0
        explanation:
          "Un composant React décrit l'interface à afficher. Le JSX exprime
          cette structure de manière lisible et proche du HTML."
      - id: q12
        question:
          "Dans React, à quoi sert un usage simple des props entre un composant
          parent et un composant enfant ?"
        answers:
          - "À transmettre des données du composant enfant vers le parent sans
            code supplémentaire."
          - "À partager des informations du parent vers l'enfant pour
            personnaliser son affichage."
          - "À transformer automatiquement un composant en page distincte."
          - "À empêcher tout rerendu de l'interface."
        correct: 1
        explanation:
          "Les props permettent au parent de fournir des données ou des valeurs
          de configuration à l'enfant. L'enfant adapte ainsi son rendu selon ce
          qui lui est transmis."
      - id: q13
        question:
          "Quel est l'effet principal de la composition de composants dans une
          application React ?"
        answers:
          - "Elle oblige tous les composants à partager le même état global."
          - "Elle permet d'assembler des briques réutilisables pour construire
            une interface plus complexe."
          - "Elle supprime le besoin d'écrire du JSX."
          - "Elle convertit automatiquement une SPA en application serveur."
        correct: 1
        explanation:
          "La composition consiste à imbriquer des composants pour construire
          l'interface par assemblage. Cela favorise la réutilisation et une
          structure plus modulaire."
      - id: q14
        question:
          "Que signifie le modèle mental selon lequel l'interface dépend de
          l'état en React ?"
        answers:
          - "L'interface affichée découle des données actuelles détenues par le
            composant."
          - "L'état ne sert qu'à styliser les composants avec du CSS."
          - "L'interface doit être redessinée manuellement après chaque clic."
          - "Le composant choisit son état uniquement à partir de l'URL."
        correct: 0
        explanation:
          "En React, l'interface visible est déterminée par la valeur actuelle
          de l'état. Si l'état change, le rendu calculé change lui aussi."
      - id: q15
        question:
          "Quel lien existe entre l'état d'un composant React et le rendu
          affiché à l'écran ?"
        answers:
          - "Le rendu reste figé même si l'état change."
          - "L'état n'a d'effet que lors du premier chargement de la page."
          - "Une modification de l'état provoque la mise à jour de l'affichage
            concerné."
          - "Le rendu dépend uniquement du nom du composant."
        correct: 2
        explanation:
          "Quand l'état change, React recalcule le rendu du composant concerné.
          L'affichage reflète alors la nouvelle valeur de cet état."
      - id: q16
        question:
          "Dans le premier écran de TaskFlow, quel découpage de composants est
          le plus pertinent pour afficher un en-tête, un formulaire d'ajout et
          une liste de tâches ?"
        answers:
          - "Créer un composant racine qui compose Header, TaskForm et TaskList"
          - "Mettre toute l'interface dans un seul fichier JSX sans
            sous-composants"
          - "Créer un composant TaskItem unique qui rend aussi le formulaire et
            l'en-tête"
          - "Séparer uniquement le CSS et laisser toute la structure dans
            main.tsx"
        correct: 0
        explanation:
          "Un premier découpage efficace isole les zones fonctionnelles
          principales en composants dédiés. Cela rend TaskFlow plus lisible et
          plus simple à faire évoluer."
      - id: q17
        question:
          "Dans TaskFlow, où placer en priorité un état utilisé à la fois par le
          formulaire d'ajout et par la liste des tâches ?"
        answers:
          - "Dans le composant enfant le plus visuel, même s'il ne partage rien"
          - "Dans le composant parent commun aux deux enfants"
          - "Dans chaque enfant avec deux états séparés"
          - "Directement dans index.html pour qu'il soit global"
        correct: 1
        explanation:
          "Quand plusieurs composants enfants dépendent du même état, on le
          place dans leur parent commun. Ce choix facilite le partage des
          données via les props."
      - id: q18
        question:
          "Quel bénéfice concret Vite apporte-t-il au démarrage d'un projet
          React ?"
        answers:
          - "Il remplace React par un moteur de templates statiques"
          - "Il supprime le besoin d'écrire du JSX"
          - "Il fournit un lancement de serveur de développement très rapide"
          - "Il impose une architecture monolithique côté front-end"
        correct: 2
        explanation:
          "Vite est conçu pour offrir un démarrage quasi immédiat du serveur de
          développement. Cela améliore fortement la boucle de feedback au début
          du projet React."
      - id: q19
        question:
          "Quelle erreur d'écriture JSX provoque fréquemment un problème dès les
          premiers composants React ?"
        answers:
          - "Retourner plusieurs éléments adjacents sans les envelopper"
          - "Utiliser des props pour transmettre une valeur"
          - "Écrire le nom du composant avec une majuscule"
          - "Mettre une expression JavaScript entre accolades"
        correct: 0
        explanation:
          "Un composant JSX doit retourner un seul parent logique, ou un
          fragment. Plusieurs éléments adjacents non enveloppés déclenchent une
          erreur courante."
      - id: q20
        question:
          "Quelle bonne pratique aide à organiser les premiers composants d'une
          application React comme TaskFlow ?"
        answers:
          - "Placer tous les composants dans un seul fichier pour aller plus
            vite"
          - "Nommer les composants de manière explicite et regrouper les
            réutilisables dans un dossier components"
          - "Créer un dossier par ligne JSX afin de séparer finement le rendu"
          - "Éviter toute composition avant d'avoir vingt composants"
        correct: 1
        explanation:
          "Des noms explicites et un rangement simple des composants
          réutilisables rendent la base plus claire. Cette organisation aide dès
          les premiers écrans sans complexifier le projet."
  - id: interface-reactive
    title: "Chapitre 2 — Construire une interface interactive React"
    questions:
      - id: q1
        question:
          "Quel est le rôle principal de useState dans un composant React ?"
        answers:
          - "Mémoriser une valeur réactive et fournir une fonction pour la
            mettre à jour"
          - "Déclarer une variable globale partagée entre tous les composants"
          - "Empêcher définitivement le composant de se re-render"
          - "Créer automatiquement un effet secondaire après chaque clic"
        correct: 0
        explanation:
          "useState permet de stocker une donnée dans l'état local du composant
          et de la modifier via un setter. Cette mise à jour informe React qu'un
          nouveau rendu peut être nécessaire."
      - id: q2
        question:
          "Pourquoi une variable locale classique ne remplace-t-elle pas un
          state React pour piloter l'affichage ?"
        answers:
          - "Parce qu'une variable locale est forcément asynchrone alors que le
            state est synchrone"
          - "Parce qu'une variable locale ne déclenche pas de nouveau rendu
            lorsqu'elle change"
          - "Parce qu'une variable locale ne peut contenir que du texte"
          - "Parce qu'une variable locale est automatiquement réinitialisée par
            le navigateur toutes les secondes"
        correct: 1
        explanation:
          "Une variable locale peut changer en JavaScript sans que React en soit
          informé. Le state, lui, est suivi par React pour recalculer
          l'interface quand il évolue."
      - id: q3
        question:
          "Que se passe-t-il lorsqu'on appelle la fonction de mise à jour
          renvoyée par useState, comme setCount ?"
        answers:
          - "React recharge toute la page dans le navigateur"
          - "Le DOM est effacé puis reconstruit manuellement par le développeur"
          - "React planifie un nouveau rendu du composant avec la nouvelle
            valeur d'état"
          - "La valeur change seulement dans la console sans effet sur
            l'interface"
        correct: 2
        explanation:
          "Après un setState, React re-exécute le composant concerné pour
          produire un nouvel arbre d'interface. Il met ensuite à jour le DOM
          uniquement là où c'est utile."
      - id: q4
        question:
          "Quelle écriture correspond à la gestion correcte d'un clic sur un
          bouton en React ?"
        answers:
          - '<button onclick="handleClick()">Valider</button>'
          - "<button onClick={handleClick}>Valider</button>"
          - "<button click={handleClick}>Valider</button>"
          - "<button on-click={handleClick}>Valider</button>"
        correct: 1
        explanation:
          "En React, les événements utilisent une syntaxe camelCase comme
          onClick. On transmet une fonction JavaScript, que React appellera lors
          du clic."
      - id: q5
        question:
          "Dans un découpage en composants, pourquoi passe-t-on souvent une
          action du parent vers l'enfant sous forme de callback ?"
        answers:
          - "Pour que l'enfant puisse demander au parent d'exécuter une logique
            au bon moment"
          - "Pour obliger l'enfant à recréer tout le state du parent"
          - "Pour remplacer définitivement les props par des variables globales"
          - "Pour empêcher toute remontée d'information depuis l'enfant"
        correct: 0
        explanation:
          "Le callback permet à l'enfant de signaler une intention, par exemple
          supprimer une tâche, sans posséder lui-même la logique métier. Le
          parent garde ainsi le contrôle du state et des actions."
      - id: q6
        question:
          "Dans React, quel rendu convient pour afficher un message uniquement
          si `isLoggedIn` vaut true ?"
        answers:
          - "Utiliser une condition comme `{isLoggedIn && <p>Bienvenue</p>}`
            dans le JSX"
          - "Déclarer une variable classique `let isLoggedIn = true` sans state
            ni props"
          - "Ajouter le message directement dans `useEffect` pour qu'il
            s'affiche dans le DOM"
          - "Remplacer le composant par une boucle `for` qui teste la valeur
            booléenne"
        correct: 0
        explanation:
          "Le rendu conditionnel en React consiste à inclure ou non un fragment
          JSX selon une expression booléenne. L'opérateur `&&` est une forme
          courante pour afficher un élément seulement quand la condition est
          vraie."
      - id: q7
        question:
          "Quelle approche est correcte pour afficher une liste de tâches
          stockée dans un tableau React ?"
        answers:
          - "Utiliser `tasks.render()` pour transformer automatiquement le
            tableau en JSX"
          - "Utiliser `tasks.map(task => <li>{task.title}</li>)` pour produire
            un élément par tâche"
          - "Utiliser `tasks.filter()` pour afficher toutes les tâches sans
            transformation"
          - "Utiliser `tasks.push(<li>{task.title}</li>)` directement dans le
            JSX"
        correct: 1
        explanation:
          "La méthode `map` transforme chaque élément du tableau en un élément
          JSX. C'est le mécanisme standard pour rendre une liste en React."
      - id: q8
        question:
          "À quoi sert principalement la prop `key` lorsqu'on rend une liste en
          React ?"
        answers:
          - "À styliser chaque élément de la liste avec une classe CSS unique"
          - "À indiquer à React quel élément doit être masqué par défaut"
          - "À aider React à identifier chaque élément entre deux rendus pour
            mettre à jour la liste correctement"
          - "À permettre à `map` de renvoyer plusieurs types de données dans le
            même tableau"
        correct: 2
        explanation:
          "La prop `key` permet à React de suivre l'identité logique des
          éléments d'une liste. Cela améliore la réconciliation et évite des
          mises à jour incohérentes."
      - id: q9
        question:
          "Pourquoi l'utilisation de l'index du tableau comme `key` peut-elle
          poser problème dans une liste modifiable ?"
        answers:
          - "Parce que React interdit totalement les nombres comme `key`"
          - "Parce que les index empêchent l'utilisation de `onClick` sur les
            éléments"
          - "Parce que l'index augmente systématiquement le temps de chargement
            initial de la page"
          - "Parce qu'en cas d'ajout, suppression ou réorganisation, React peut
            associer un mauvais état au mauvais élément"
        correct: 3
        explanation:
          "Si l'ordre de la liste change, l'index ne représente plus l'identité
          réelle de l'élément. React risque alors de réutiliser un état ou un
          rendu sur le mauvais item."
      - id: q10
        question:
          "Quel énoncé décrit correctement un champ contrôlé dans un formulaire
          React ?"
        answers:
          - "C'est un champ dont la valeur affichée provient du state React et
            est mise à jour via `onChange`"
          - "C'est un champ qui ne peut être modifié qu'avec `useRef` et jamais
            avec `useState`"
          - "C'est un champ HTML dont React lit la valeur uniquement au moment
            du `onSubmit`"
          - "C'est un champ dont la valeur est gérée exclusivement par le
            navigateur sans intervention de React"
        correct: 0
        explanation:
          "Dans un champ contrôlé, React pilote la valeur via une prop `value`
          liée au state. L'événement `onChange` met ce state à jour à chaque
          saisie."
      - id: q11
        question:
          "Dans un champ contrôlé React, quel est le rôle combiné de `value` et
          de `onChange` ?"
        answers:
          - "`value` affiche la valeur issue du state et `onChange` met ce state
            à jour quand l'utilisateur saisit du texte"
          - "`value` déclenche la soumission du formulaire et `onChange`
            recharge le composant"
          - "`value` sert uniquement de placeholder et `onChange` modifie
            directement le DOM sans state"
          - "`value` bloque toute saisie et `onChange` sert seulement à valider
            le formulaire à la fin"
        correct: 0
        explanation:
          "Dans un composant contrôlé, React fournit la valeur affichée via
          `value`. L'événement `onChange` récupère la saisie pour mettre à jour
          le state et garder l'interface synchronisée."
      - id: q12
        question:
          "Quelle est la fonction principale de `onSubmit` sur un formulaire
          React ?"
        answers:
          - "Changer automatiquement la valeur de tous les champs du formulaire"
          - "Traiter l'envoi du formulaire au moment de la soumission, par
            exemple pour exécuter une action métier"
          - "Créer un nouveau champ de saisie après chaque frappe utilisateur"
          - "Remplacer `onChange` pour suivre caractère par caractère le contenu
            d'un input"
        correct: 1
        explanation:
          "`onSubmit` centralise la logique déclenchée lors de la soumission du
          formulaire. En React, on l'utilise souvent avec
          `event.preventDefault()` pour gérer l'action sans rechargement de
          page."
      - id: q13
        question:
          "Quelle validation simple est pertinente avant d'ajouter une nouvelle
          tâche dans TaskFlow ?"
        answers:
          - "Ajouter la tâche même si le champ contient seulement des espaces"
          - "Vérifier que le texte saisi n'est pas vide après suppression des
            espaces inutiles"
          - "Refuser toute tâche contenant plus de trois mots"
          - "Imposer que chaque tâche commence par une majuscule et se termine
            par un point"
        correct: 1
        explanation:
          "Une validation simple consiste à empêcher l'ajout d'une tâche vide ou
          composée uniquement d'espaces. Cela évite de polluer la liste avec des
          entrées sans contenu utile."
      - id: q14
        question:
          "Comment représenter simplement dans React le statut terminée ou non
          terminée d'une tâche ?"
        answers:
          - "Avec une propriété booléenne comme `completed` stockée pour chaque
            tâche"
          - "Avec une couleur CSS stockée comme seule source de vérité"
          - "Avec une variable locale non persistée recréée à chaque rendu sans
            state"
          - "Avec un compteur global qui remplace la donnée de chaque tâche"
        correct: 0
        explanation:
          "Un booléen comme `completed` décrit directement l'état métier de la
          tâche. Il est facile à lire, à modifier et à utiliser pour l'affichage
          ou les actions de bascule."
      - id: q15
        question:
          "Quelle mise en place permet d'ajouter un filtre de tâches dans une
          interface React ?"
        answers:
          - "Créer un state de filtre, puis afficher les tâches en appliquant ce
            critère avant le rendu"
          - "Dupliquer la liste complète dans trois composants sans partager de
            state"
          - "Supprimer définitivement du tableau toutes les tâches qui ne
            correspondent pas au filtre sélectionné"
          - "Utiliser uniquement du CSS pour masquer la logique de filtrage sans
            condition JavaScript"
        correct: 0
        explanation:
          "Le plus simple est de stocker le filtre courant dans le state puis de
          calculer la liste visible selon ce critère. On conserve ainsi toutes
          les tâches tout en adaptant l'affichage."
      - id: q16
        question:
          "Dans TaskFlow, quelle approche permet d'afficher un compteur fiable
          du nombre de tâches terminées sans dupliquer inutilement les données ?"
        answers:
          - "Calculer le nombre à partir de la liste des tâches à chaque rendu
            avec un filtrage adapté"
          - "Stocker un second tableau contenant uniquement les tâches terminées
            et l'afficher directement"
          - "Ajouter une variable locale modifiée à chaque clic sans utiliser le
            state"
          - "Enregistrer manuellement le compteur dans le DOM après chaque
            changement"
        correct: 0
        explanation:
          "Un compteur dérivé doit être recalculé à partir de la source de
          vérité, ici la liste des tâches. Cela évite les incohérences entre
          plusieurs états redondants."
      - id: q17
        question:
          "Pour supprimer une tâche du state dans une application React, quelle

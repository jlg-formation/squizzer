title: "L'intelligence artificielle au service des développeurs"
chapters:
  - id: introduction-ia
    title: "Introduction à l'intelligence artificielle"
    questions:
      - id: q1
        question:
          "Quelle est la relation entre l'intelligence artificielle, le machine
          learning et le deep learning ?"
        answers:
          [
            Ce sont trois domaines indépendants sans lien entre eux,
            Le deep learning englobe le machine learning qui englobe l'IA,
            Le machine learning est un sous-domaine de l'IA et le deep learning
            un sous-domaine du machine learning,
            Le machine learning et le deep learning sont des synonymes opposés à
            l'IA,
          ]
        correct: 2
        explanation:
          "L'IA est le domaine global ; le machine learning en est un
          sous-ensemble fondé sur l'apprentissage à partir de données, et le
          deep learning est lui-même un sous-ensemble du machine learning
          utilisant des réseaux de neurones profonds."
      - id: q2
        question:
          "Qu'est-ce qui distingue l'approche symbolique de l'approche
          statistique en IA ?"
        answers:
          [
            "L'approche symbolique repose sur des règles et de la logique
            explicites, tandis que l'approche statistique apprend des motifs à
            partir de données",
            Les deux approches utilisent uniquement des réseaux de neurones,
            L'approche symbolique est plus récente que l'approche statistique,
            L'approche statistique n'utilise jamais de mathématiques,
          ]
        correct: 0
        explanation:
          "L'IA symbolique manipule des symboles et des règles logiques définies
          par des humains, alors que l'IA statistique infère des modèles à
          partir de grands volumes de données."
      - id: q3
        question: "Que désigne un Large Language Model (LLM) ?"
        answers:
          [
            Un logiciel de traduction automatique basé sur des dictionnaires,
            Un modèle statistique de langage entraîné sur de très grands corpus
            de texte capable de générer du langage naturel,
            Une base de données relationnelle stockant des phrases,
            Un format de fichier audio pour la reconnaissance vocale,
          ]
        correct: 1
        explanation:
          "Un LLM est un modèle de langage de grande taille, entraîné sur
          d'énormes corpus textuels, capable de comprendre et de générer du
          texte en langage naturel."
      - id: q4
        question:
          "À quoi servent les text embeddings dans le traitement du langage
          naturel ?"
        answers:
          [
            À compresser les fichiers texte pour le stockage,
            À chiffrer les messages échangés entre utilisateurs,
            À représenter du texte sous forme de vecteurs numériques capturant
            le sens sémantique,
            À traduire automatiquement un texte d'une langue à une autre,
          ]
        correct: 2
        explanation:
          "Les embeddings transforment des mots ou phrases en vecteurs
          numériques dans un espace où la proximité reflète la similarité
          sémantique, ce qui facilite la recherche, le clustering et l'analyse."
      - id: q5
        question:
          "Quel est le rôle principal d'une Vector Database dans une
          architecture IA ?"
        answers:
          [
            Stocker des images au format binaire,
            Indexer et rechercher efficacement des vecteurs d'embeddings par
            similarité,
            Exécuter des modèles de deep learning sur GPU,
            Convertir des fichiers GGUF en JSON,
          ]
        correct: 1
        explanation:
          "Une base de données vectorielle est conçue pour stocker des
          embeddings et effectuer des recherches de similarité (par ex. cosinus)
          très rapides, ce qui est essentiel pour les systèmes RAG et la
          recherche sémantique."
      - id: q6
        question: "Qu'est-ce qu'un token dans le contexte d'un LLM ?"
        answers:
          [
            Une unité de texte (mot ou fragment de mot) traitée par le modèle,
            Un identifiant de session utilisateur,
            Une clé d'authentification de l'API,
            Un paramètre du réseau de neurones,
          ]
        correct: 0
        explanation:
          "Un token est l'unité élémentaire (mot, sous-mot ou caractère) que le
          LLM manipule en entrée et en sortie."
      - id: q7
        question:
          "À quoi sert principalement une base de données vectorielle (Vector
          Database) ?"
        answers:
          [
            Stocker des fichiers binaires volumineux,
            Indexer et rechercher des embeddings par similarité sémantique,
            Remplacer une base SQL relationnelle classique,
            Compresser les modèles de langage,
          ]
        correct: 1
        explanation:
          "Une Vector Database stocke des vecteurs (embeddings) et permet la
          recherche par similarité, base du RAG."
      - id: q8
        question: "Que désigne le format GGUF ?"
        answers:
          [
            Un protocole de communication entre agents IA,
            Un format de fichier unifié pour distribuer des modèles de LLM
            exécutables localement,
            Un langage de prompt structuré,
            Une API standardisée de chat,
          ]
        correct: 1
        explanation:
          "GGUF (GPT-Generated Unified Format) est un format de fichier conçu
          pour stocker et charger efficacement des modèles LLM en local."
      - id: q9
        question:
          "Quel outil d'IA générative est proposé en mode SaaS par OpenAI ?"
        answers: [ChatGPT, Llama, Mistral 7B, Stable Diffusion local]
        correct: 0
        explanation:
          "ChatGPT est le service SaaS d'OpenAI ; Llama et Mistral sont des
          modèles ouverts souvent exécutés en local."
      - id: q10
        question: "Que vise le prompt engineering ?"
        answers:
          [
            Optimiser le code source du modèle,
            Concevoir des instructions efficaces pour obtenir de meilleures
            réponses du LLM,
            Réduire le nombre de paramètres du modèle,
            Chiffrer les échanges avec l'API,
          ]
        correct: 1
        explanation:
          "Le prompt engineering consiste à formuler les requêtes de manière à
          maximiser la pertinence des réponses générées."
      - id: q11
        question: "Que désigne le terme « token » dans le contexte d'un LLM ?"
        answers:
          [
            Une unité élémentaire de texte traitée par le modèle,
            Un identifiant de session utilisateur,
            Une clé d'API permettant d'appeler le modèle,
            Un vecteur stocké dans une base vectorielle,
          ]
        correct: 0
        explanation:
          "Un token est l'unité de base (mot, sous-mot ou caractère) que le
          modèle manipule en entrée et en sortie."
      - id: q12
        question:
          "À quoi sert principalement une base vectorielle (vector database)
          dans une architecture IA ?"
        answers:
          [
            Stocker des embeddings pour effectuer des recherches par similarité
            sémantique,
            Héberger les poids d'un modèle de langage,
            Conserver l'historique des conversations utilisateur,
            Compiler le code source des applications IA,
          ]
        correct: 0
        explanation:
          "Une base vectorielle indexe des embeddings afin de retrouver
          rapidement les contenus sémantiquement proches d'une requête."
      - id: q13
        question: "Que représente le format GGUF ?"
        answers:
          [
            Un format de fichier unifié pour distribuer et exécuter des modèles
            de langage localement,
            Un protocole réseau pour interroger des LLM en SaaS,
            Un langage de requête pour bases vectorielles,
            Une norme de compression vidéo générée par IA,
          ]
        correct: 0
        explanation:
          "GGUF (GPT-Generated Unified Format) est un format conçu pour stocker
          et charger efficacement des modèles, notamment pour l'inférence
          locale."
      - id: q14
        question: "Quelle approche caractérise le « prompt engineering » ?"
        answers:
          [
            Concevoir et affiner les instructions envoyées à un LLM pour obtenir
            de meilleures réponses,
            Réentraîner un modèle sur de nouvelles données,
            Optimiser le code source du moteur d'inférence,
            Compresser les poids du modèle pour réduire sa taille,
          ]
        correct: 0
        explanation:
          "Le prompt engineering consiste à formuler les requêtes de manière à
          orienter le modèle vers des réponses plus pertinentes, sans modifier
          ses poids."
      - id: q15
        question: "Quel est le rôle des « text embeddings » ?"
        answers:
          [
            Représenter du texte sous forme de vecteurs numériques capturant son
            sens,
            Chiffrer le texte avant son envoi au modèle,
            Traduire automatiquement un texte d'une langue à une autre,
            Compresser le texte pour réduire le nombre de tokens facturés,
          ]
        correct: 0
        explanation:
          "Les embeddings projettent un texte dans un espace vectoriel où la
          proximité géométrique reflète la similarité sémantique."
      - id: q16
        question:
          "Qu'est-ce qu'une base de données vectorielle (vector database) ?"
        answers:
          [
            Une base relationnelle optimisée pour les jointures,
            Une base stockant des embeddings et permettant la recherche par
            similarité,
            Un cache mémoire pour les requêtes SQL,
            Un système de fichiers distribué pour les modèles GGUF,
          ]
        correct: 1
        explanation:
          "Une vector database stocke des vecteurs (embeddings) et permet de
          retrouver les contenus les plus proches sémantiquement via une
          recherche de similarité."
      - id: q17
        question: "À quoi sert principalement le format GGUF ?"
        answers:
          [
            Échanger des prompts entre applications,
            Stocker et distribuer des modèles LLM quantifiés exécutables
            localement,
            Représenter des graphes de connaissances,
            Sérialiser des bases vectorielles,
          ]
        correct: 1
        explanation:
          "GGUF (GPT-Generated Unified Format) est un format de fichier conçu
          pour distribuer des modèles LLM, souvent quantifiés, et les exécuter
          en local efficacement."
      - id: q18
        question:
          "Parmi ces outils, lequel est un service d'IA générative en mode SaaS
          ?"
        answers: [PostgreSQL, ChatGPT, Nginx, Docker]
        correct: 1
        explanation:
          "ChatGPT est un service d'IA générative accessible en SaaS via le web
          ou une API, contrairement aux autres outils cités."
      - id: q19
        question: "Que désigne le prompt engineering ?"
        answers:
          [
            La conception matérielle des GPU pour l'IA,
            L'art de formuler des requêtes pour obtenir des réponses pertinentes
            d'un LLM,
            L'entraînement initial d'un modèle de langage,
            La compression des modèles au format GGUF,
          ]
        correct: 1
        explanation:
          "Le prompt engineering consiste à formuler et structurer les requêtes
          envoyées à un LLM afin d'optimiser la qualité et la pertinence des
          réponses générées."
      - id: q20
        question:
          "Dans une architecture web intégrant un LLM via une API, quel est le
          rôle typique du backend ?"
        answers:
          [
            "Exécuter le modèle LLM directement dans le navigateur",
            "Recevoir les requêtes utilisateur, construire le prompt et appeler
            l'API du LLM",
            "Stocker uniquement les fichiers statiques HTML et CSS",
            "Remplacer le LLM par des règles symboliques",
          ]
        correct: 1
        explanation:
          "Le backend reçoit les demandes du client, prépare le prompt (avec
          contexte éventuel issu d'une vector DB), interroge l'API du LLM puis
          renvoie la réponse au frontend."
  - id: vscode-copilot
    title: "Visual Studio Code (VSCode) et GitHub Copilot"
    questions:
      - id: q1
        question: "Qu'est-ce que GitHub Copilot ?"
        answers:
          [
            Un éditeur de code open source,
            Un assistant de programmation basé sur l'IA intégré à l'éditeur,
            Un système de gestion de versions concurrent de Git,
            Un service d'hébergement de dépôts,
          ]
        correct: 1
        explanation:
          "GitHub Copilot est un assistant de programmation propulsé par un LLM,
          qui s'intègre à l'éditeur pour suggérer du code."
      - id: q2
        question:
          "Quel est un prérequis indispensable pour utiliser GitHub Copilot dans
          VSCode ?"
        answers:
          [
            Disposer d'un compte GitHub avec un abonnement Copilot actif,
            Installer Docker sur la machine,
            Configurer un serveur SSH local,
            Utiliser exclusivement le langage Python,
          ]
        correct: 0
        explanation:
          "Copilot nécessite un compte GitHub avec une licence Copilot active et
          l'extension installée dans VSCode."
      - id: q3
        question: "À quoi sert le chat de GitHub Copilot dans VSCode ?"
        answers:
          [
            "Discuter avec d'autres développeurs en temps réel",
            "Dialoguer en langage naturel avec l'IA pour expliquer, générer ou
            corriger du code",
            "Remplacer le terminal intégré",
            "Gérer les pull requests sur GitHub",
          ]
        correct: 1
        explanation:
          "Le chat Copilot permet de poser des questions en langage naturel et
          d'obtenir des explications ou du code généré par l'IA."
      - id: q4
        question:
          "Comment déclencher une suggestion de Copilot directement dans un
          fichier de code ?"
        answers:
          [
            En écrivant un commentaire ou une signature de fonction décrivant
            l'intention,
            En appuyant sur la touche Échap,
            En lançant un build du projet,
            En ouvrant un terminal intégré,
          ]
        correct: 0
        explanation:
          "Copilot s'appuie sur le contexte du fichier : un commentaire
          descriptif ou une signature de fonction suffit à déclencher une
          suggestion d'implémentation."
      - id: q5
        question:
          "Dans le TP générant des pages web à partir d'un prompt, quel est le
          rôle du LLM ?"
        answers:
          [
            Héberger les pages web produites,
            Compiler le code TypeScript de l'application,
            Produire le contenu HTML/CSS à partir du prompt fourni par
            l'utilisateur,
            Gérer l'authentification des utilisateurs,
          ]
        correct: 2
        explanation:
          "Le LLM reçoit le prompt utilisateur et renvoie le contenu de la page
          (HTML/CSS) que l'application affiche ensuite."
      - id: q6
        question:
          "Quel est le prérequis indispensable pour utiliser GitHub Copilot dans
          VSCode ?"
        answers:
          [
            Disposer d'un compte GitHub avec un abonnement Copilot actif,
            Installer Node.js sur la machine,
            Créer un dépôt Git public,
            Activer le mode développeur de Windows,
          ]
        correct: 0
        explanation:
          "GitHub Copilot nécessite un compte GitHub associé à un abonnement
          Copilot (gratuit ou payant) pour être authentifié dans VSCode."
      - id: q7
        question: "Comment ouvrir le chat de GitHub Copilot dans VSCode ?"
        answers:
          [
            En cliquant sur l'icône Copilot Chat de la barre d'activité ou via
            le raccourci dédié,
            En ouvrant un terminal intégré,
            En lançant la commande \"git chat\",
            En installant une extension tierce de messagerie,
          ]
        correct: 0
        explanation:
          "Le chat Copilot est accessible depuis l'icône dédiée dans la barre
          d'activité de VSCode ou via un raccourci clavier configurable."
      - id: q8
        question:
          "Comment déclencher Copilot directement depuis un fichier de code
          ouvert dans VSCode ?"
        answers:
          [
            En commençant à écrire du code ou un commentaire pour obtenir une
            suggestion en ligne,
            En envoyant le fichier par e-mail à GitHub,
            En compilant le projet avec un flag spécial,
            En renommant le fichier avec l'extension .copilot,
          ]
        correct: 0
        explanation:
          "Copilot propose automatiquement des suggestions en ligne (ghost text)
          au fur et à mesure que l'on écrit du code ou des commentaires dans
          l'éditeur."
      - id: q9
        question:
          "Quelle pratique facilite la génération d'une implémentation
          pertinente par Copilot ?"
        answers:
          [
            Définir clairement la signature de la fonction et un commentaire
            décrivant son rôle,
            Écrire uniquement le nom du fichier sans contenu,
            Désactiver la coloration syntaxique,
            Utiliser exclusivement des noms de variables d'une seule lettre,
          ]
        correct: 0
        explanation:
          "Une signature explicite accompagnée d'un commentaire descriptif
          fournit à Copilot le contexte nécessaire pour proposer une
          implémentation cohérente."
      - id: q10
        question:
          "Une fois qu'une fonction a été générée par Copilot, comment
          l'utiliser dans le reste du code ?"
        answers:
          [
            "En l'appelant comme n'importe quelle fonction du langage, en lui
            passant les arguments attendus",
            "En la copiant dans le chat Copilot à chaque appel",
            "En l'exécutant uniquement via le terminal Copilot",
            "En la déclarant à nouveau avant chaque utilisation",
          ]
        correct: 0
        explanation:
          "Le code généré par Copilot est du code standard : la fonction
          s'appelle normalement avec ses arguments, comme toute autre fonction
          du langage."
      - id: q11
        question:
          "Quel est le prérequis principal pour utiliser GitHub Copilot dans
          VSCode ?"
        answers:
          [
            Disposer d'un compte GitHub avec un abonnement Copilot actif,
            Installer Node.js sur sa machine,
            Configurer un dépôt Git local,
            Posséder une carte graphique compatible CUDA,
          ]
        correct: 0
        explanation:
          "GitHub Copilot nécessite un compte GitHub associé à un abonnement
          (gratuit pour certains profils ou payant) et l'installation de
          l'extension dans VSCode."
      - id: q12
        question: "À quoi sert le chat de GitHub Copilot intégré à VSCode ?"
        answers:
          [
            "Compiler automatiquement le code du projet",
            "Dialoguer en langage naturel avec l'IA pour poser des questions ou
            demander du code",
            "Remplacer le terminal système de VSCode",
            "Synchroniser les fichiers avec un dépôt distant",
          ]
        correct: 1
        explanation:
          "Le chat Copilot permet d'interagir en langage naturel avec l'IA pour
          obtenir des explications, générer du code ou refactorer, sans quitter
          l'éditeur."
      - id: q13
        question:
          "Comment déclencher Copilot directement depuis un fichier de code
          ouvert dans VSCode ?"
        answers:
          [
            "En écrivant un commentaire ou une signature de fonction décrivant
            l'intention",
            "En cliquant sur le bouton Run de la barre d'état",
            "En lançant la commande npm install copilot",
            "En ouvrant un nouvel onglet de navigateur",
          ]
        correct: 0
        explanation:
          "Copilot analyse le contexte du fichier et propose des suggestions
          inline lorsque l'on rédige un commentaire descriptif ou une signature
          de fonction."
      - id: q14
        question:
          "Lorsque l'on définit une fonction avec l'aide de Copilot, quelle
          bonne pratique facilite une suggestion pertinente ?"
        answers:
          [
            "Donner un nom de fonction explicite et décrire son rôle en
            commentaire",
            "Utiliser uniquement des noms de variables d'une seule lettre",
            "Désactiver la coloration syntaxique",
            "Écrire le code en majuscules",
          ]
        correct: 0
        explanation:
          "Un nom explicite et un commentaire décrivant l'objectif fournissent à
          Copilot un contexte clair pour générer une implémentation pertinente."
      - id: q15
        question:
          "Après avoir généré une fonction avec Copilot, quelle étape est
          indispensable avant de l'utiliser en production ?"
        answers:
          [
            "Publier la fonction sur GitHub Marketplace",
            "Relire et tester le code proposé pour valider son comportement",
            "Renommer automatiquement tous les fichiers du projet",
            "Désinstaller l'extension Copilot",
          ]
        correct: 1
        explanation:
          "Les suggestions de Copilot ne sont pas garanties exactes : il est
          essentiel de relire, tester et adapter le code avant toute mise en
          production."
      - id: q16
        question:
          "Quel est un prérequis indispensable pour utiliser GitHub Copilot dans
          VSCode ?"
        answers:
          [
            Disposer d'un compte GitHub avec un abonnement Copilot actif,
            Installer Docker Desktop sur sa machine,
            Activer le mode hors-ligne de VSCode,
            Compiler VSCode depuis ses sources,
          ]
        correct: 0
        explanation:
          "GitHub Copilot nécessite un compte GitHub associé à une licence
          Copilot active et l'extension installée dans VSCode."
      - id: q17
        question: "À quoi sert le chat de GitHub Copilot intégré à VSCode ?"
        answers:
          [
            "Dialoguer avec Copilot pour poser des questions, expliquer ou
            générer du code",
            Remplacer le terminal système de VSCode,
            Gérer les branches Git à la place de l'utilisateur,
            Compiler automatiquement le projet à chaque message,
          ]
        correct: 0
        explanation:
          "Le chat Copilot permet d'échanger en langage naturel avec l'IA pour
          obtenir des explications, des suggestions ou du code généré."
      - id: q18
        question:
          "Comment invoquer Copilot directement depuis un fichier de code ouvert
          dans VSCode ?"
        answers:
          [
            En écrivant un commentaire décrivant l'intention puis en acceptant
            la suggestion proposée en ligne,
            En renommant le fichier avec l'extension .copilot,
            En désactivant l'extension Copilot avant d'écrire,
            En exécutant la commande git commit,
          ]
        correct: 0
        explanation:
          "Copilot lit le contexte du fichier et propose des complétions inline
          à partir d'un commentaire ou d'un début de code."
      - id: q19
        question:
          "Quelle bonne pratique permet à Copilot de générer une implémentation
          pertinente pour une fonction ?"
        answers:
          [
            Définir une signature explicite et un commentaire décrivant le
            comportement attendu,
            Laisser le fichier vide et attendre une suggestion,
            Utiliser uniquement des noms de variables d'une seule lettre,
            Désactiver la coloration syntaxique,
          ]
        correct: 0
        explanation:
          "Une signature claire et un commentaire descriptif fournissent à
          Copilot le contexte nécessaire pour proposer une implémentation
          cohérente."
      - id: q20
        question:
          "Lorsqu'on utilise une fonction suggérée par Copilot, quelle
          vérification est recommandée ?"
        answers:
          [
            Relire le code généré et le tester pour s'assurer qu'il répond au
            besoin,
            Accepter la suggestion sans la lire pour gagner du temps,
            Supprimer tous les tests unitaires existants,
            Publier immédiatement le code en production,
          ]
        correct: 0
        explanation:
          "Copilot peut produire du code incorrect ou inadapté ; une relecture
          et des tests restent indispensables avant utilisation."
  - id: programmation-prompt
    title: "La programmation par prompt"
    questions:
      - id: q1
        question:
          "Pourquoi est-il recommandé de rédiger des prompts complets et
          détaillés lorsqu'on s'adresse à un LLM ?"
        answers:
          [
            Pour réduire la consommation de tokens du modèle,
            Pour fournir suffisamment de contexte et obtenir une réponse précise
            et exploitable,
            Pour forcer le modèle à utiliser une langue particulière,
            Pour empêcher le modèle de générer du code,
          ]
        correct: 1
        explanation:
          "Un prompt complet et détaillé fournit le contexte, les contraintes et
          le format attendu, ce qui améliore nettement la pertinence et la
          qualité de la réponse du LLM."
      - id: q2
        question: "En quoi consiste la technique du « role prompting » ?"
        answers:
          [
            "Demander au modèle d'incarner un rôle ou une expertise spécifique
            pour orienter son style et son contenu",
            Fournir plusieurs exemples de questions-réponses dans le prompt,
            Demander au modèle d'expliquer son raisonnement étape par étape,
            Générer plusieurs réponses puis voter pour la plus fréquente,
          ]
        correct: 0
        explanation:
          "Le role prompting consiste à attribuer un rôle au modèle (par exemple
          « Tu es un expert en cybersécurité ») afin d'adapter le ton, le
          vocabulaire et la profondeur de la réponse."
      - id: q3
        question: "Que désigne le « Few-Shot Prompting » ?"
        answers:
          [
            Donner un seul exemple détaillé au modèle,
            Ne donner aucun exemple et laisser le modèle improviser,
            Fournir quelques exemples représentatifs dans le prompt pour guider
            la réponse du modèle,
            Limiter la taille du prompt à quelques mots,
          ]
        correct: 2
        explanation:

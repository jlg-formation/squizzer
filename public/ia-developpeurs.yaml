  - id: programmation-prompt
    title: "La programmation par prompt"
    questions:
      - id: q1
        question:
          "Pourquoi un prompt détaillé et complet produit-il généralement de
          meilleurs résultats avec un LLM ?"
        answers:
          - "Parce qu'il réduit l'ambiguïté et fournit au modèle le contexte
            nécessaire pour générer une réponse pertinente."
          - "Parce que la facturation à l'API dépend uniquement de la longueur
            du prompt envoyé."
          - "Parce qu'un prompt long désactive automatiquement les filtres de
            sécurité du modèle."
          - "Parce que le modèle mémorise définitivement le prompt pour les
            futures requêtes des autres utilisateurs."
        correct: 0
        explanation:
          "Un prompt détaillé limite les interprétations possibles et fournit le
          contexte, les contraintes et le format attendus, ce qui améliore la
          qualité et la pertinence de la réponse."
      - id: q2
        question: "En quoi consiste le role prompting ?"
        answers:
          - "Assigner explicitement un rôle ou une persona au modèle (par
            exemple « Tu es un expert en cybersécurité ») pour orienter son ton
            et son expertise."
          - "Donner au modèle plusieurs exemples de paires entrée/sortie avant
            la vraie question."
          - "Demander au modèle de détailler étape par étape son raisonnement
            avant de répondre."
          - "Exécuter le même prompt plusieurs fois et conserver la réponse
            majoritaire."
        correct: 0
        explanation:
          "Le role prompting consiste à attribuer un rôle ou une identité au
          modèle afin de cadrer son style, son niveau d'expertise et la
          perspective de sa réponse."
      - id: q3
        question: "Comment se définit le few-shot prompting ?"
        answers:
          - "Fournir dans le prompt quelques exemples de paires entrée/sortie
            pour montrer au modèle le format et le comportement attendus."
          - "Interroger le modèle sans aucun exemple ni contexte préalable."
          - "Découper un long prompt en plusieurs petits prompts indépendants
            envoyés en parallèle."
          - "Limiter le nombre de tokens générés par la réponse du modèle."
        correct: 0
        explanation:
          "Le few-shot prompting consiste à inclure un petit nombre d'exemples
          démonstratifs dans le prompt pour guider le modèle vers le format et
          le type de réponse souhaités."
      - id: q4
        question: "Quel est le principe du chain-of-thought (CoT) prompting ?"
        answers:
          - "Inciter le modèle à expliciter son raisonnement étape par étape
            avant de donner la réponse finale."
          - "Chaîner plusieurs modèles différents les uns à la suite des autres
            dans un pipeline."
          - "Forcer le modèle à répondre uniquement par oui ou par non."
          - "Réutiliser la réponse précédente comme unique contexte pour la
            requête suivante."
        correct: 0
        explanation:
          "Le chain-of-thought consiste à demander au modèle de décomposer son
          raisonnement en étapes intermédiaires, ce qui améliore notamment la
          résolution des problèmes complexes ou logiques."
      - id: q5
        question:
          "Que désigne la technique de self-consistency en prompt engineering ?"
        answers:
          - "Générer plusieurs réponses au même prompt puis retenir la réponse
            majoritaire ou la plus cohérente."
          - "Demander au modèle de vérifier l'orthographe de sa propre réponse."
          - "Forcer le modèle à toujours répondre dans la même langue que le
            prompt."
          - "Réutiliser le même seed aléatoire pour obtenir une réponse
            strictement identique à chaque appel."
        correct: 0
        explanation:
          "La self-consistency consiste à échantillonner plusieurs réponses pour
          un même prompt (souvent avec du chain-of-thought) puis à sélectionner
          la réponse qui revient le plus souvent, afin d'améliorer la fiabilité."
      - id: q6
        question:
          "Vous obtenez une réponse incomplète d'un LLM. Quelle approche
          correspond à l'itération sur un prompt ?"
        answers:
          - "Réécrire le prompt en précisant les manques constatés et relancer
            la requête"
          - "Changer immédiatement de modèle plus puissant sans modifier le
            prompt"
          - "Accepter la réponse et corriger manuellement toutes les lacunes"
          - "Relancer exactement le même prompt jusqu'à obtenir une réponse
            différente"
        correct: 0
        explanation:
          "Itérer consiste à affiner progressivement le prompt en fonction des
          résultats obtenus, jusqu'à converger vers la sortie attendue."
      - id: q7
        question:
          "Pourquoi est-il utile de demander explicitement un format de sortie
          structuré comme JSON ou Markdown dans un prompt ?"
        answers:
          - "Cela rend la réponse plus facile à parser ou à intégrer dans un
            autre outil"
          - "Cela garantit que le contenu de la réponse sera factuellement exact"
          - "Cela réduit systématiquement le coût en tokens de la requête"
          - "Cela empêche le modèle d'halluciner des informations"
        correct: 0
        explanation:
          "Imposer un format structuré facilite l'exploitation programmatique de
          la sortie, mais n'a pas d'effet sur la véracité du contenu."
      - id: q8
        question:
          "Pourquoi recommande-t-on d'éviter les formulations négatives dans un
          prompt ?"
        answers:
          - "Les LLM suivent mieux des consignes positives décrivant ce qu'il
            faut faire que des interdictions"
          - "Les négations sont systématiquement rejetées par les API des LLM"
          - "Les négations augmentent fortement la latence de génération"
          - 'Les LLM ne comprennent pas du tout le mot "ne pas"'
        correct: 0
        explanation:
          "Mieux vaut décrire positivement le comportement attendu, car les
          modèles peuvent ignorer ou mal interpréter les interdictions."
      - id: q9
        question:
          "Face à une tâche complexe, quel est l'intérêt d'un découpage
          modulaire du prompt ?"
        answers:
          - "Décomposer le problème en sous-prompts ciblés améliore la qualité
            et facilite le débogage"
          - "Cela permet d'exécuter tous les sous-prompts en parallèle sans
            coordination"
          - "Cela supprime le besoin de fournir un contexte au modèle"
          - "Cela force le modèle à utiliser un seul appel pour tout résoudre"
        correct: 0
        explanation:
          "Découper une tâche complexe en étapes plus simples rend chaque
          sous-prompt plus précis et permet d'isoler facilement les erreurs."
      - id: q10
        question:
          "Pourquoi la clarté et la concision sont-elles essentielles dans la
          rédaction d'un prompt ?"
        answers:
          - "Un prompt clair et concis réduit les ambiguïtés et oriente mieux la
            réponse du modèle"
          - "Un prompt long et flou produit toujours une meilleure réponse
            créative"
          - "La concision permet de contourner les filtres de sécurité du modèle"
          - "La clarté n'a aucun impact tant que le prompt est en anglais"
        correct: 0
        explanation:
          "Un énoncé précis et concis limite les interprétations possibles et
          augmente la probabilité d'obtenir la réponse attendue."
      - id: q11
        question:
          "Dans la programmation par prompt, en quoi consiste le couplage d'un
          LLM puissant avec un LLM faible ?"
        answers:
          - "Utiliser deux LLM puissants en parallèle pour comparer leurs
            réponses et choisir la meilleure"
          - "Confier la conception et les tâches complexes au LLM puissant, et
            déléguer les exécutions répétitives ou simples au LLM faible, moins
            coûteux"
          - "Entraîner un petit modèle à partir des sorties d'un grand modèle
            pour le remplacer totalement"
          - "Faire valider chaque réponse du LLM faible par un humain avant de
            la transmettre au LLM puissant"
        correct: 1
        explanation:
          "Le couplage consiste à réserver le LLM puissant aux tâches de
          raisonnement et de conception, tandis qu'un LLM plus faible et
          économique prend en charge les opérations simples et répétitives."
      - id: q12
        question:
          "Que signifie « transformer un prompt en application web complète »
          dans une démarche de programmation par prompt ?"
        answers:
          - "Décrire dans un prompt le besoin et les fonctionnalités attendues
            afin que le LLM génère le code de l'application web (front, back,
            structure du projet)"
          - "Coller un prompt directement dans le navigateur pour qu'il
            s'exécute comme du JavaScript"
          - "Convertir automatiquement un prompt en image de maquette
            uniquement, sans génération de code"
          - "Stocker le prompt dans une base de données pour qu'il serve de page
            d'accueil à l'application"
        correct: 0
        explanation:
          "L'idée est de rédiger un prompt suffisamment précis pour que le LLM
          produise le code complet d'une application web fonctionnelle, du front
          au back."
      - id: q13
        question:
          "Qu'est-ce qu'un prompt de modification ciblée appliqué à un code
          existant ?"
        answers:
          - "Un prompt qui demande au LLM de réécrire intégralement le projet à
            partir de zéro"
          - "Un prompt qui se contente de demander « améliore ce code » sans
            aucune précision"
          - "Un prompt qui décrit précisément le changement à effectuer sur une
            portion identifiée du code, en fournissant le contexte nécessaire au
            LLM"
          - "Un prompt qui modifie automatiquement le code sans intervention du
            développeur ni revue"
        correct: 2
        explanation:
          "Un prompt de modification ciblée précise quel fichier ou quelle

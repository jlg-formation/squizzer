          alors que Continue.dev est une extension open source qui s'intègre à
          plusieurs fournisseurs de LLM, y compris des modèles locaux."
      - id: q12
        question:
          "Que désignent les notions de quotas et de rate limits sur une API de
          LLM ?"
        answers:
          - "Le nombre maximal de tokens stockés en cache par le client"
          - "Des limites imposées par le fournisseur sur le nombre de requêtes
            ou de tokens autorisés sur une période donnée"
          - "La taille maximale du contexte qu'un modèle peut traiter en une
            seule requête"
          - "Le délai contractuel de remboursement en cas de panne du service"
        correct: 1
        explanation:
          "Les quotas et rate limits sont des plafonds fixés par le fournisseur
          (requêtes par minute, tokens par jour, etc.) afin de réguler l'usage
          de l'API et d'éviter les surcharges."
      - id: q13
        question:
          "Pourquoi est-il risqué de choisir un service cloud d'IA en se basant
          principalement sur le coût ?"
        answers:
          - "Parce que le prix affiché est toujours faux et change chaque jour"
          - "Parce que cela peut conduire à négliger des critères essentiels

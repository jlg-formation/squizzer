        correct: 0
        explanation:
          "L'installation locale d'un LLM passe par un runtime d'inférence (LM
          Studio, Ollama, llama.cpp), le téléchargement d'un modèle compatible
          (souvent au format GGUF quantisé) puis son chargement en mémoire."
      - id: q13
        question: "Quel est le rôle principal de LM Studio ?"
        answers:
          - "Fournir une application de bureau permettant de télécharger,
            exécuter et tester des LLM en local avec une interface graphique"
          - "Héberger des modèles propriétaires d'OpenAI dans le cloud"
          - "Annoter des jeux de données pour l'entraînement supervisé de
            modèles de vision"
          - "Orchestrer des pipelines CI/CD pour le déploiement de microservices
            IA"
        correct: 0
        explanation:
          "LM Studio est une application desktop qui simplifie le
          téléchargement, le chargement et l'exécution locale de LLM open
          source, et expose un serveur compatible avec l'API OpenAI."
      - id: q14
        question:
          "Quel est le rôle de Hugging Face dans l'écosystème de l'intelligence
          artificielle ?"
        answers:
          - "Une plateforme communautaire qui héberge des modèles, des jeux de
            données et des espaces de démonstration, et fournit des
            bibliothèques open source comme Transformers"
          - "Un fournisseur exclusif de GPU dédiés à l'entraînement de modèles
            propriétaires"
          - "Un éditeur de code propriétaire spécialisé dans le développement
            d'agents IA"
          - "Un organisme de certification officiel des modèles d'IA conformes
            au RGPD"
        correct: 0
        explanation:
          "Hugging Face est la principale plateforme de partage de modèles et de
          datasets en open source ; elle édite aussi des bibliothèques de
          référence (Transformers, Datasets) et propose des Spaces pour
          démonstrer des modèles."
      - id: q15
        question: "Qu'est-ce qu'un text embedding ?"
        answers:
          - "Une représentation vectorielle numérique d'un texte qui capture son
            sens sémantique dans un espace de dimension fixe"
          - "Un fichier compressé contenant le code source d'un modèle de
            langage"
          - "Un algorithme de chiffrement symétrique appliqué aux prompts
            envoyés à un LLM"
          - "Un format de balisage HTML utilisé pour intégrer du texte dans une
            page web"
        correct: 0
        explanation:
          "Un text embedding est un vecteur de nombres réels (souvent de
          plusieurs centaines de dimensions) qui encode le sens d'un texte ;
          deux textes proches sémantiquement ont des vecteurs proches, ce qui
          permet la recherche par similarité (RAG)."
      - id: q16
        question:
          "Que mesure la cosine similarity entre deux vecteurs d'embeddings ?"
        answers:
          - "La distance euclidienne entre les deux points dans l'espace
            vectoriel"
          - "Le cosinus de l'angle entre les deux vecteurs, donc leur similarité
            d'orientation"
          - "La différence absolue de leurs normes"
          - "Le nombre de dimensions communes non nulles"
        correct: 1
        explanation:
          "La cosine similarity vaut le cosinus de l'angle entre les vecteurs :
          1 si colinéaires de même sens, 0 si orthogonaux, -1 si opposés."
      - id: q17
        question:
          "Pourquoi applique-t-on souvent une réduction de dimension aux
          embeddings ?"
        answers:
          - "Pour augmenter la précision sémantique en ajoutant des dimensions"
          - "Pour réduire le coût de stockage et accélérer les calculs de
            similarité tout en limitant la perte d'information"
          - "Pour transformer les vecteurs en texte lisible"
          - "Pour chiffrer les embeddings avant transmission"
        correct: 1
        explanation:
          "Réduire la dimension (PCA, UMAP, etc.) diminue la mémoire et le temps
          de calcul des recherches vectorielles, en conservant l'essentiel de
          l'information sémantique."
      - id: q18
        question:
          "Quel est le principe général de l'architecture RAG
          (Retrieval-Augmented Generation) ?"
        answers:
          - "Réentraîner le LLM sur les données de l'entreprise à chaque requête"
          - "Récupérer des documents pertinents dans une base vectorielle puis
            les fournir comme contexte au LLM pour générer la réponse"
          - "Compresser le LLM pour le faire tenir sur un poste utilisateur"
          - "Faire voter plusieurs LLM et conserver la réponse majoritaire"
        correct: 1
        explanation:
          "Le RAG combine une étape de retrieval (recherche de passages
          pertinents) et une étape de génération où le LLM s'appuie sur ces
          passages pour produire une réponse contextualisée."
      - id: q19
        question:
          "Quel est un avantage clé du RAG par rapport au fine-tuning d'un
          modèle ?"
        answers:
          - "Il modifie les poids du modèle de façon permanente"
          - "Il permet de mettre à jour la base documentaire sans réentraîner le
            modèle, et de citer les sources"
          - "Il supprime totalement le risque d'hallucination"
          - "Il rend le modèle utilisable hors ligne sans GPU"
        correct: 1
        explanation:
          "Avec un RAG, ajouter ou modifier des documents ne nécessite pas de
          réentraînement : on met à jour l'index vectoriel, et les réponses
          peuvent référencer les sources utilisées."
      - id: q20
        question:
          "Quel est un cas d'usage typique d'un RAG documentaire en entreprise ?"
        answers:
          - "Compiler le code source d'une application en binaire"
          - "Un assistant qui répond aux questions des collaborateurs en
            s'appuyant sur la documentation interne (procédures, FAQ, contrats)"
          - "Superviser le réseau et détecter les intrusions en temps réel"
          - "Générer automatiquement les bulletins de paie mensuels"
        correct: 1
        explanation:
          "Un RAG documentaire est typiquement utilisé comme assistant interne
          capable de répondre à partir des documents propres à l'entreprise,
          avec citations des sources."

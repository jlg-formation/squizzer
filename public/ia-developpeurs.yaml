  - id: llm
    title: "Les LLM"
    questions:
      - id: q1
        question:
          "Quel mécanisme central de l'architecture Transformer permet à un LLM
          de pondérer l'importance relative des différents tokens d'une séquence
          ?"
        answers:
          - "La convolution 2D appliquée aux embeddings"
          - "Le mécanisme d'attention (self-attention)"
          - "La rétropropagation à travers le temps (BPTT)"
          - "Le pooling global moyen sur la séquence"
        correct: 1
        explanation:
          "L'architecture Transformer repose sur le mécanisme de self-attention,
          qui calcule des poids entre tous les tokens d'une séquence pour
          modéliser leurs dépendances."
      - id: q2
        question:
          "À quoi sert le paramètre temperature lors de la génération de texte
          par un LLM ?"
        answers:
          - "Il limite le nombre maximum de tokens générés"
          - "Il contrôle le caractère aléatoire de la distribution de
            probabilité des tokens prédits"
          - "Il fixe la taille de la fenêtre de contexte du modèle"
          - "Il détermine le nombre de couches d'attention utilisées à
            l'inférence"
        correct: 1
        explanation:
          "La temperature ajuste la distribution de probabilité des tokens : une
          valeur faible rend la sortie déterministe, une valeur élevée la rend
          plus créative et variée."
      - id: q3
        question:
          "Que fait précisément le paramètre top_p (nucleus sampling) lors de
          l'échantillonnage des tokens d'un LLM ?"
        answers:
          - "Il sélectionne les p tokens les plus probables, p étant un entier
            fixe"
          - "Il restreint l'échantillonnage au plus petit ensemble de tokens
            dont la somme des probabilités atteint p"
          - "Il multiplie la probabilité de chaque token par le facteur p"
          - "Il fixe la probabilité minimale acceptable pour qu'un token soit
            retenu"
        correct: 1
        explanation:
          "Le nucleus sampling conserve dynamiquement le plus petit ensemble de
          tokens dont la masse de probabilité cumulée atteint p, puis
          échantillonne dans ce noyau."
      - id: q4
        question:
          "Quelle est la différence fondamentale entre temperature et top_p dans
          le réglage d'un LLM ?"
        answers:
          - "Les deux paramètres font exactement la même chose, top_p est un
            alias de temperature"
          - "Temperature modifie la forme de la distribution de probabilité,
            tandis que top_p tronque cette distribution à un noyau de tokens
            cumulant une probabilité p"
          - "Temperature agit à l'entraînement et top_p uniquement à l'inférence"
          - "Temperature contrôle la longueur de sortie et top_p contrôle la
            créativité"
        correct: 1
        explanation:
          "La temperature lisse ou accentue la distribution des probabilités,
          alors que top_p la tronque dynamiquement en ne gardant que le noyau de
          tokens dont la probabilité cumulée atteint p."
      - id: q5
        question:
          "En quoi consiste la tâche de summarization réalisée par un LLM ?"
        answers:
          - "Traduire automatiquement un texte d'une langue source vers une
            langue cible"
          - "Produire une version condensée d'un texte source en préservant ses
            informations essentielles"
          - "Classer un texte dans une catégorie prédéfinie parmi plusieurs
            étiquettes"
          - "Extraire des entités nommées (personnes, lieux, dates) d'un
            document"
        correct: 1
        explanation:
          "La summarization consiste à générer un résumé qui condense un texte
          source tout en conservant les idées et informations principales."
      - id: q6
        question:
          "Quel est un exemple typique de tâche de classification de texte
          confiée à un LLM ?"
        answers:
          - 'Trier des e-mails entrants entre les catégories "spam" et
            "non-spam"'
          - "Générer une image à partir d'une description"
          - "Compresser un fichier audio en MP3"
          - "Calculer la moyenne d'une colonne dans un tableur"
        correct: 0
        explanation:
          "La classification consiste à attribuer une étiquette parmi un
          ensemble fini à un texte, comme distinguer un spam d'un message
          légitime."
      - id: q7
        question:
          "À quoi sert l'extraction d'information structurée à l'aide d'un LLM ?"
        answers:
          - "À chiffrer un document avant de le transmettre"
          - "À identifier et restituer des champs précis (nom, date, montant,
            etc.) à partir d'un texte libre"
          - "À traduire un texte d'une langue à une autre"
          - "À convertir un fichier PDF en image"
        correct: 1
        explanation:
          "L'extraction structurée transforme un texte non structuré en données
          exploitables, en repérant des entités ou champs ciblés comme un nom,
          une date ou un montant."
      - id: q8
        question:
          "Quelle est la bonne pratique pour obtenir d'un LLM une sortie au
          format JSON exploitable ?"
        answers:
          - "Lui interdire toute réponse textuelle dans le prompt système"
          - 'Décrire précisément le schéma attendu et, si possible, activer un
            mode "JSON" ou "structured output"'
          - "Augmenter au maximum la température pour gagner en créativité"
          - "Demander la réponse sous forme d'image générée"
        correct: 1
        explanation:
          "Spécifier le schéma JSON attendu et utiliser un mode de sortie
          structurée (quand il existe) fiabilise grandement le format de la
          réponse du LLM."
      - id: q9
        question:
          "Quel est un avantage clé du format de fichier GGUF pour exécuter des
          LLM en local ?"
        answers:
          - "Il chiffre automatiquement les poids du modèle"
          - "Il regroupe poids et métadonnées dans un fichier unique optimisé
            pour l'inférence locale (notamment quantifiée)"
          - "Il oblige à utiliser un GPU NVIDIA récent"
          - "Il transforme le modèle en service web hébergé dans le cloud"
        correct: 1
        explanation:
          "GGUF est un format conçu pour llama.cpp et consorts, qui rassemble
          poids et métadonnées en un seul fichier et supporte la quantification,
          idéal pour l'inférence locale sur CPU ou GPU modeste."
      - id: q10
        question:
          "Parmi ces critères, lequel est pertinent pour choisir un LLM du
          marché pour un projet ?"
        answers:
          - "La couleur du logo de l'éditeur"
          - "Uniquement le nombre de paramètres, indépendamment de tout autre
            facteur"
          - "La taille du modèle, sa licence d'utilisation et ses performances
            mesurées sur des benchmarks pertinents"
          - "Le nombre d'abonnés de l'éditeur sur les réseaux sociaux"
        correct: 2
        explanation:
          "Le choix d'un LLM repose notamment sur sa taille (coût et latence),
          sa licence (usage commercial autorisé ou non) et ses performances
          réelles sur des tâches représentatives du besoin."
      - id: q11
        question:
          "Parmi les LLM suivants, lesquels sont accessibles uniquement en mode
          SaaS (cloud), sans possibilité d'installation locale ?"
        answers:
          - "GPT-4 et Claude"
          - "Llama et Mistral"
          - "Gemma et Phi-3"
          - "Falcon et Qwen"
        correct: 0
        explanation:
          "GPT-4 (OpenAI) et Claude (Anthropic) sont des modèles propriétaires

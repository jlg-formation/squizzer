  - id: llm
    title: "Les LLM"
    questions:
      - id: q1
        question:
          "Dans un LLM, à quoi sert le paramètre temperature lors de la
          génération de texte ?"
        answers:
          [
            À contrôler le degré d'aléa et de créativité des sorties,
            À limiter la longueur maximale de la réponse générée,
            À définir la taille de la fenêtre de contexte du modèle,
            À choisir la langue utilisée pour la réponse,
          ]
        correct: 0
        explanation:
          "La temperature module la distribution de probabilité des tokens : une
          valeur basse rend la sortie plus déterministe, une valeur haute la
          rend plus créative et variée."
      - id: q2
        question:
          "Que permet de faire l'architecture RAG (Retrieval-Augmented
          Generation) ?"
        answers:
          [
            Réentraîner automatiquement le LLM à chaque requête utilisateur,
            Enrichir le prompt du LLM avec des documents récupérés depuis une
            base de connaissances,
            Compresser les poids du modèle pour l'exécuter en local,
            Réduire la température du modèle pour limiter les hallucinations,
          ]
        correct: 1
        explanation:
          "Le RAG combine un moteur de recherche (souvent vectoriel) et un LLM :
          les documents pertinents sont récupérés puis injectés dans le contexte
          du prompt pour produire une réponse fondée sur ces sources."
      - id: q3
        question:
          "À quoi correspond la cosine similarity dans le contexte des text
          embeddings ?"
        answers:
          [
            Une mesure de la longueur en tokens d'un texte,
            Une fonction de perte utilisée pour entraîner le LLM,
            Une mesure de similarité sémantique entre deux vecteurs d'embedding,
            Un algorithme de réduction de dimension comme t-SNE,
          ]
        correct: 2
        explanation:
          "La similarité cosinus mesure l'angle entre deux vecteurs : appliquée
          à des embeddings, elle indique à quel point deux textes sont
          sémantiquement proches, indépendamment de leur norme."
      - id: q4
        question: "Quel est le principal intérêt du format de fichier GGUF ?"
        answers:
          [
            Stocker un modèle LLM quantifié et ses métadonnées dans un seul
            fichier exécutable localement,
            Définir un format standard d'échange de prompts entre fournisseurs
            SaaS,
            Servir de format de sortie structurée à la place du JSON,
            Décrire l'architecture d'un pipeline RAG,
          ]
        correct: 0
        explanation:
          "GGUF est un format conçu pour distribuer des modèles (souvent
          quantifiés) prêts à être chargés par des runtimes comme llama.cpp ou
          LM Studio, avec leurs poids et métadonnées regroupés."
      - id: q5
        question:
          "Parmi les usages suivants, lequel n'est pas une fonctionnalité
          typique d'un LLM ?"
        answers:
          [
            Résumer automatiquement un long document (summarization),
            Classer un texte dans une catégorie (classification),
            Extraire des entités nommées d'un texte,
            Garantir mathématiquement l'exactitude d'un calcul numérique
            complexe,
          ]
        correct: 3
        explanation:
          "Les LLM excellent en summarization, classification et extraction
          d'information, mais ne garantissent pas l'exactitude des calculs :
          pour cela, on les couple à des outils externes (calculatrice, code)."
      - id: q6

title: "L'intelligence artificielle au service des développeurs"
chapters:
  - id: introduction-ia
    title: "Introduction à l'intelligence artificielle"
    questions:
      - id: q1
        question: "Qu'est-ce que l'intelligence artificielle ?"
        answers:
          - "Un ensemble de techniques permettant à une machine de simuler des
            capacités cognitives humaines comme le raisonnement ou
            l'apprentissage"
          - "Un langage de programmation spécialisé dans le traitement du
            langage naturel"
          - "Un type de processeur dédié uniquement aux calculs graphiques"
          - "Une base de données capable de stocker des images et des vidéos"
        correct: 0
        explanation:
          "L'IA désigne l'ensemble des techniques visant à doter une machine de
          capacités cognitives proches de celles de l'humain (raisonner,
          apprendre, percevoir, décider)."
      - id: q2
        question:
          "Quelle est la différence entre le machine learning et le deep
          learning ?"
        answers:
          - "Le machine learning est réservé aux images, le deep learning au
            texte"
          - "Le deep learning est un sous-ensemble du machine learning qui
            s'appuie sur des réseaux de neurones profonds à plusieurs couches"
          - "Le machine learning utilise des réseaux de neurones, le deep
            learning utilise uniquement des règles symboliques"
          - "Ce sont deux noms différents pour exactement la même technique"
        correct: 1
        explanation:
          "Le deep learning est une branche du machine learning qui repose sur
          des réseaux de neurones comportant de nombreuses couches cachées,
          capables d'apprendre des représentations complexes."
      - id: q3
        question:
          "Qu'est-ce qui distingue l'IA symbolique de l'IA statistique ?"
        answers:
          - "L'IA symbolique apprend à partir de données, l'IA statistique
            applique des règles écrites par des experts"
          - "L'IA symbolique repose sur des règles logiques explicites, tandis
            que l'IA statistique apprend des modèles à partir de données"
          - "L'IA symbolique fonctionne uniquement sur GPU, l'IA statistique
            uniquement sur CPU"
          - "Il s'agit de deux noms désignant la même approche fondée sur les
            probabilités"
        correct: 1
        explanation:
          "L'IA symbolique manipule des règles et des symboles définis
          explicitement, alors que l'IA statistique infère des régularités à
          partir d'un grand volume de données."
      - id: q4
        question: "Qu'est-ce qu'un Large Language Model (LLM) ?"
        answers:
          - "Un dictionnaire électronique recensant tous les mots d'une langue"
          - "Un protocole réseau dédié au transfert de fichiers texte volumineux"
          - "Un modèle de langage entraîné sur de très grandes quantités de
            texte, capable de générer et de comprendre du langage naturel"
          - "Une base de données relationnelle optimisée pour stocker des
            phrases"
        correct: 2
        explanation:
          "Un LLM est un modèle de langage de grande taille, entraîné sur
          d'énormes corpus textuels, capable de produire et d'interpréter du
          texte en langage naturel."
      - id: q5
        question: "À quoi servent les text embeddings ?"
        answers:
          - "À représenter du texte sous forme de vecteurs numériques afin de
            capturer son sens et de le comparer"
          - "À compresser des fichiers texte pour réduire leur taille de
            stockage"
          - "À chiffrer le texte échangé entre un client et un serveur"
          - "À convertir du texte en images pour l'afficher dans une interface
            graphique"
        correct: 0
        explanation:
          "Les text embeddings transforment des mots ou des phrases en vecteurs
          numériques dans un espace sémantique, ce qui permet de mesurer la
          proximité de sens entre différents textes."
      - id: q6
        question: "Qu'est-ce qu'un transformer en intelligence artificielle ?"
        answers:
          - "Un composant électronique qui alimente les cartes graphiques
            utilisées pour entraîner les modèles"
          - "Une architecture de réseau de neurones reposant sur le mécanisme
            d'attention, à la base des LLM modernes"
          - "Un algorithme de compression de données spécifique aux jeux
            d'entraînement d'images"
          - "Un protocole de communication entre serveurs d'inférence et clients
            web"
        correct: 1
        explanation:
          "Les transformers sont une architecture de réseau de neurones
          introduite en 2017, fondée sur le mécanisme d'attention, qui constitue
          la base des grands modèles de langage actuels."
      - id: q7
        question: "Que désigne le Natural Language Processing (NLP) ?"
        answers:
          - "Un protocole réseau dédié au transfert de fichiers texte volumineux"
          - "Une méthode de chiffrement appliquée aux conversations en langage
            naturel"
          - "Le domaine de l'IA qui traite la compréhension et la génération du
            langage humain par la machine"
          - "Une norme de formatage des documents techniques en plusieurs
            langues"
        correct: 2
        explanation:
          "Le NLP (traitement automatique du langage naturel) est la branche de
          l'IA dédiée à l'analyse, la compréhension et la génération de texte ou
          de parole en langage humain."
      - id: q8
        question:
          "Que signifie l'acronyme GPT dans le contexte des grands modèles de
          langage ?"
        answers:
          - "General Processing Tool"
          - "Generative Pre-trained Transformer"
          - "Global Prompt Tokenizer"
          - "Graphical Pattern Translator"
        correct: 1
        explanation:
          "GPT signifie Generative Pre-trained Transformer : un modèle
          génératif, pré-entraîné sur de vastes corpus, et reposant sur
          l'architecture transformer."
      - id: q9
        question:
          "Qu'est-ce qu'un token dans un grand modèle de langage (LLM) ?"
        answers:
          - "Une clé d'authentification permettant d'appeler l'API du modèle"
          - "Une unité élémentaire de texte (mot, sous-mot ou caractère)
            manipulée par le modèle"
          - "Un identifiant unique attribué à chaque utilisateur du modèle"
          - "Un fichier binaire contenant les poids entraînés du modèle"
        correct: 1
        explanation:
          "Dans un LLM, un token est une unité élémentaire de texte (mot,
          fragment de mot ou caractère) issue de la tokenisation, sur laquelle
          le modèle calcule ses prédictions."
      - id: q10
        question:
          "Quel est le rôle principal d'une vector database dans une application
          d'IA ?"
        answers:
          - "Stocker les fichiers binaires des modèles GGUF pour accélérer leur
            chargement"
          - "Sauvegarder l'historique brut des conversations utilisateurs en
            clair"
          - "Indexer et rechercher des embeddings vectoriels par similarité
            sémantique"
          - "Compiler le code source des agents intelligents en instructions
            optimisées"
        correct: 2
        explanation:
          "Une base de données vectorielle indexe des embeddings et permet des
          recherches par similarité sémantique, ce qui est central pour les
          usages comme le RAG."
      - id: q11
        question:
          "À quoi correspond le format de fichier GGUF dans l'écosystème des LLM
          ?"
        answers:
          - "Un format binaire conçu pour stocker et distribuer des modèles de
            langage quantifiés, exécutables localement"
          - "Un format texte décrivant la structure d'une base vectorielle"
          - "Un protocole réseau utilisé pour interroger les API d'OpenAI"
          - "Un format d'image optimisé pour l'entraînement des réseaux de
            neurones"
        correct: 0
        explanation:
          "GGUF (GPT-Generated Unified Format) est un format binaire popularisé
          par llama.cpp pour packager des modèles, souvent quantifiés, et les
          exécuter efficacement en local."
      - id: q12
        question:
          "Parmi ces outils, lequel est un service d'IA générative proposé en
          mode SaaS ?"
        answers:
          - "ChatGPT"
          - "llama.cpp"
          - "Ollama"
          - "GGUF"
        correct: 0
        explanation:
          "ChatGPT est accessible via le web ou une API, sans installation
          locale du modèle, ce qui correspond à un mode SaaS. Ollama et
          llama.cpp s'exécutent en local et GGUF est un format de fichier."
      - id: q13
        question:
          "Quel est un avantage typique du mode SaaS pour utiliser un LLM ?"
        answers:
          - "Aucune installation locale n'est nécessaire et l'infrastructure est
            gérée par le fournisseur"
          - "Les données envoyées restent garanties sur la machine de
            l'utilisateur"
          - "Le modèle peut être modifié librement dans son code source"
          - "Le coût est systématiquement nul, quel que soit l'usage"
        correct: 0
        explanation:
          "Le SaaS dispense l'utilisateur de gérer matériel et déploiement : il
          accède au LLM via une API ou une interface web, le fournisseur opérant
          l'infrastructure."
      - id: q14
        question: "Comment définit-on le prompt engineering ?"
        answers:
          - "L'art de formuler et structurer les instructions envoyées à un LLM
            pour obtenir des réponses pertinentes"
          - "La technique d'entraînement initial d'un modèle de langage sur un
            grand corpus"
          - "Le processus de quantification d'un modèle pour réduire sa taille"
          - "La conception matérielle des GPU dédiés à l'inférence"
        correct: 0
        explanation:
          "Le prompt engineering consiste à concevoir, formuler et affiner les
          requêtes (prompts) adressées à un LLM afin d'orienter et d'améliorer
          la qualité de ses réponses."
      - id: q15
        question:
          "Dans une architecture web intégrant un LLM, quel rôle joue
          typiquement le backend ?"
        answers:
          - "Recevoir les requêtes du frontend, appeler l'API du LLM et renvoyer
            la réponse au client"
          - "Entraîner le modèle de langage à chaque requête utilisateur"
          - "Stocker exclusivement les modèles au format GGUF dans le navigateur"
          - "Remplacer le LLM en générant lui-même les réponses sans appel
            externe"
        correct: 0
        explanation:
          "Le backend sert d'intermédiaire : il reçoit la demande du frontend,
          transmet le prompt au LLM (API ou modèle local), puis retourne la
          réponse, en gérant authentification, clés et éventuel contexte (RAG)."
      - id: q16
        question: "Qu'appelle-t-on une « hallucination » d'un LLM ?"
        answers:
          - "Une réponse plausible mais factuellement fausse, inventée par le
            modèle"
          - "Une panne matérielle du serveur d'inférence"
          - "Un refus explicite du modèle de répondre à la question"
          - "Une réponse identique répétée plusieurs fois de suite"
        correct: 0
        explanation:
          "Une hallucination désigne une sortie du LLM qui paraît crédible et
          bien formulée mais qui ne correspond pas à la réalité, faute de
          connaissances vérifiées."
      - id: q17
        question:
          "Quelle est la différence principale entre IA générative et IA
          prédictive ?"
        answers:
          - "L'IA générative produit de nouveaux contenus, tandis que l'IA
            prédictive estime une valeur ou une classe à partir de données
            existantes"
          - "L'IA générative ne fonctionne que sur des images, l'IA prédictive
            uniquement sur du texte"
          - "L'IA prédictive utilise des réseaux de neurones, l'IA générative
            seulement des règles symboliques"
          - "L'IA générative est supervisée, l'IA prédictive est toujours non
            supervisée"
        correct: 0
        explanation:
          "L'IA générative crée du contenu nouveau (texte, image, code), alors
          que l'IA prédictive vise à prédire une étiquette ou une valeur à
          partir d'observations."
      - id: q18
        question:
          "Quel est le principal apport des transformers par rapport aux réseaux
          récurrents (RNN) ?"
        answers:
          - "Le mécanisme d'attention qui permet de traiter les tokens en
            parallèle et de capter des dépendances longues"
          - "Une consommation mémoire systématiquement plus faible que les RNN"
          - "L'absence totale de phase d'entraînement"
          - "La suppression du besoin de tokeniser le texte d'entrée"
        correct: 0
        explanation:
          "Les transformers reposent sur l'attention, qui traite la séquence en
          parallèle et modélise efficacement les dépendances longues, là où les
          RNN traitent les tokens séquentiellement."
      - id: q19
        question:
          "Parmi ces situations, laquelle est un cas d'usage typique de l'IA
          pour un développeur ?"
        answers:
          - "Génération et complétion de code, explication d'erreurs et aide à
            la rédaction de tests"
          - "Remplacement automatique du système de build sans configuration"
          - "Compilation native du code source en binaire optimisé"
          - "Gestion bas niveau de la mémoire vive du processus"
        correct: 0
        explanation:
          "Les assistants IA aident principalement les développeurs à écrire,
          comprendre, refactorer du code et générer des tests, mais ne
          remplacent ni le compilateur ni le système de build."
      - id: q20
        question: "Quel est le rôle du tokenizer dans le pipeline d'un LLM ?"
        answers:
          - "Découper le texte d'entrée en tokens et les convertir en
            identifiants numériques exploitables par le modèle"
          - "Stocker durablement les conversations dans une base vectorielle"
          - "Générer directement la réponse finale à partir du prompt"
          - "Chiffrer le prompt avant son envoi au modèle"
        correct: 0
        explanation:
          "Le tokenizer transforme le texte brut en une séquence d'identifiants
          de tokens, étape indispensable avant que le modèle ne calcule ses
          embeddings et produise une sortie."
  - id: vscode-copilot
    title: "Visual Studio Code (VSCode) et GitHub Copilot"
    questions:
      - id: q1
        question: "Qu'est-ce que GitHub Copilot ?"
        answers:
          - "Un gestionnaire de versions concurrent de Git"
          - "Un assistant de programmation basé sur l'IA qui suggère du code et
            répond à des questions techniques"
          - "Un éditeur de code développé par GitHub pour remplacer VSCode"
          - "Un service d'hébergement de dépôts privés réservé aux entreprises"
        correct: 1
        explanation:
          "GitHub Copilot est un assistant de programmation propulsé par l'IA,
          intégré aux éditeurs comme VSCode, qui propose des suggestions de code
          et un chat conversationnel."
      - id: q2
        question:
          "Quels sont les prérequis indispensables pour utiliser GitHub Copilot
          dans VSCode ?"
        answers:
          - "Disposer uniquement d'une connexion internet, aucune installation
            n'est nécessaire"
          - "Installer Node.js et configurer un serveur local de modèles d'IA"
          - "Avoir VSCode installé, un compte GitHub avec un abonnement Copilot
            actif, et l'extension GitHub Copilot installée"
          - "Posséder une licence Visual Studio Enterprise et un compte
            Microsoft Azure"
        correct: 2
        explanation:
          "Pour utiliser Copilot dans VSCode, il faut l'éditeur, un compte
          GitHub avec un abonnement Copilot valide, et l'extension officielle
          GitHub Copilot installée et authentifiée."
      - id: q3
        question:
          "Quelle est la différence principale entre le mode chat de Copilot et
          la complétion inline ?"
        answers:
          - "Le chat ne fonctionne que hors ligne tandis que la complétion
            inline nécessite internet"
          - "Le chat permet une conversation en langage naturel pour poser des
            questions ou demander des modifications, alors que la complétion
            inline propose automatiquement du code dans l'éditeur pendant la
            frappe"
          - "Le chat génère uniquement de la documentation et la complétion
            inline génère uniquement des tests"
          - "Il n'y a aucune différence, ce sont deux noms pour la même
            fonctionnalité"
        correct: 1
        explanation:
          "Le chat Copilot est une interface conversationnelle pour dialoguer
          avec l'IA, tandis que la complétion inline affiche des suggestions
          grisées directement dans le code au fil de la saisie."
      - id: q4
        question:
          "Quel raccourci clavier permet d'accepter une suggestion de complétion
          proposée par Copilot dans VSCode ?"
        answers:
          - "Ctrl + Entrée"
          - "Échap"
          - "Tab"
          - "Alt + ]"
        correct: 2
        explanation:
          "La touche Tab permet d'accepter la suggestion de complétion inline
          affichée par Copilot ; Échap la rejette et Alt + ] permet de naviguer
          entre suggestions."
      - id: q5
        question:
          "Comment demander efficacement à Copilot d'implémenter une fonction à
          partir d'une signature ou d'un commentaire ?"
        answers:
          - "Écrire la signature de la fonction et/ou un commentaire descriptif
            décrivant son comportement attendu, puis laisser Copilot proposer
            l'implémentation"
          - "Renommer le fichier avec l'extension .copilot pour activer la
            génération automatique"
          - "Compiler le projet avec une option spéciale --copilot-generate"
          - "Supprimer toutes les autres fonctions du fichier afin que Copilot
            devine seul ce qu'il faut écrire"
        correct: 0
        explanation:
          "Copilot s'appuie sur le contexte : une signature claire et/ou un
          commentaire décrivant l'intention de la fonction suffisent pour qu'il
          propose une implémentation pertinente."
      - id: q6
        question:
          "Comment demander à GitHub Copilot Chat d'expliquer un bloc de code
          existant dans VSCode ?"
        answers:
          - "Sélectionner le code puis utiliser la commande /explain dans
            Copilot Chat"
          - "Compiler le projet et lire les warnings du compilateur"
          - "Renommer le fichier avec l'extension .explain pour déclencher
            l'analyse"
          - "Exécuter le code en mode debug pas-à-pas sans Copilot"
        correct: 0
        explanation:
          "Copilot Chat propose la commande /explain qui, appliquée à une
          sélection de code, en fournit une explication en langage naturel."
      - id: q7
        question:
          "Quel usage typique de GitHub Copilot permet d'accélérer la couverture
          de tests d'une fonction ?"
        answers:
          - "Lui demander de générer des tests unitaires à partir de la fonction
            sélectionnée"
          - "Lui demander de supprimer les assertions existantes pour simplifier
            le code"
          - "Lui demander de désactiver le linter du projet"
          - "Lui demander de compiler le code en binaire optimisé"
        correct: 0
        explanation:
          "Copilot, via la commande /tests ou une requête en langage naturel,
          peut proposer des tests unitaires couvrant les cas nominaux et limites
          d'une fonction."
      - id: q8
        question:
          "En quoi GitHub Copilot peut-il aider lors d'une refactorisation de
          code ?"
        answers:
          - "Il propose des réécritures plus lisibles ou plus performantes à
            partir d'une sélection et d'une consigne"
          - "Il publie automatiquement le code refactorisé sur la branche
            principale"
          - "Il garantit formellement l'absence de régression sans exécuter de
            tests"
          - "Il supprime toutes les dépendances externes du projet"
        correct: 0
        explanation:
          "Copilot suggère des refactorisations (extraction de fonctions,
          simplifications, renommages) à partir du code sélectionné et des
          instructions de l'utilisateur, mais la validation reste à la charge du
          développeur."
      - id: q9
        question:
          "Quelle est une limite importante de confidentialité à connaître
          lorsqu'on utilise GitHub Copilot ?"
        answers:
          - "Le code et le contexte envoyés en prompt sont transmis aux serveurs
            du fournisseur, ce qui peut être incompatible avec du code
            confidentiel"
          - "Copilot chiffre le code localement et n'envoie jamais rien sur le
            réseau"
          - "Copilot ne fonctionne qu'en local sans connexion Internet"
          - "Copilot supprime automatiquement tout secret détecté avant tout
            traitement, sans risque"
        correct: 0
        explanation:
          "Copilot envoie le contexte du fichier et les requêtes à un service
          distant ; il faut donc éviter de l'utiliser sur du code soumis à des
          contraintes strictes de confidentialité sans politique adaptée."
      - id: q10
        question:
          "Quelle différence principale distingue Copilot (complétion) de
          Copilot Chat ?"
        answers:
          - "La complétion suggère du code en ligne pendant la frappe, alors que
            Chat permet un dialogue en langage naturel pour expliquer, générer
            ou modifier du code"
          - "La complétion fonctionne hors ligne tandis que Chat nécessite une
            connexion"
          - "Chat ne sait que générer des commits, pas du code"
          - "La complétion ne fonctionne que pour le langage Python, Chat pour
            tous les langages"
        correct: 0
        explanation:
          "Copilot en mode complétion propose des suggestions inline au fil de
          la frappe, tandis que Copilot Chat offre une interface
          conversationnelle pour poser des questions et demander des
          transformations sur le code."
      - id: q11
        question:
          "Dans VSCode, comment peut-on utiliser un commentaire pour guider une
          suggestion de GitHub Copilot ?"
        answers:
          - "En écrivant un commentaire décrivant l'intention juste au-dessus de
            la ligne où l'on souhaite la suggestion"
          - "En plaçant obligatoirement le commentaire en toute fin de fichier"
          - "En utilisant uniquement des commentaires multi-lignes encadrés par
            /* */"
          - "En préfixant le commentaire par le mot-clé réservé @copilot"
        correct: 0
        explanation:
          "Copilot s'appuie sur le commentaire qui précède le curseur pour
          générer le code correspondant à l'intention décrite."
      - id: q12
        question:
          "Quelle tâche GitHub Copilot peut-il prendre en charge directement
          dans un fichier source ?"
        answers:
          - "Compiler le projet et exécuter les tests automatiquement"
          - "Générer une docstring ou des commentaires explicatifs pour une
            fonction existante"
          - "Déployer le code sur un serveur de production"
          - "Renommer automatiquement tous les fichiers du projet"
        correct: 1
        explanation:
          "Copilot peut produire des commentaires ou des docstrings décrivant le
          rôle, les paramètres et le retour d'une fonction à partir de son code."
      - id: q13
        question:
          "De quoi dépendent principalement les suggestions proposées par
          Copilot dans un fichier ?"
        answers:
          - "Uniquement du nom du fichier ouvert"
          - "Uniquement de la version de VSCode installée"
          - "Du contexte du fichier : code déjà écrit, imports, commentaires et
            signatures de fonctions"
          - "Exclusivement de la langue du système d'exploitation"
        correct: 2
        explanation:
          "Copilot analyse le contexte courant (code environnant, imports,
          commentaires) pour produire des suggestions cohérentes avec le
          fichier."
      - id: q14
        question: "Comment ouvre-t-on le panneau Copilot Chat dans VSCode ?"
        answers:
          - "En cliquant sur l'icône Copilot Chat dans la barre d'activité
            latérale de VSCode"
          - "En lançant une commande dans le terminal système hors de VSCode"
          - "En modifiant manuellement le fichier settings.json pour afficher
            une fenêtre flottante"
          - "En installant une extension de navigateur web séparée"
        correct: 0
        explanation:
          "Le panneau Copilot Chat s'ouvre depuis l'icône dédiée dans la barre
          d'activité de VSCode (ou via la palette de commandes)."
      - id: q15
        question:
          "Comment peut-on désactiver GitHub Copilot pour un langage ou un type
          de fichier précis ?"
        answers:
          - "Il faut désinstaller complètement l'extension Copilot"
          - "Il faut supprimer manuellement le fichier concerné du projet"
          - "Dans les paramètres de Copilot, on règle l'option d'activation par
            langage (enable) sur false pour le langage choisi"
          - "Cette désactivation ciblée n'est pas possible : Copilot est
            toujours actif partout"
        correct: 2
        explanation:
          "Les paramètres de Copilot permettent d'activer ou désactiver les
          suggestions pour chaque langage via l'option d'activation par langage."
      - id: q16
        question:
          "Quel compte est indispensable pour activer et utiliser GitHub Copilot
          dans VSCode ?"
        answers:
          - "Un compte Microsoft Azure"
          - "Un compte GitHub"
          - "Un compte Google Cloud"
          - "Un compte OpenAI"
        correct: 1
        explanation:
          "GitHub Copilot s'authentifie via un compte GitHub, qui sert à
          vérifier l'abonnement et à autoriser l'extension dans l'éditeur."
      - id: q17
        question:
          "Parmi les propositions suivantes, laquelle correspond à un plan
          tarifaire officiel de GitHub Copilot ?"
        answers:
          - "Copilot Free, Pro, Business et Enterprise"

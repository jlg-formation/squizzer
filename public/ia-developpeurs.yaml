      - id: q14
        question:
          "Quel est l'intérêt principal d'utiliser des variables d'environnement
          pour stocker les clés d'API ?"
        answers:
          - "Cela accélère significativement les appels réseau vers l'API"
          - "Cela évite d'écrire les clés en dur dans le code source et facilite
            leur gestion par environnement"
          - "Cela chiffre automatiquement les clés sur le disque du poste de

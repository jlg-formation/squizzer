        correct: 1
        explanation:
          "Une API LLM cloud répond généralement en quelques centaines de
          millisecondes à plusieurs secondes, la latence augmentant avec la
          taille du contexte et le nombre de tokens générés."
      - id: q17
        question:
          "Concernant la conformité RGPD des fournisseurs cloud d'IA, quelle

title: "QCM Améliorer son efficacité professionnelle avec l'IA"
chapters:
  - id: "panorama-ia"
    title: "Panorama de l'intelligence artificielle et prompting avancé"
    questions:
      - id: "q1"
        question:
          "Quel énoncé décrit le mieux le fonctionnement général d'une IA
          générative ?"
        answers:
          - "Elle prédit la suite la plus probable à partir de données
            d'entraînement et du prompt reçu."
          - "Elle recopie mot pour mot un document unique stocké dans sa
            mémoire."
          - "Elle applique uniquement des règles fixes écrites à la main pour
            chaque question."
          - "Elle se connecte toujours en direct à Internet pour fabriquer
            chaque réponse."
        correct: 0
        explanation:
          "Une IA générative produit une sortie en s'appuyant sur des
          régularités apprises dans ses données d'entraînement et sur
          l'instruction fournie. Elle ne se limite ni à une base de réponses
          figées ni à Internet."
      - id: "q2"
        question:
          "Quelle différence caractérise le mieux une IA analytique par rapport
          à une IA générative ?"
        answers:
          - "L'IA analytique sert surtout à classer, prédire ou détecter, alors
            que l'IA générative crée du contenu nouveau."
          - "L'IA analytique produit uniquement des images, alors que l'IA
            générative produit uniquement du texte."
          - "L'IA analytique fonctionne sans données, alors que l'IA générative
            exige des capteurs physiques."
          - "L'IA analytique est forcément plus récente que l'IA générative."
        correct: 0
        explanation:
          "L'IA analytique exploite des données pour reconnaître, prévoir ou
          décider. L'IA générative, elle, produit de nouveaux contenus comme du
          texte, des images ou des résumés."
      - id: "q3"
        question:
          "Quelle est la spécificité principale d'un grand modèle de langage ?"
        answers:
          - "Il est conçu pour modéliser le langage à grande échelle afin de
            comprendre et générer du texte."
          - "Il est spécialisé uniquement dans le calcul comptable et la paie."
          - "Il repose exclusivement sur des formulaires à choix multiples
            préparés à l'avance."
          - "Il ne traite que des bases de données chiffrées sans mots ni
            phrases."
        correct: 0
        explanation:
          "Un grand modèle de langage apprend des régularités sur d'immenses
          volumes de texte. Cela lui permet de reformuler, résumer, expliquer ou
          rédiger en langage naturel."
      - id: "q4"
        question:
          "Quel cas d'usage de l'IA est particulièrement utile dans un centre de
          formation ?"
        answers:
          - "Rédiger une relance claire et professionnelle pour un dossier
            d'inscription incomplet."
          - "Remplacer définitivement l'entretien pédagogique avec chaque
            apprenti."
          - "Signer automatiquement les conventions à la place du centre."
          - "Supprimer la vérification humaine des informations administratives."
        correct: 0
        explanation:
          "L'IA peut faire gagner du temps sur des tâches de rédaction comme une
          relance de dossier incomplet. En revanche, elle ne remplace ni la
          validation humaine ni les responsabilités du centre."
      - id: "q5"
        question:
          "Quelle limite importante découle du caractère probabiliste d'une
          réponse générée par IA ?"
        answers:
          - "Elle peut sembler convaincante tout en contenant une information
            fausse ou inventée."
          - "Elle ne peut répondre qu'à des questions déjà posées exactement de
            la même façon."
          - "Elle refuse systématiquement les sujets administratifs ou
            pédagogiques."
          - "Elle fournit toujours plusieurs réponses contradictoires à la fois."
        correct: 0
        explanation:
          "Une réponse probabiliste est produite selon ce qui paraît le plus
          plausible pour le modèle. Elle peut donc être fluide et crédible tout
          en étant inexacte, ce qui impose une vérification."
      - id: "q6"
        question:
          "Dans un prompt adressé à une IA, à quoi sert principalement un
          contexte précis sur la situation de l'utilisateur ?"
        answers:
          - "A guider la réponse vers un besoin concret et à réduire les
            ambiguïtés"
          - "A obliger l'IA à répondre plus vite, quel que soit le sujet"
          - "A remplacer complètement la consigne principale du prompt"
          - "A garantir que la réponse sera toujours juridiquement conforme"
        correct: 0
        explanation:
          "Le contexte aide l'IA à comprendre la situation, le public et
          l'objectif. Cela permet de produire une réponse plus pertinente et
          moins générique."
      - id: "q7"
        question:
          "Quel ensemble correspond le mieux aux éléments d'un prompt structuré
          ?"
        answers:
          - "Un objectif, un contexte, des contraintes et un format de sortie
            attendu"
          - "Un sujet, une blague, une signature et un mot-clé secret"
          - "Une question isolée, sans précision, suivie de plusieurs relances
            vagues"
          - "Un lien web, une image, un délai et une note de service"
        correct: 0
        explanation:
          "Un prompt structuré précise ce qu'il faut faire, dans quel contexte,
          avec quelles limites et sous quelle forme. Cette structure améliore la
          qualité de la réponse."
      - id: "q8"
        question:
          "Pourquoi est-il utile d'indiquer des contraintes explicites dans un
          prompt ?"
        answers:
          - "Parce qu'elles empêchent totalement l'IA de se tromper"
          - "Parce qu'elles définissent clairement les limites et les critères
            de la réponse attendue"
          - "Parce qu'elles rendent inutile toute relecture humaine"
          - "Parce qu'elles obligent l'IA à citer des sources vérifiées"
        correct: 1
        explanation:
          "Des contraintes explicites cadrent la production de l'IA, par exemple
          sur la longueur, le ton ou le format. Elles réduisent les écarts entre
          la demande et la réponse obtenue."
      - id: "q9"
        question:
          "Quel est l'intérêt principal d'ajouter un exemple dans un prompt ?"
        answers:
          - "Montrer à l'IA le type de réponse attendu en termes de forme ou de
            style"
          - "Éviter d'avoir à formuler une consigne précise"
          - "Garantir que l'IA produira exactement le même contenu à chaque fois"
          - "Empêcher l'IA d'utiliser ses connaissances générales"
        correct: 0
        explanation:
          "Un exemple sert de repère concret pour orienter la structure ou le
          niveau de détail attendu. Il aide l'IA à mieux aligner sa sortie sur
          le besoin."
      - id: "q10"
        question:
          "Quelle démarche illustre le mieux l'itération pour améliorer un
          prompt ?"
        answers:
          - "Réutiliser le même prompt plusieurs fois en espérant une meilleure
            réponse"
          - "Changer totalement de sujet dès que la première réponse est
            imparfaite"
          - "Analyser la réponse obtenue puis ajuster progressivement le prompt"
          - "Supprimer toutes les précisions pour laisser plus de liberté à l'IA"
        correct: 2
        explanation:
          "L'itération consiste à évaluer le résultat puis à modifier le prompt
          de manière ciblée. Cette amélioration progressive permet d'obtenir une
          réponse plus adaptée."
      - id: "q11"
        question:
          "Quelle pratique protège le mieux les données d'apprentis lors d'une
          demande à une IA générative ?"
        answers:
          - "Remplacer les noms, adresses et numéros de dossier par des éléments
            fictifs avant d'envoyer la demande"
          - "Envoyer le dossier complet si l'outil promet des réponses plus
            précises"
          - "Partager les données uniquement le matin pour limiter les risques"
          - "Ajouter davantage de détails personnels pour obtenir une réponse
            contextualisée"
        correct: 0
        explanation:
          "La pseudonymisation ou l'anonymisation réduit l'exposition de données
          personnelles. C'est la pratique la plus adaptée avant d'utiliser une
          IA avec des informations d'apprentis."
      - id: "q12"
        question:
          "Pour éviter une fuite d'informations partenaires, quelle consigne est
          la plus sûre avant d'utiliser une IA pour rédiger un message ?"
        answers:
          - "Copier l'ensemble du mail du partenaire pour que l'IA comprenne
            tout le contexte"
          - "Ne transmettre à l'IA que les éléments non sensibles et retirer
            noms, montants ou clauses confidentielles"
          - "Utiliser une IA différente pour chaque partenaire sans modifier le
            contenu"
          - "Envoyer la pièce jointe confidentielle puis supprimer la
            conversation après coup"
        correct: 1
        explanation:
          "Retirer les informations sensibles limite le risque de divulgation de
          données commerciales ou contractuelles. Changer d'outil ou supprimer
          après coup ne supprime pas le risque initial d'exposition."
      - id: "q13"
        question:
          "Quel principe du RGPD applique-t-on lorsqu'on ne fournit à une IA que
          les données strictement nécessaires à la tâche demandée ?"
        answers:
          - "La portabilité des données"
          - "La limitation de la conservation"
          - "La minimisation des données"
          - "Le droit d'opposition"
        correct: 2
        explanation:
          "Le principe de minimisation impose de ne traiter que les données
          adéquates, pertinentes et limitées à ce qui est nécessaire. Il
          s'applique directement lors de la préparation d'un prompt."
      - id: "q14"
        question:
          "Quelle méthode est la plus fiable pour vérifier un fait fourni par
          une IA dans une réponse métier ?"
        answers:
          - "Le comparer à des sources officielles ou documentées et récentes"
          - "Le conserver si la formulation semble professionnelle"
          - "Le valider si l'IA l'a répété deux fois de la même manière"
          - "Le considérer exact si plusieurs collègues l'ont trouvé plausible"
        correct: 0
        explanation:
          "Une information générée par l'IA doit être contrôlée par des sources
          fiables, traçables et à jour. La plausibilité perçue ne constitue pas
          une preuve."
      - id: "q15"
        question:
          "Quel indice permet le mieux de détecter une hallucination plausible
          dans une réponse d'IA ?"
        answers:
          - "La réponse utilise un vocabulaire simple et direct"
          - "La réponse cite un règlement, une date ou un organisme précis
            qu'aucune source vérifiable ne confirme"
          - "La réponse est plus courte que d'habitude"
          - "La réponse contient une liste à puces bien structurée"
        correct: 1
        explanation:
          "Une hallucination plausible ressemble souvent à une information
          précise et crédible, mais introuvable dans des sources vérifiables. Le
          niveau de détail apparent ne garantit pas la vérité."
      - id: "q16"
        question:
          "Quel indice montre le plus clairement qu'une réponse d'IA contient un
          biais de généralisation ?"
        answers:
          - "Elle affirme qu'un public agit toujours de la même manière sans
            nuance ni source vérifiable"
          - "Elle propose plusieurs hypothèses et précise ses limites"
          - "Elle demande des précisions avant de conclure"
          - "Elle distingue les faits observés des suppositions"
        correct: 0
        explanation:
          "Un biais de généralisation apparaît quand l'IA transforme des cas
          particuliers en règle générale sans preuve. Les formulations absolues
          et non sourcées sont un signal d'alerte."
      - id: "q17"
        question:
          "Un apprenti écrit qu'il risque de perdre son logement dans les 48
          heures. Quelle consigne de prompting est la plus adaptée pour obtenir
          une aide immédiatement exploitable et prudente ?"
        answers:
          - "Demander un message empathique sans autre précision"
          - "Demander une réponse structurée avec priorités immédiates, contacts
            utiles, limites juridiques et ton rassurant"
          - "Demander une réponse très courte pour gagner du temps"
          - "Demander à l'IA de décider seule de la meilleure aide financière à
            accorder"
        correct: 1
        explanation:
          "Dans une situation urgente, le prompt doit cadrer la priorité, le
          format attendu et les limites de l'IA. Cela aide à produire une
          réponse actionnable sans surpromettre."
      - id: "q18"
        question:
          "Pour répondre à une entreprise partenaire qui demande des
          informations sur un apprenti, quelle utilisation de l'IA est la plus
          conforme ?"
        answers:
          - "Faire rédiger par l'IA une réponse complète en incluant toutes les
            données du dossier interne"
          - "Demander à l'IA un brouillon neutre à partir d'informations
            minimisées, puis vérifier les faits avant envoi"
          - "Copier l'historique intégral des échanges avec l'apprenti pour
            donner du contexte à l'IA"
          - "Laisser l'IA répondre directement à l'entreprise sans relecture
            humaine"
        correct: 1
        explanation:
          "La bonne pratique consiste à minimiser les données partagées avec
          l'IA et à garder une validation humaine avant envoi. Cela réduit le
          risque de fuite d'information et d'erreur."
      - id: "q19"
        question:
          "Pour relancer efficacement un dossier incomplet avec l'IA, quel
          élément doit absolument figurer dans le prompt ?"
        answers:
          - "La demande d'un ton plus autoritaire pour accélérer la réponse"
          - "La liste précise des pièces manquantes et l'action attendue de la
            personne relancée"
          - "Le maximum d'informations personnelles disponibles sur le
            bénéficiaire"
          - "Une formulation volontairement vague pour laisser l'IA improviser"
        correct: 1
        explanation:
          "Une relance utile doit indiquer exactement ce qui manque et ce qui
          est attendu. Sans cette précision, l'IA risque de produire un message
          flou ou incomplet."
      - id: "q20"
        question:
          "Quel critère caractérise le mieux un prompt réutilisable dans un
          contexte professionnel ?"
        answers:
          - "Il repose sur des formulations implicites comprises seulement par
            son auteur"
          - "Il dépend d'un seul cas particulier pour rester concret"
          - "Il décrit le rôle, l'objectif, les entrées attendues et le format
            de sortie de manière stable"
          - "Il reste très court, même s'il oublie les contraintes essentielles"
        correct: 2
        explanation:
          "Un prompt réutilisable explicite son cadre d'usage et ses variables
          d'entrée. Il peut ainsi être repris sur plusieurs cas sans perdre en
          qualité ni en cohérence."
  - id: "organisation-ia"
    title:
      "Identifier ses pertes de temps et optimiser son organisation avec l'IA"
    questions:
      - id: "q1"
        question:
          "Quelle tâche doit être repérée en priorité comme chronophage pour
          envisager un gain de temps avec l'IA ?"
        answers:
          - "Une activité répétitive, fréquente et à faible valeur ajoutée"
          - "Une réunion mensuelle déjà cadrée et courte"
          - "Une pause informelle entre deux rendez-vous"
          - "Une tâche exceptionnelle réalisée une fois par an"
        correct: 0
        explanation:
          "Une tâche répétitive et peu stratégique est le meilleur point de
          départ pour gagner du temps avec l'IA. Son automatisation ou son
          accélération produit un bénéfice régulier."
      - id: "q2"
        question:
          "Pour trier rapidement les emails urgents avec l'IA, quel critère
          faut-il demander d'identifier en premier ?"
        answers:
          - "La longueur exacte de chaque message"
          - "La présence d'un ton chaleureux dans la signature"
          - "Les messages qui demandent une action immédiate ou ont une échéance
            proche"
          - "Les emails reçus le plus tôt dans la semaine"
        correct: 2
        explanation:
          "L'urgence se repère surtout par une action attendue rapidement ou une
          échéance proche. Ce critère permet un tri opérationnel immédiat."
      - id: "q3"
        question:
          "Quelle consigne donne le plus de chances d'obtenir avec l'IA une
          réponse email professionnelle et adaptée ?"
        answers:
          - "Rédige un message court sans contexte"
          - "Réponds librement comme tu veux"
          - "Écris une réponse polie"
          - "Rédige une réponse professionnelle en précisant le destinataire,
            l'objectif, le ton attendu et les éléments à inclure"
        correct: 3
        explanation:
          "Plus la consigne précise le contexte, le ton et les informations
          attendues, plus la réponse générée est exploitable. L'IA a besoin
          d'instructions cadrées pour produire un email professionnel."
      - id: "q4"
        question:
          "Pour générer une note de synthèse utile à partir d'informations
          brutes, quelle demande est la plus pertinente ?"
        answers:
          - "Recopie toutes les informations sans les organiser"
          - "Résume les idées clés en les classant par thèmes avec les points
            d'action essentiels"
          - "Supprime les détails et garde uniquement les dates"
          - "Transforme les informations en texte long sans titre"
        correct: 1
        explanation:
          "Une note de synthèse doit faire ressortir les idées principales de
          manière structurée. Le classement par thèmes et les points d'action la
          rendent directement utile."
      - id: "q5"
        question:
          "Pour créer un document structuré à partir d'un brouillon, quelle
          utilisation de l'IA est la plus efficace ?"
        answers:
          - "Lui demander de conserver le brouillon tel quel"
          - "Lui demander d'ajouter du texte au hasard pour remplir la page"
          - "Lui demander d'organiser le brouillon en sections claires avec
            titres et formulation finalisée"
          - "Lui demander uniquement de corriger les fautes sans revoir la
            structure"
        correct: 2
        explanation:
          "L'IA est utile pour transformer des idées brutes en document lisible
          et organisé. Une structure en sections avec des titres rend le contenu
          directement exploitable."
      - id: "q6"
        question:
          "Pour produire rapidement un courrier type personnalisé avec l'IA,
          quelle information faut-il fournir en priorité dans le prompt ?"
        answers:
          - "Le contexte du destinataire, l'objectif du courrier et les éléments
            variables à intégrer"
          - "Uniquement le nom du destinataire, car l'IA devine le reste"
          - "Une consigne très courte sans préciser le ton ni le but"
          - "Le logo de l'organisation, sans autre détail"
        correct: 0
        explanation:
          "Un courrier type personnalisé reste pertinent si l'IA connaît le
          destinataire, le but du message et les données à adapter. Sans ces
          éléments, le texte risque d'être trop générique."
      - id: "q7"
        question:
          "Vous disposez de notes éparses, d'emails et de points de réunion.
          Quel usage de l'IA correspond le mieux à une synthèse en compte-rendu
          ?"
        answers:
          - "Lui demander de reformuler chaque phrase séparément sans structure
            finale"
          - "Lui fournir les informations brutes et demander un compte-rendu
            structuré avec décisions, actions et points clés"
          - "Lui demander uniquement de corriger l'orthographe des notes"
          - "Lui faire générer un nouveau sujet sans tenir compte des
            informations sources"
        correct: 1
        explanation:
          "L'IA est utile pour transformer des informations dispersées en un
          compte-rendu organisé. La demande doit préciser la structure attendue
          et s'appuyer sur les éléments bruts fournis."
      - id: "q8"
        question:
          "Pour prioriser ses tâches quotidiennes avec l'IA, quel critère est le
          plus pertinent à faire analyser en premier ?"
        answers:
          - "La longueur du titre de chaque tâche"
          - "L'ordre alphabétique des dossiers concernés"
          - "Le niveau d'urgence et d'impact de chaque tâche"
          - "La préférence personnelle pour les tâches faciles"
        correct: 2
        explanation:
          "La priorisation efficace repose d'abord sur l'urgence et l'impact.
          L'IA peut alors aider à distinguer ce qui doit être traité
          immédiatement de ce qui peut attendre."
      - id: "q9"
        question:
          "Un besoin doit être traité dans les cinq minutes. Quel choix d'outil
          IA est le plus adapté à cette urgence ?"
        answers:
          - "Un outil de présentation pour concevoir des slides détaillées"
          - "Un assistant conversationnel capable de produire immédiatement une
            réponse ou un brouillon exploitable"
          - "Un outil d'analyse statistique nécessitant l'import complet d'un
            jeu de données"
          - "Un générateur d'images pour illustrer un document ultérieur"
        correct: 1
        explanation:
          "En situation d'urgence, il faut un outil qui donne un résultat
          textuel immédiat et directement réutilisable. Les outils plus lourds
          ou spécialisés font perdre du temps dans ce cas."
      - id: "q10"
        question:
          "Quelle méthode permet le mieux de mesurer le temps réellement gagné
          grâce à l'IA sur des tâches répétitives ?"
        answers:
          - "Comparer la durée moyenne avant et après usage de l'IA sur une même
            catégorie de tâches"
          - "Se fier à une impression générale en fin de semaine"
          - "Compter seulement le nombre de messages envoyés dans la journée"
          - "Mesurer uniquement le temps passé à ouvrir l'outil IA"
        correct: 0
        explanation:
          "La comparaison de durées sur des tâches comparables permet une mesure
          concrète du gain de temps. Une simple impression ne suffit pas pour
          évaluer l'effet réel de l'IA."
      - id: "q11"
        question:
          "Dans le cas d'un contrat d'apprentissage incomplet, quel usage de
          l'IA aide le mieux à gagner du temps sans oublier une pièce
          essentielle ?"
        answers:
          - "Lui demander une checklist des informations et justificatifs
            manquants a partir du dossier disponible"
          - "Lui demander de signer le contrat a la place de l'employeur"
          - "Lui demander de transmettre automatiquement le dossier a tous les
            organismes"
          - "Lui demander de remplacer la verification finale humaine"
        correct: 0
        explanation:
          "L'IA peut structurer les elements manquants et proposer une checklist
          exploitable rapidement. En revanche, elle ne remplace ni la signature
          ni le controle final humain."
      - id: "q12"
        question:
          "Pour suivre plusieurs dossiers administratifs en meme temps, quelle
          aide de l'IA est la plus pertinente ?"
        answers:
          - "Generer un tableau de suivi avec statut, prochaine action, pieces
            manquantes et echeances pour chaque dossier"
          - "Cloturer automatiquement les dossiers les plus anciens sans
            verification"
          - "Supprimer les dossiers sans reponse depuis une semaine"
          - "Fusionner tous les dossiers dans un seul document non classe"
        correct: 0
        explanation:
          "L'IA est utile pour consolider et prioriser l'information entre
          plusieurs dossiers. Elle fait gagner du temps en proposant un suivi
          structure et actionnable."
      - id: "q13"
        question:
          "Pour repondre a une demande d'aide sociale a partir d'elements bruts,
          quel resultat de l'IA est le plus adapte ?"
        answers:
          - "Un brouillon de reponse clair, empathique et structure, a relire
            avant envoi"
          - "Une decision definitive d'attribution de l'aide sans validation"
          - "Une suppression des informations personnelles du demandeur sans
            controle"
          - "Une reponse identique envoyee a tous les demandeurs, quel que soit
            leur cas"
        correct: 0
        explanation:
          "L'IA peut aider a rediger rapidement une reponse personnalisee et
          bien structuree. La decision et la validation finale doivent rester
          humaines."
      - id: "q14"
        question:
          "Pour produire une synthese de situation d'un apprenti a partir de
          notes dispersees, quel usage de l'IA est le plus efficace ?"
        answers:
          - "Transformer les notes en synthese concise avec faits, points
            d'attention et actions a suivre"
          - "Inventer les informations manquantes pour rendre la synthese plus
            complete"
          - "Remplacer l'entretien avec l'apprenti par un resume automatique"
          - "Conserver les notes brutes sans les reorganiser"
        correct: 0
        explanation:
          "L'IA est pertinente pour restructurer des informations eparses en
          synthese lisible. Elle ne doit ni inventer des faits ni se substituer
          aux echanges necessaires."
      - id: "q15"
        question:
          "Lors de la redaction d'un courrier a un organisme externe, quelle
          contribution de l'IA apporte le plus de valeur ?"
        answers:
          - "Proposer un courrier formel, clair et adapte au destinataire a

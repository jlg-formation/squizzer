        explanation:
          "Un bon point de depart est un besoin precis et frequent. Cela
          facilite le cadrage de l'agent, l'evaluation de sa valeur et son
          adoption par les utilisateurs."
      - id: "q5"
        question:
          "Quelle source d'information est la plus fiable pour alimenter un
          agent IA metier ?"
        answers:
          - "Des publications anonymes trouvees au hasard sur les reseaux
            sociaux"
          - "Des documents internes valides, des procedures a jour et des
            references officielles du domaine"
          - "Des opinions personnelles non verifiees recueillies oralement"
          - "Des contenus anciens sans date ni auteur identifiable"
        correct: 1
        explanation:
          "La fiabilite de l'agent depend de la qualite de ses sources. Des
          documents valides et a jour reduisent les erreurs et renforcent la
          confiance dans ses reponses."
      - id: "q6"
        question:
          "Quel élément décrit le mieux le rôle de l'instruction système dans un
          agent métier ?"
        answers:
          - "Elle fixe le rôle, le ton et les règles générales que l'agent doit
            suivre en permanence"
          - "Elle sert uniquement à mémoriser les réponses précédentes de
            l'utilisateur"
          - "Elle remplace les données métier nécessaires à l'agent"
          - "Elle permet seulement de choisir la langue de sortie"
        correct: 0
        explanation:
          "L'instruction système définit le cadre stable de l'agent, comme son
          rôle, ses priorités et ses limites. Elle guide tous les échanges, pas
          seulement un aspect isolé comme la langue."
      - id: "q7"
        question:
          "Dans un agent métier, à quoi servent principalement les garde-fous ?"
        answers:
          - "À accélérer automatiquement toutes les réponses sans contrôle"
          - "À empêcher les réponses hors périmètre, risquées ou non conformes
            aux consignes métier"
          - "À supprimer le besoin de vérifier les informations sensibles"
          - "À rendre l'agent plus créatif dans tous les contextes"
        correct: 1
        explanation:
          "Les garde-fous encadrent l'agent pour limiter les dérives et les
          usages inadaptés. Ils aident à maintenir des réponses sûres,
          pertinentes et conformes au métier."
      - id: "q8"
        question:
          "Quelle tâche est la plus adaptée à un agent IA configuré pour un
          gestionnaire administratif ?"
        answers:
          - "Composer une musique d'attente pour le standard"
          - "Élaborer un logo pour une campagne de communication"
          - "Rédiger un brouillon de courriel de relance pour un dossier
            incomplet à partir d'un modèle interne"
          - "Créer une animation vidéo de présentation d'un service"
        correct: 2
        explanation:
          "La rédaction d'un brouillon de relance à partir de règles et modèles
          internes correspond à un besoin typique de gestion administrative. Les
          autres propositions relèvent d'activités de création graphique ou
          multimédia."
      - id: "q9"
        question:
          "Pour un agent IA dédié à l'accompagnement des usagers ou apprenants,
          quelle tâche est la plus pertinente ?"
        answers:
          - "Générer un planning de maintenance informatique du bâtiment"
          - "Proposer une reformulation claire et bienveillante d'une consigne
            selon le niveau de la personne accompagnée"
          - "Négocier automatiquement des clauses contractuelles avec un
            fournisseur"
          - "Mettre à jour un inventaire comptable annuel"
        correct: 1
        explanation:
          "L'accompagnement demande d'adapter le message au niveau et aux
          besoins de la personne. La reformulation pédagogique et bienveillante
          correspond directement à cet usage."
      - id: "q10"
        question:
          "Quelle tâche convient le mieux à un agent IA personnalisé pour les
          relations entreprises ?"
        answers:
          - "Préparer un premier message de prise de contact avec une entreprise
            à partir de son secteur et de ses besoins potentiels"
          - "Classer automatiquement des archives papier sans numérisation"
          - "Calculer la paie mensuelle de tous les salariés"
          - "Corriger un problème réseau sur un poste distant"
        correct: 0
        explanation:
          "En relations entreprises, l'agent peut aider à préparer des messages
          ciblés et contextualisés pour initier un échange. Les autres tâches
          appartiennent à d'autres domaines métier."
      - id: "q11"
        question:
          "Quel indicateur permet le mieux d'évaluer la performance d'un agent
          IA utilisé dans un métier ?"
        answers:
          - "Le taux de réponses utiles validées par l'utilisateur sur des
            tâches réelles"
          - "Le nombre total de couleurs dans l'interface de l'outil"
          - "La taille du logo de la solution choisie"
          - "Le nombre de comptes créés le premier jour sans usage effectif"
        correct: 0
        explanation:
          "Un bon indicateur de performance mesure l'utilité réelle de l'agent
          dans le travail. Le taux de réponses utiles validées est directement
          lié à la valeur produite."
      - id: "q12"
        question:
          "Dans un plan d'intégration de l'IA au quotidien, quelle approche est
          la plus adaptée pour démarrer durablement ?"
        answers:
          - "Déployer tous les usages possibles en une seule semaine"
          - "Choisir quelques tâches récurrentes, définir des rituels d'usage et
            suivre les résultats"
          - "Réserver l'IA aux situations d'urgence uniquement"
          - "Supprimer immédiatement les méthodes de travail existantes"
        correct: 1
        explanation:
          "Un plan d'intégration efficace commence par des usages concrets et
          réguliers. Des rituels clairs et un suivi des résultats facilitent
          l'ancrage dans le quotidien."
      - id: "q13"
        question:
          "Quel critère doit guider en priorité le déploiement d'un usage IA
          dans une équipe ?"
        answers:
          - "L'usage le plus impressionnant en démonstration, même sans besoin
            métier clair"
          - "L'usage qui demande le plus de fonctionnalités avancées"
          - "L'usage qui apporte rapidement de la valeur sur une tâche fréquente
            et coûteuse en temps"
          - "L'usage choisi au hasard pour aller plus vite"
        correct: 2
        explanation:
          "La priorité doit aller aux usages à fort impact métier et à mise en
          oeuvre raisonnable. Gagner du temps sur une tâche fréquente crée
          rapidement de la valeur visible."
      - id: "q14"
        question:
          "Quelle mesure reflète le mieux l'adoption d'un assistant IA par
          l'équipe ?"
        answers:
          - "Le pourcentage de membres qui l'utilisent régulièrement dans leurs
            tâches prévues"
          - "Le nombre de slides de présentation diffusées lors du lancement"
          - "Le volume de messages promotionnels envoyés par la direction"
          - "La durée de la réunion d'annonce du projet"
        correct: 0
        explanation:
          "L'adoption se mesure par l'usage réel et répété dans le travail. Un
          taux d'utilisation régulière sur les cas prévus est un signal concret
          d'appropriation."
      - id: "q15"
        question:
          "Quelle pratique aide le mieux à maintenir les compétences IA d'une
          équipe dans le temps ?"
        answers:
          - "Éviter toute évolution des pratiques pour garder des repères
            stables"
          - "Prévoir une veille, des retours d'expérience et des mises à jour
            régulières des usages"
          - "Limiter l'IA à une seule personne pour centraliser le savoir"
          - "Changer d'outil chaque semaine sans formation associée"
        correct: 1
        explanation:
          "Les compétences IA se maintiennent par l'apprentissage continu et le
          partage d'expérience. Une veille organisée et des ajustements
          réguliers évitent l'obsolescence des pratiques."
      - id: "q16"
        question:
          "Quelle pratique permet le mieux d'assurer une veille utile sur les
          évolutions des outils d'IA de son métier ?"
        answers:
          - "Suivre les notes de version, tester les nouveautés sur un cas
            métier et noter leur impact"
          - "Attendre que l'outil change d'interface pour regarder ce qui a été
            ajouté"
          - "Se limiter aux publicités des éditeurs pour connaître les
            nouveautés"
          - "Changer d'outil tous les mois pour rester à jour"
        correct: 0
        explanation:
          "Une veille utile combine information fiable et expérimentation sur
          des cas réels. Cela permet d'évaluer l'intérêt concret des évolutions
          pour son métier."
      - id: "q17"
        question:
          "Quelle est une limite majeure d'un agent IA utilisé sans supervision
          humaine dans un contexte professionnel ?"
        answers:
          - "Il devient automatiquement plus lent avec le temps"
          - "Il peut produire ou exécuter des résultats erronés sans qu'ils
            soient détectés à temps"
          - "Il ne peut plus traiter que des demandes très courtes"
          - "Il perd forcément l'accès aux données internes de l'entreprise"
        correct: 1
        explanation:
          "Sans supervision, une erreur plausible peut passer inaperçue et être
          réutilisée ou appliquée. La validation humaine reste nécessaire pour
          sécuriser l'usage."
      - id: "q18"
        question:
          "Après plusieurs retours utilisateurs signalant des réponses trop
          vagues d'un agent, quelle amélioration est la plus pertinente ?"
        answers:
          - "Supprimer les retours pour éviter de biaiser l'évaluation de
            l'agent"
          - "Ajouter davantage de questions à l'agent sans modifier son cadrage"
          - "Analyser les retours, préciser les consignes de réponse et retester
            sur des cas similaires"
          - "Conserver le fonctionnement actuel pour mesurer si les utilisateurs
            s'habituent"
        correct: 2
        explanation:
          "Les retours utilisateurs servent à identifier un défaut concret puis
          à ajuster l'agent. Le retest sur des cas comparables vérifie que
          l'amélioration est réelle."
      - id: "q19"
        question:
          "Quel exemple correspond à un plan d'action personnel réaliste pour
          progresser avec l'IA dans son métier ?"
        answers:
          - "Automatiser tout son travail en une semaine sans phase de test"
          - "Prévoir chaque semaine un créneau court pour tester un usage précis
            et en mesurer le gain"
          - "Attendre la prochaine refonte complète des outils avant de
            commencer"
          - "Se fixer comme objectif d'utiliser dix nouveaux outils par jour"
        correct: 1
        explanation:
          "Un plan réaliste est progressif, mesurable et compatible avec le
          temps disponible. Il vise des usages ciblés plutôt qu'une
          transformation brutale."
      - id: "q20"
        question:
          "Quelle démarche favorise le mieux la pérennisation des usages de l'IA
          dans un métier ?"
        answers:
          - "Réserver l'usage de l'IA à une seule personne experte sans partage"
          - "Changer régulièrement de méthode sans documenter ce qui fonctionne"
          - "Formaliser les bonnes pratiques, suivre les bénéfices obtenus et
            les réviser dans le temps"
          - "Utiliser l'IA uniquement lors des urgences pour éviter d'en
            dépendre"
        correct: 2
        explanation:
          "La pérennisation repose sur des pratiques explicites, réutilisables
          et évaluées. Documenter et revoir les usages permet de les maintenir
          dans la durée."
